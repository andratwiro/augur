<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>City explorations — Project front-office views</title>
  <link rel="stylesheet" href="assets/govocal-tokens.css" />
  <link rel="stylesheet" href="assets/govocal-ui.css" />
  <script src="assets/govocal-themes.js" defer></script>
  <script src="assets/govocal-icons.js" defer></script>
  <script src="assets/govocal-avatars.js" defer></script>
  <script src="assets/govocal-partbar.js" defer></script>
  <!--
    CITY EXPLORATIONS (parallel-participation).
    A single, responsive front-office PROJECT PAGE, rendered across several real
    cities + configurations to explore the two new parallel-participation
    Content-Builder widgets in context:
      • ABOUT BOX (participation box) — current-phase CTA filled (tenant), parallel
        methods outlined, >2 collapse to one "Participate · N ways", participants row.
      • EXTRA SURVEYS — a linked survey as a button or one of 11 card layouts
        (incl. the accessible "Easy read"), primary/secondary, or a multi-survey list.
    A city chip (top) swaps the variant AND the tenant theme via ?city= / ?theme=,
    so every view is shareable. Page chrome + components are canonical .gv-*; the
    widget CSS is ported from parallel-editor-builder-v2 (re-scoped to .pv).
    Self-contained prototype: assets are copied locally.
  -->
  <style>
    body { margin: 0; background: #fff; }
    main { padding-bottom: 8px; }

    /* ── Page layout (from pages/project-page — layout only, no colour authored) ── */
    .pp-managers { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap; padding: 24px 0 0; }
    .pp-banner { width: 100%; aspect-ratio: 1150 / 300; min-height: 200px; border-radius: var(--gv-radius); overflow: hidden; margin-top: 12px; }
    .pp-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pp-head { padding: 32px 0 40px; }
    .pp-head h1 { margin: 18px 0 16px; }
    .pp-row { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 10px 44px; align-items: start; }
    .pp-intro { margin: 0; }
    .pp-aside { display: flex; flex-direction: column; gap: 18px; }
    @media (max-width: 820px) {
      .pp-row { grid-template-columns: 1fr; }
      .pp-aside { margin-bottom: 26px; }
    }

    /* ── LAYOUT ENGINE — each city composes the same modules in a different order to
       showcase the Content Builder's freedom to move blocks around. A layout is an
       array of rows; a row is one full-width module or a multi-column grid. ── */
    /* Each top-level module is its own row in the page stack. The partbar and the
       phases band are visually one unit, so flush that seam only — every other
       adjacency keeps the 32px rhythm (incl. a survey card sitting above the partbar). */
    .pv-page > * + * { margin-top: 32px; }
    .pv-page > .gv-partbar + .gv-methodband { margin-top: 0; }
    .pv-block { padding: 0; }
    .pv-row2 { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 24px 44px; align-items: start; }
    .pv-row-eq { display: grid; grid-template-columns: repeat(var(--n,2), minmax(0,1fr)); gap: 24px 44px; align-items: start; }
    .pv-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
    .pv-aside { display: flex; flex-direction: column; gap: 18px; }
    .pv-h1 { margin: 0; }
    .pv-intro { margin: 0; }
    .pv-about-wide { max-width: 560px; }
    /* 3-column survey-card grid below the events calendar */
    .pv-survey-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .pv-survey-grid > * { min-width: 0; max-width: 100%; box-sizing: border-box; }
    /* 3 stacked single-button survey links inside the content section */
    .pv-surveys__btns { display: flex; flex-direction: column; gap: 10px; max-width: 560px; }
    .pv-surveys__btns .pv-survey-btnrow { display: flex; flex-direction: column; gap: 4px; }
    .pv-surveys__btns .pv-survey-btnrow small { font-size: 12.5px; color: var(--gv-text-secondary); }

    @media (max-width: 900px) {
      .pv-survey-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .pv-row2 { grid-template-columns: 1fr; gap: 24px; }
      .pv-row-eq { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .pv-survey-grid { grid-template-columns: 1fr; }
      .pv-page > * + * { margin-top: 24px; }
    }

    /* ── ABOUT BOX (participation box) — ported from parallel-editor-builder-v2 ──
       The resident-facing participation widget: CTA(s) then a participants row.
       Current-phase method = filled tenant button; parallel methods = outlined;
       >2 visible collapse into one "Participate · N ways". --pp-tenant follows the
       city theme so the box re-colours per ?theme=. */
    .pv { --pp-tenant: var(--gv-tenant-primary); }
    .pv .pv-pbox { display: flex; flex-direction: column; gap: 14px; }
    .pv .pv-pbox__actions { display: flex; flex-direction: column; gap: 8px; }
    .pv .cb-pbtn { display: block; width: 100%; box-sizing: border-box; text-align: center; padding: 12px 16px; border-radius: 3px; font-weight: 700; font-size: 15px; line-height: 1.2; text-decoration: none; cursor: pointer; }
    .pv .cb-pbtn--primary { background: var(--pp-tenant); color: #fff; border: 1px solid var(--pp-tenant); }
    .pv .cb-pbtn--outline { background: #fff; color: var(--gv-text-primary); border: 1px solid var(--gv-grey-400); }
    .pv .cb-pbtn--outline:hover { border-color: var(--pp-tenant); color: var(--pp-tenant); }
    .pv .pv-pbox__people { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 2px; }
    .pv .pv-pbox__people .gv-avatars { margin: 0; }
    /* Participant avatars match the real product's compact cluster — measured 36px
       total (border included) on partizipation.linz.at, vs the larger hero/spotlight
       avatars. border-box so the 2px ring counts inside the 36px footprint. */
    .pv .pv-pbox__people .gv-avatars .av { box-sizing: border-box; width: 36px; height: 36px; }
    .pv .pv-pbox__empty { border: 1px dashed var(--gv-grey-400); border-radius: 3px; text-align: center; padding: 14px; font-size: var(--gv-fs-13); color: var(--gv-cool-grey-600); }
    /* When the about box stands in the wide left column (gallery), keep it readable */
    .pv .pv-pbox--inset { border: 1px solid var(--gv-grey-200); border-radius: var(--gv-radius); padding: 18px; background: #fff; }

    /* ── PARTICIPATE SHEET — the collapsed "Participate · N ways" button opens this,
       revealing each method as its own button. Centred modal on desktop, bottom
       sheet on small screens. --pp-tenant on the panel so the method buttons theme. */
    .pv-sheet { --pp-tenant: var(--gv-tenant-primary); position: fixed; inset: 0; z-index: 1000; display: none; }
    .pv-sheet.open { display: block; }
    .pv-sheet__scrim { position: absolute; inset: 0; background: rgba(15, 23, 35, .5); opacity: 0; transition: opacity .2s ease; }
    .pv-sheet.open .pv-sheet__scrim { opacity: 1; }
    .pv-sheet__panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -48%); opacity: 0;
      width: min(440px, calc(100% - 32px)); box-sizing: border-box; background: #fff; border-radius: var(--gv-radius);
      padding: 22px 22px 24px; box-shadow: 0 24px 56px -12px rgba(0, 0, 0, .4); transition: opacity .2s ease, transform .2s ease; }
    .pv-sheet.open .pv-sheet__panel { transform: translate(-50%, -50%); opacity: 1; }
    .pv-sheet__grip { display: none; }
    .pv-sheet__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .pv-sheet__title { margin: 0; font-size: 19px; font-weight: 700; color: var(--gv-text-primary); }
    .pv-sheet__sub { margin: 6px 0 18px; font-size: 13.5px; line-height: 1.45; color: var(--gv-text-secondary); }
    .pv-sheet__close { flex: none; width: 32px; height: 32px; margin: -4px -4px 0 0; border: 0; border-radius: 50%;
      background: var(--gv-grey-100); color: var(--gv-text-secondary); font-size: 20px; line-height: 1; cursor: pointer; }
    .pv-sheet__close:hover { background: var(--gv-grey-200); color: var(--gv-text-primary); }
    .pv-sheet__actions { display: flex; flex-direction: column; gap: 10px; }
    @media (max-width: 560px) {
      .pv-sheet__panel { left: 0; right: 0; bottom: 0; top: auto; width: 100%; transform: translateY(100%); opacity: 1;
        border-radius: 18px 18px 0 0; padding: 12px 18px calc(22px + env(safe-area-inset-bottom));
        transition: transform .28s cubic-bezier(.32, .72, 0, 1); }
      .pv-sheet.open .pv-sheet__panel { transform: translateY(0); }
      .pv-sheet__grip { display: block; width: 38px; height: 4px; border-radius: 100px; background: var(--gv-grey-300); margin: 0 auto 14px; }
    }

    /* ── EXTRA SURVEYS widget — ported verbatim (re-scoped #cb-root → .pv) ── */
    .pv-surveys { margin-top: 8px; }
    .pv-surveys__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
    .pv-surveys__head h2 { margin: 0; }
    /* single card / button is constrained so card layouts read at a sensible measure */
    .pv-surveys__one { max-width: 560px; }

    .pv .cb-extra__list { display: flex; flex-direction: column; gap: 8px; }
    .pv .cb-survey-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1px solid var(--gv-grey-300); border-radius: var(--gv-radius); background: #fff; }
    .pv .cb-survey-row__info { display: flex; flex-direction: column; }
    .pv .cb-survey-row__name { font-weight: 600; color: var(--gv-text-primary); }
    .pv .cb-survey-row__meta { font-size: var(--gv-fs-s); color: var(--gv-cool-grey-600); }

    .pv .cb-survey .gv-btn.full { width: 100%; justify-content: center; }
    /* Both button styles follow the tenant: this scope re-points --gv-tenant-primary
       to the city colour (it already is on the FO page, so this is a safe no-op that
       also documents intent) + derives an AA-safe tint/ink pair. */
    .pv .cb-survey { --gv-tenant-primary: var(--pp-tenant); --svc-tint: color-mix(in srgb, var(--pp-tenant) 9%, #fff);
      --svc-ink: color-mix(in srgb, var(--pp-tenant) 55%, #111); }
    .pv .cb-survey__name { font-size: 20px; font-weight: 700; color: var(--gv-text-primary); margin: 10px 0 4px; }
    .pv .cb-survey__range { font-size: 12.5px; color: var(--gv-text-secondary); margin: 0; }
    .pv .cb-survey__desc { font-size: 13.5px; color: var(--gv-text-primary); line-height: 1.5; margin: 12px 0 16px; }
    .pv .cb-survey--card { border: 1px solid var(--gv-grey-300); border-radius: 3px; padding: 18px; background: #fff; box-shadow: var(--gv-shadow,0 2px 4px -1px rgba(0,0,0,.06)); }
    .pv .cb-survey__eyebrow { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--svc-ink); background: var(--svc-tint); padding: 3px 8px; border-radius: 3px; }

    /* card variants */
    .pv .svc .gv-btn.full { margin-top: 2px; }
    .pv .svc-meta { font-size: 12.5px; color: var(--gv-text-secondary); margin: 0; }
    .pv .svc-ic { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; background: var(--gv-grey-100); color: var(--gv-text-secondary); flex: none; }
    .pv .svc-ic .gv-icon { width: 20px; height: 20px; }
    .pv .svc-ic--tint { background: var(--svc-tint); color: var(--pp-tenant); }
    .pv .svc-ic--lg { width: 56px; height: 56px; border-radius: 12px; }
    .pv .svc-ic--lg .gv-icon { width: 26px; height: 26px; }
    .pv .svc--compact { padding: 14px 16px; }
    .pv .svc-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .pv .svc-title-sm { font-size: 16px; font-weight: 700; color: var(--gv-text-primary); margin: 0 0 2px; }
    .pv .svc-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .pv .svc-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--gv-text-secondary); background: var(--gv-grey-100); border-radius: 100px; padding: 4px 10px; }
    .pv .svc-chip .gv-icon { width: 13px; height: 13px; }
    .pv .svc-chip--accent { background: var(--svc-tint); color: var(--svc-ink); }
    .pv .svc-chip--accent .gv-icon { color: var(--pp-tenant); }
    .pv .svc-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gv-green-500); display: inline-block; }
    .pv .svc-social { display: flex; align-items: center; gap: 10px; margin: 6px 0 16px; }
    .pv .svc-social .gv-avatars { margin: 0; }
    .pv .svc-social .av { width: 30px; height: 30px; }
    .pv .svc-social__txt { font-size: 13px; color: var(--gv-text-secondary); }
    .pv .svc-social__txt strong { color: var(--gv-text-primary); }
    .pv .svc--accent { border-left: 4px solid var(--pp-tenant); }
    .pv .svc-accent__head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .pv .svc-accent__head .cb-survey__name { margin: 6px 0 0; }
    .pv .svc--banner { padding: 0; overflow: hidden; }
    .pv .svc-banner { display: flex; align-items: center; gap: 8px; background: var(--svc-tint); color: var(--svc-ink); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 11px 18px; }
    .pv .svc-banner .gv-icon { width: 16px; height: 16px; color: var(--pp-tenant); }
    .pv .svc-banner__body { padding: 16px 18px 18px; }
    .pv .svc-banner__body .cb-survey__name { margin-top: 0; }
    .pv .svc-toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .pv .svc-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #9A3412; background: var(--gv-orange-100,#ffece6); border-radius: 3px; padding: 4px 8px; white-space: nowrap; }
    .pv .svc-pill .gv-icon { width: 12px; height: 12px; }
    .pv .svc-progress { height: 6px; border-radius: 100px; background: var(--gv-grey-200); overflow: hidden; margin: 14px 0 6px; }
    .pv .svc-progress > span { display: block; height: 100%; border-radius: 100px; background: var(--pp-tenant); }
    .pv .svc-progress__lbl { font-size: 12px; color: var(--gv-text-secondary); margin: 0 0 14px; }
    .pv .svc-h { display: flex; gap: 14px; margin-bottom: 14px; }
    .pv .svc-h__txt { min-width: 0; }
    .pv .svc-h__txt .cb-survey__name { margin-top: 0; }
    .pv .svc-h__txt .svc-meta { margin: 2px 0 8px; }
    .pv .svc-stats { display: flex; gap: 8px; margin: 14px 0 16px; }
    .pv .svc-stat { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--gv-grey-50,#f7f8f9); border-radius: 8px; padding: 10px; }
    .pv .svc-stat .gv-icon { width: 18px; height: 18px; color: var(--pp-tenant); flex: none; }
    .pv .svc-stat strong { display: block; font-size: 14px; color: var(--gv-text-primary); line-height: 1.15; }
    .pv .svc-stat span { font-size: 11px; color: var(--gv-text-secondary); }
    .pv .svc--minimal { border: none; box-shadow: none; background: transparent; padding: 6px 2px; }
    .pv .svc-eyebrow-min { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--gv-text-secondary); }
    .pv .svc-eyebrow-min .gv-icon { width: 14px; height: 14px; }
    .pv .svc-title-min { font-size: 18px; font-weight: 700; color: var(--gv-text-primary); margin: 8px 0 2px; }
    .pv .svc--easy { padding: 22px; }
    .pv .svc-easy__tag { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--svc-ink); }
    .pv .svc-easy__tag .gv-icon { width: 18px; height: 18px; color: var(--pp-tenant); }
    .pv .svc-easy__title { font-size: 23px; font-weight: 700; color: var(--gv-text-primary); line-height: 1.25; margin: 12px 0 8px; }
    .pv .svc-easy__desc { font-size: 16px; color: var(--gv-text-primary); line-height: 1.6; margin: 0 0 16px; }
    .pv .svc--easy .svc-chips { margin: 0 0 18px; }
    .pv .svc--easy .svc-chip { font-size: 14px; padding: 6px 12px; }
    .pv .svc--easy .svc-chip .gv-icon { width: 15px; height: 15px; }
    .pv .svc--easy .gv-btn { font-size: 14px; font-weight: 700; padding: 11px 14px; min-height: 44px; line-height: 20px; }

    /* ── Phase method body (compact, canonical .gv-* components) ── */
    .pv-feed { display: grid; grid-template-columns: minmax(0,1fr) 280px; gap: 28px; align-items: start; }
    @media (max-width: 820px) { .pv-feed { grid-template-columns: 1fr; } .pv-feed .gv-feedfilter { display: none; } }
    .pv-feed__col { display: flex; flex-direction: column; gap: 14px; }
    .pv-prose { max-width: 720px; }
    .pv-prose p { color: var(--gv-grey-800,#43515D); line-height: 1.6; }
    .pv-vote { display: flex; flex-direction: column; gap: 12px; max-width: 720px; }
    .pv-votecard { border: 1px solid var(--gv-grey-200); border-radius: var(--gv-radius); padding: 16px 18px; background: #fff; }
    .pv-votecard__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .pv-votecard__title { font-weight: 700; color: var(--gv-text-primary); margin: 0; }
    .pv-votebar { height: 8px; border-radius: 100px; background: var(--gv-grey-200); overflow: hidden; margin: 12px 0 6px; }
    .pv-votebar > span { display: block; height: 100%; background: var(--pp-tenant); border-radius: 100px; }
    .pv-votecard__meta { font-size: 12.5px; color: var(--gv-text-secondary); margin: 0; }
    .pv-stats { display: flex; flex-wrap: wrap; gap: 14px; }
    .pv-statbig { flex: 1 1 140px; border: 1px solid var(--gv-grey-200); border-radius: var(--gv-radius); padding: 16px 18px; background: #fff; }
    .pv-statbig strong { display: block; font-size: 26px; font-weight: 800; color: var(--pp-tenant); line-height: 1.1; }
    .pv-statbig span { font-size: 12.5px; color: var(--gv-text-secondary); }
    .pv-survintro { max-width: 560px; border: 1px solid var(--gv-grey-200); border-radius: var(--gv-radius); padding: 22px; background: #fff; }
    .pv-survintro h3 { margin: 0 0 8px; }
    .pv-survintro p { color: var(--gv-text-secondary); margin: 0 0 16px; }

    /* ── City switcher chip (own UI; default theme picker is OFF) ──
       Pinned TOP-centre, just under the sticky header — the participation bar docks
       to the BOTTOM once scrolled, so a bottom chip would collide with it. */
    #pv-switch { position: fixed; z-index: 2147483000; left: 50%; top: 74px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 4px; max-width: calc(100vw - 24px); padding: 6px;
      border-radius: 999px; background: #fff; box-shadow: 0 6px 24px -4px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.05);
      font-family: var(--gv-font-family, 'Public Sans', system-ui, sans-serif); overflow-x: auto; -webkit-overflow-scrolling: touch; }
    @media (max-width: 760px) { #pv-switch { top: 64px; } }
    #pv-switch::-webkit-scrollbar { display: none; }
    .pv-chip { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; cursor: pointer; padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--gv-text-primary,#1c2024); white-space: nowrap; }
    .pv-chip:hover { background: var(--gv-grey-100,#f1f3f5); }
    .pv-chip__sw { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.08) inset; }
    .pv-chip[aria-pressed="true"] { color: #fff; }
    .pv-chip[aria-pressed="true"] .pv-chip__sw { box-shadow: 0 0 0 2px #fff inset; }
    .pv-chip:focus-visible { outline: 2px solid var(--gv-tenant-primary); outline-offset: 1px; }
    .pv-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--gv-cool-grey-600); }

    /* "Configuration" caption under the title so each view explains itself */
    .pv-config { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--gv-tenant-primary); margin: 0 0 4px; }
    .pv-config .gv-icon { width: 14px; height: 14px; }
  </style>
</head>
<body class="gv-root gv-shell pv" data-gv-theme-picker="off">

  <!-- ════════ Header ════════ -->
  <header class="gv-header sticky">
    <div class="gv-header__inner">
      <a class="gv-brand" href="#" data-gv-logo aria-label="City home"></a>
      <nav class="gv-nav" aria-label="Primary">
        <ul class="gv-nav__list">
          <li><a class="gv-nav__link" href="#">Home</a></li>
          <li>
            <details class="gv-nav__dd">
              <summary class="gv-nav__link">All projects
                <svg class="gv-nav__chev" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </summary>
              <div class="gv-nav__menu">
                <a href="#">This project</a>
                <a href="#">The big downtown survey</a>
                <a href="#">Participatory budget 2026</a>
                <a href="#">A greener Station Road</a>
              </div>
            </details>
          </li>
          <li><a class="gv-nav__link" href="#">Proposals</a></li>
          <li><a class="gv-nav__link" href="#">Events</a></li>
        </ul>
      </nav>
      <div class="gv-header__actions">

  const ic = (n) => `<span class="gv-icon" data-gv-icon="${n}"></span>`;

  // ── ABOUT BOX (participation box) ──
  function aboutBoxHTML(a, opts) {
    opts = opts || {};
    let actions = '';
    if (a.mode === 'multi') {
      const vis = a.methods.slice().sort((x, y) => (y.current ? 1 : 0) - (x.current ? 1 : 0));
      if (vis.length <= 2) {
        actions = vis.map((m) => `<a class="gv-btn full ${m.current ? 'primary' : 'primary-outlined'}" href="#"><span class="gv-btn__label">${m.cta}</span></a>`).join('');
      } else {
        const payload = JSON.stringify(vis.map((m) => ({ cta: m.cta, current: !!m.current })));
        const title = a.aggTitle || 'Participate';
        actions = `<button type="button" class="gv-btn full primary pv-agg" aria-haspopup="dialog" data-title="${title}" data-methods='${payload}'><span class="gv-btn__label">${title}</span></button>`;
      }
    } else {
      if (a.primary) actions += `<a class="gv-btn full primary" href="#"><span class="gv-btn__label">${a.primary}</span></a>`;
      if (a.secondary) actions += `<a class="gv-btn full primary-outlined" href="#"><span class="gv-btn__label">${a.secondary}</span></a>`;
    }
    const people = a.participants
      ? `<div class="gv-participants pv-pbox__people"><span class="gv-avatars on-light" aria-hidden="true"><span class="av"></span><span class="av"></span><span class="av"></span></span><span class="gv-pcount">${a.count} ${a.label || 'participants'}</span></div>`
      : '';
    let inner = (actions ? `<div class="pv-pbox__actions">${actions}</div>` : '') + people;
    if (!inner) inner = '<div class="pv-pbox__empty">No active methods</div>';
    return `<div class="pv-pbox${opts.inset ? ' pv-pbox--inset' : ''}">${inner}</div>`;
  }

  // ── EXTRA SURVEYS ──
  function surveyBtn(style, label) {
    const cls = 'gv-btn full ' + (style === 'secondary' ? 'primary-outlined' : 'primary');
    return `<a class="${cls}" href="#"><span class="gv-btn__label">${label}</span></a>`;
  }
  function surveyCard(s, variant, style) {
    const btn = surveyBtn(style, s.cta);
    const eyebrow = '<span class="cb-survey__eyebrow">SURVEY</span>';
    const title = `<h3 class="cb-survey__name">${s.name}</h3>`;
    const range = `<p class="cb-survey__range">${s.range}</p>`;
    const desc = `<p class="cb-survey__desc">${s.desc}</p>`;
    const open = (mod) => `<div class="cb-survey cb-survey--card svc svc--${mod}">`;
    const close = '</div>';
    switch (variant) {
      case 'compact':
        return open('compact') + `<div class="svc-row"><span class="svc-ic">${ic('survey')}</span><div><h3 class="svc-title-sm">${s.name}</h3><p class="svc-meta">≈ ${s.minutes} · ${s.questions} questions</p></div></div>` + btn + close;
      case 'quick':
        return open('quick') + `<div class="svc-chips"><span class="svc-chip svc-chip--accent">${ic('clock')}${s.minutes}</span><span class="svc-chip"><span class="svc-dot"></span>${s.status}</span></div>` + title + desc + btn + close;
      case 'social':
        return open('social') + eyebrow + title + desc + `<div class="svc-social"><span class="gv-avatars on-light"><span class="av"></span><span class="av"></span><span class="av"></span></span><span class="svc-social__txt"><strong>${s.responses}</strong> residents have responded</span></div>` + btn + close;
      case 'accent':
        return open('accent') + `<div class="svc-accent__head"><span class="svc-ic svc-ic--tint">${ic('survey')}</span><div>${eyebrow}${title}</div></div>` + desc + btn + close;
      case 'banner':
        return open('banner') + `<div class="svc-banner">${ic('survey')}<span>Survey</span></div><div class="svc-banner__body">${title}${range}${desc}${btn}</div>` + close;
      case 'deadline':
        return open('deadline') + `<div class="svc-toprow">${eyebrow}<span class="svc-pill">${ic('clock')}${s.closesIn}</span></div>` + title + desc + `<div class="svc-progress"><span style="width:${s.progress}%"></span></div><p class="svc-progress__lbl">${s.progress}% of the response window has passed</p>` + btn + close;
      case 'horizontal':
        return open('horizontal') + `<div class="svc-h"><span class="svc-ic svc-ic--lg svc-ic--tint">${ic('survey')}</span><div class="svc-h__txt">${title}<p class="svc-meta">≈ ${s.minutes} · ${s.status}</p>${desc}</div></div>` + btn + close;
      case 'detailed':
        return open('detailed') + eyebrow + title + range + desc + `<div class="svc-stats"><div class="svc-stat">${ic('clock')}<div><strong>${s.minutes}</strong><span>to complete</span></div></div><div class="svc-stat">${ic('survey')}<div><strong>${s.questions}</strong><span>questions</span></div></div><div class="svc-stat">${ic('group')}<div><strong>${s.responses}</strong><span>responses</span></div></div></div>` + btn + close;
      case 'minimal':
        return open('minimal') + `<span class="svc-eyebrow-min">${ic('survey')} Survey</span><h3 class="svc-title-min">${s.name}</h3><p class="svc-meta">≈ ${s.minutes} · ${s.status}</p>` + btn + close;
      case 'easy':
        return open('easy') + `<span class="svc-easy__tag">${ic('survey')} Survey</span><h3 class="svc-easy__title">${s.name}</h3><p class="svc-easy__desc">${s.desc}</p>` + btn + close;
      default:
        return open('standard') + eyebrow + title + range + desc + btn + close;
    }
  }
  function surveysHTML(cfg) {
    if (!cfg || cfg.layout === 'none') return '';
    let body = '';
    if (cfg.layout === 'buttons') {
      // The "single button" Extra-surveys variant, used several times to link out to
      // a few different surveys from inside the text content (no card chrome).
      body = `<div class="cb-survey pv-surveys__btns">${cfg.buttons.map((b) =>
        `<div class="pv-survey-btnrow">${surveyBtn(b.style, b.label)}${b.note ? `<small>${b.note}</small>` : ''}</div>`
      ).join('')}</div>`;
    } else if (cfg.layout === 'list') {
      body = `<div class="cb-extra__list">${cfg.list.map((s) => `<div class="cb-survey-row"><div class="cb-survey-row__info"><span class="cb-survey-row__name">${s.name}</span><span class="cb-survey-row__meta">${s.meta}</span></div><a class="gv-btn primary-outlined size-s" href="#">${s.cta}</a></div>`).join('')}</div>`;
    } else {
      const s = SURVEYS[cfg.survey];
      const one = cfg.format === 'button'
        ? `<div class="cb-survey">${surveyBtn(cfg.style, s.cta)}</div>`
        : surveyCard(s, cfg.variant || 'easy', cfg.style);
      body = `<div class="pv-surveys__one">${one}</div>`;
    }
    const head = cfg.heading === '' ? '' : `<div class="pv-surveys__head"><h2 class="gv-title h3">${cfg.heading || 'Extra surveys'}</h2></div>`;
    return `<section class="pv-surveys">${head}${body}</section>`;
  }

    { title: 'A safe crossing for the school run', author: 'Aisha Karimi', time: '3 weeks ago', excerpt: 'So many children cross here to get to school. A raised crossing and slower traffic would make mornings safer.', likes: 52, dislikes: 1, comments: 4, status: 'implemented', img: 'street-trees' }
  ];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function ideaCard(d) {
    const thumb = `<div class="gv-ideacard__thumb"><img src="assets/img/westmere/${d.img}.webp" alt="" loading="lazy" /></div>`;
    const initials = d.author.split(' ').map((w) => w[0]).slice(0, 2).join('');
    const SC = { 'accepted': '', 'implemented': 'is-implemented', 'under consideration': 'is-considered', 'proposed': 'is-proposed' };
    return `<article class="gv-ideacard">${thumb}<div class="gv-ideacard__body"><h3 class="gv-ideacard__title"><a href="#">${esc(d.title)}</a></h3><div class="gv-ideacard__head"><span class="gv-ideacard__avatar" aria-hidden="true">${esc(initials)}</span><div><div class="gv-ideacard__meta"><span class="gv-ideacard__author">${esc(d.author)}</span><span class="gv-ideacard__sep" aria-hidden="true">&bull;</span><span class="gv-ideacard__time">${esc(d.time)}</span></div><p class="gv-ideacard__excerpt">${esc(d.excerpt)}</p></div></div><footer class="gv-ideacard__foot"><div class="gv-react"><button class="gv-react__btn" aria-label="Like"><span data-gv-icon="vote-up"></span></button><span class="gv-react__count">${d.likes}</span><button class="gv-react__btn" aria-label="Dislike"><span data-gv-icon="vote-down"></span></button><span class="gv-react__count">${d.dislikes}</span></div><span class="gv-react__comment"><span data-gv-icon="comments"></span>${d.comments}</span><span class="gv-ideacard__status ${SC[d.status] ?? ''}">${esc(d.status)}</span></footer></div></article>`;
  }
  const METHODS = {
    ideation() {
      return `<div class="pv-feed"><div class="pv-feed__col">${IDEAS.map(ideaCard).join('')}</div>
        <aside class="gv-feedfilter" aria-label="Filter ideas">
          <div><p class="gv-feedfilter__label">SORT BY</p><div class="gv-feedfilter__group gv-feedfilter__group--sort">
            <button class="gv-feedfilter__btn is-active" type="button"><span class="gv-feedfilter__icon" data-gv-icon="idea"></span>Most liked</button>
            <button class="gv-feedfilter__btn" type="button"><span class="gv-feedfilter__icon" data-gv-icon="comments"></span>Most discussed</button>
            <button class="gv-feedfilter__btn" type="button"><span class="gv-feedfilter__icon" data-gv-icon="clock"></span>Newest</button></div></div>
          <div><p class="gv-feedfilter__label">STATUS</p><div class="gv-feedfilter__group">
            <button class="gv-feedfilter__btn is-active" type="button">All <span class="gv-feedfilter__count">122</span></button>
            <button class="gv-feedfilter__btn" type="button">Accepted <span class="gv-feedfilter__count">18</span></button></div></div>
        </aside></div>`;
    },
    survey(p) {
      return `<div class="pv-survintro"><h3 class="gv-title h3">${p.name}</h3><p>${p.description} Your answers are saved as you go, so you can stop and finish later.</p><a class="gv-btn primary" href="#"><span class="gv-btn__label">Start the survey</span></a></div>`;
    },
    information() {
      const acc = (q, p) => `<details class="gv-acc__item"><summary class="gv-acc__head"><span class="gv-acc__q">${q}</span><span class="gv-acc__chev" data-gv-icon="chevron-right"></span></summary><div class="gv-acc__body"><p>${p}</p></div></details>`;
      return `<div class="pv-prose gv-prose"><p>During this phase we read every contribution, removed duplicates, and grouped the remaining ideas into themes. Below is how the process worked and what comes next.</p></div><div class="gv-accordion" style="max-width:720px">${acc('How were ideas grouped?', 'Ideas were clustered by theme and by where they sit. Near-identical ideas were merged, keeping the original authors credited.')}${acc('What happens next?', 'The shortlist moves forward to prioritisation, where residents help decide which ideas to take into the final design.')}</div>`;
    },
    voting() {
      const v = (t, pct, meta) => `<div class="pv-votecard"><div class="pv-votecard__top"><p class="pv-votecard__title">${t}</p><a class="gv-btn primary-outlined size-s" href="#">Give points</a></div><div class="pv-votebar"><span style="width:${pct}%"></span></div><p class="pv-votecard__meta">${meta}</p></div>`;
      return `<div class="pv-vote">${v('New play area and trees in the square', 72, '€180,000 · 1,140 points so far')}${v('Protected cycle lane on the avenue', 58, '€120,000 · 910 points so far')}${v('Evening lighting along the riverside', 41, '€90,000 · 640 points so far')}</div>`;
    },
    results() {
      return `<div class="pv-stats"><div class="pv-statbig"><strong>3,128</strong><span>residents took part</span></div><div class="pv-statbig"><strong>€500k</strong><span>district budget allocated</span></div><div class="pv-statbig"><strong>7</strong><span>projects funded</span></div></div><div class="pv-prose gv-prose" style="margin-top:18px"><p>The vote is closed and the funded projects are heading into delivery. Followers of this project will get an update as each one starts.</p></div>`;
    }
  };
  function methodBody(p) {
    if (METHODS[p.method]) return METHODS[p.method](p);
    const icon = { proposals: 'idea', volunteering: 'volunteer' }[p.method] || 'info-outline';
    return `<div style="display:flex;gap:14px;align-items:flex-start;max-width:640px;"><span class="gv-icon" data-gv-icon="${icon}" style="color:var(--gv-tenant-primary);width:28px;height:28px;flex:none;"></span><div><p style="margin:0 0 6px;font-weight:600;color:var(--gv-text-primary);">${p.name} — ${p.method} phase</p><p style="margin:0;color:var(--gv-text-secondary);">This phase will open here when it goes live.</p></div></div>`;
  }

  /* ════════════════════════ Page render ════════════════════════ */
  function eventCard(e) {
    return `<article class="gv-event-card bordered"><div class="gv-event-card__media"><img src="assets/img/westmere/${e[6]}.webp" alt="" loading="lazy" /></div><div class="gv-event-card__body"><div class="gv-event-card__titlerow"><span class="gv-event-card__date is-beside"><span class="m">${e[0]}</span><span class="d">${e[1]}</span><span class="y">2026</span></span><h3 class="gv-event-card__title"><a href="#">${e[2]}</a></h3></div><div class="gv-event-card__meta"><p class="gv-event-card__row"><span data-gv-icon="clock"></span> ${e[3]}</p><p class="gv-event-card__row"><span data-gv-icon="location-simple"></span> ${e[4]}</p><p class="gv-event-card__row"><span data-gv-icon="user"></span> ${e[5]} registrants</p></div><a class="gv-btn primary full" href="#">Register</a></div></article>`;
  }

  let activePhase = 0;

  // ── LAYOUT ENGINE ──
  // Each city composes the same canonical modules in its own order, to showcase the
  // Content Builder's freedom to move blocks around. `v.layout` is an array of entries:
  //   • a string  → one full-width module
  //   • {row:[[keys],[keys]], tpl} → a multi-column row (tpl 'main-aside' or 'eq')
  // Two modules are full-bleed bands rendered specially: 'timeline' and 'partbar'.
  const DEFAULT_LAYOUT = ['banner', 'title', { row: [['intro', 'desc', 'surveys'], ['about']], tpl: 'main-aside' }, 'partbar', 'timeline', 'events'];

  function renderProject(v) {
    const cur = v.phases.findIndex((p) => p.status === 'current');
    activePhase = cur < 0 ? 0 : cur;
    const acc = (v.accordion || []).map(([q, p]) => `<details class="gv-acc__item"><summary class="gv-acc__head"><span class="gv-acc__q">${q}</span><span class="gv-acc__chev" data-gv-icon="chevron-right"></span></summary><div class="gv-acc__body"><p>${p}</p></div></details>`).join('');
    const partbarCTA = v.about && v.about.mode === 'multi' ? (v.about.methods.find((m) => m.current) || {}).cta : (v.about && v.about.primary);

    // Module content renderers (return inner HTML; no full-width wrapper).
    const M = {
      banner: () => `<section class="pp-banner" aria-label="Project banner"><img src="assets/img/westmere/${v.banner}.webp" alt="" loading="lazy" /></section>`,
      title: () => `<h1 class="gv-title h1 pv-h1">${v.title}</h1>`,
      intro: () => `<div class="gv-projdesc pv-intro"><p>${v.intro}</p></div>`,
      desc: () => `<div class="gv-projdesc">${v.desc || ''}${acc ? `<div class="gv-accordion" style="margin-top:20px">${acc}</div>` : ''}</div>`,
      about: () => `<div class="pv-aside pv-about-wide">${aboutBoxHTML(v.about)}</div>`,
      surveys: () => surveysHTML(v.surveys),
      surveyGrid: () => (v.surveyGrid && v.surveyGrid.length)
        ? `<section class="pv-surveys"><div class="pv-surveys__head"><h2 class="gv-title h3">${v.surveyGridHeading || 'More surveys you can take'}</h2></div><div class="pv-survey-grid">${v.surveyGrid.map((key) => surveyCard(SURVEYS[key], 'easy', v.surveyGridStyle || 'primary')).join('')}</div></section>`
        : '',
      events: () => (v.events && v.events.length)
        ? `<section class="gv-section"><div class="gv-events__head"><h2 class="gv-title h2" style="margin:0">Events</h2><a class="gv-btn text" href="#">View all events</a></div><div class="gv-events__grid">${v.events.map(eventCard).join('')}</div></section>`
        : ''
    };

    const timelineBand = `<div class="gv-methodband"><div class="gv-wrap"><section class="gv-phases" aria-labelledby="phasesTitle"><div class="gv-phases__bar"><h2 id="phasesTitle">Phases</h2></div><div class="gv-stepper" role="tablist" aria-label="Project phases" id="stepper"></div><div class="gv-phasepanel" id="phasepanel"></div><div class="gv-phasebody gv-phasebody--full" role="tabpanel" id="phasebody"></div></section></div></div>`;
    const partbarBand = `<div class="gv-partbar"><div class="gv-partbar__inner"><span class="gv-partbar__status">Open for participation</span><a class="gv-btn on-color" href="#">${partbarCTA || 'Take part'} <span data-gv-icon="arrow-right" aria-hidden="true"></span></a></div></div>`;

    const chunks = (v.layout || DEFAULT_LAYOUT).map((entry) => {
      if (entry === 'timeline') return timelineBand;
      if (entry === 'partbar') return partbarBand;
      if (typeof entry === 'string') {
        const html = M[entry] ? M[entry]() : '';
        return html ? `<div class="gv-wrap"><div class="pv-block">${html}</div></div>` : '';
      }
      if (entry && entry.row) {
        const rowCls = entry.tpl === 'eq' ? 'pv-row-eq' : 'pv-row2';
        const style = entry.tpl === 'eq' ? ` style="--n:${entry.row.length}"` : '';
        const cols = entry.row.map((keys) => `<div class="pv-col">${keys.map((k) => (M[k] ? M[k]() : '')).join('')}</div>`).join('');
        return `<div class="gv-wrap"><div class="pv-block ${rowCls}"${style}>${cols}</div></div>`;
      }
      return '';
    }).join('');

    return `<div class="pv-page">${chunks}</div>`;
  }

  function renderStepperAndPhase(v) {
    const CURRENT = v.phases.findIndex((p) => p.status === 'current');
    const cur = CURRENT < 0 ? 0 : CURRENT;
    const stepperEl = document.getElementById('stepper');
    const panelEl = document.getElementById('phasepanel');
    const bodyEl = document.getElementById('phasebody');
    function paint() {
      stepperEl.innerHTML = v.phases.map((p, i) => {
        const isCur = i === cur, dot = isCur ? '<span class="gv-pstep__dot"></span>' : '';
        return `<button class="gv-phase${isCur ? ' current' : ''}" role="tab" data-i="${i}" aria-selected="${i === activePhase}"><span class="gv-pstep">${dot}${i + 1}</span><span class="gv-phase__label">${p.name}</span></button>`;
      }).join('');
      stepperEl.querySelectorAll('.gv-phase').forEach((b) => b.addEventListener('click', () => { activePhase = +b.dataset.i; paint(); }));
      const p = v.phases[activePhase], isCur = activePhase === cur;
      panelEl.innerHTML = `<div class="gv-phasepanel__head${isCur ? '' : ' muted'}"><span class="gv-phasepanel__num" aria-hidden="true">${activePhase + 1}</span><div><h3 class="gv-phasepanel__name">${p.name}</h3><p class="gv-phasepanel__date">${p.dates}</p></div></div><div class="gv-phasepanel__desc"><p>${p.description}</p></div>`;
      bodyEl.innerHTML = methodBody(p);
      if (window.GVIcons) window.GVIcons.render();
      if (window.GVAvatars) window.GVAvatars.fill();
    }
    paint();
  }

  /* ════════════════════════ Boot + city switcher ════════════════════════ */
  const main = document.getElementById('pv-main');

  function applyTheme(themeId) {
    const t = (window.GV_THEMES || []).find((x) => x.id === themeId) || (window.GV_THEMES || [])[0];
    if (!t) return;
    const r = document.documentElement.style;
    r.setProperty('--gv-tenant-primary', t.primary);
    r.setProperty('--gv-tenant-secondary', t.secondary);
    r.setProperty('--gv-tenant-text', t.text);
    if (t.font) r.setProperty('--gv-font-family', t.font); else r.removeProperty('--gv-font-family');
    document.documentElement.setAttribute('data-gv-theme', t.id);
    // re-fill any logo slots with this city's mark
    if (window.GVThemeLogo) document.querySelectorAll('[data-gv-logo]').forEach((el) => { el.innerHTML = window.GVThemeLogo(t); });
  }

  function render(idx) {
    const v = VARIANTS[idx];
    applyTheme(v.theme);
    main.innerHTML = renderProject(v);
    renderStepperAndPhase(v);
    if (window.GVIcons) window.GVIcons.render();
    if (window.GVAvatars) window.GVAvatars.fill();
    if (window.GVPartbar && window.GVPartbar.init) window.GVPartbar.init();
    // reflect in chip + URL
    document.querySelectorAll('.pv-chip').forEach((c) => c.setAttribute('aria-pressed', String(+c.dataset.idx === idx)));
    document.querySelectorAll('.pv-chip').forEach((c) => { c.style.background = (+c.dataset.idx === idx) ? VARIANTS[idx]._primary : ''; });
    try {
      const url = new URL(window.location.href);
      url.searchParams.set('city', v.key);
      url.searchParams.set('theme', v.theme);
      window.history.replaceState({}, '', url);
    } catch (e) {}
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function buildSwitcher() {
    const themes = window.GV_THEMES || [];
    const wrap = document.createElement('div');
    wrap.id = 'pv-switch';
    wrap.setAttribute('role', 'tablist');
    wrap.setAttribute('aria-label', 'City exploration');
    let html = '';
    VARIANTS.forEach((v, i) => {
      const t = themes.find((x) => x.id === v.theme) || {};
      v._primary = t.primary || '#444';
      html += `<button class="pv-chip" role="tab" data-idx="${i}" aria-pressed="false" title="${v.city} — ${v.config}"><span class="pv-chip__sw" style="background:${v._primary}"></span>${v.city}</button>`;
    });
    wrap.innerHTML = html;
    document.body.appendChild(wrap);
    wrap.querySelectorAll('.pv-chip').forEach((c) => c.addEventListener('click', () => render(+c.dataset.idx)));
  }

  /* ════════════════════════ Participate sheet ════════════════════════ */
  let sheetEl = null, lastTrigger = null;
  function ensureSheet() {
    if (sheetEl) return sheetEl;
    sheetEl = document.createElement('div');
    sheetEl.className = 'pv-sheet pv';
    sheetEl.innerHTML =
      '<div class="pv-sheet__scrim" data-close></div>' +
      '<div class="pv-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="pv-sheet-title">' +
        '<div class="pv-sheet__grip"></div>' +
        '<div class="pv-sheet__head"><h2 class="pv-sheet__title" id="pv-sheet-title"></h2>' +
          '<button type="button" class="pv-sheet__close" data-close aria-label="Close">&times;</button></div>' +
        '<p class="pv-sheet__sub">Choose how you’d like to take part — each method opens on the next screen.</p>' +
        '<div class="pv-sheet__actions"></div>' +
      '</div>';
    document.body.appendChild(sheetEl);
    sheetEl.querySelectorAll('[data-close]').forEach((el) => el.addEventListener('click', closeSheet));
    return sheetEl;
  }
  function openSheet(title, methods) {
    const s = ensureSheet();
    s.querySelector('.pv-sheet__title').textContent = title;
    s.querySelector('.pv-sheet__actions').innerHTML = methods.map((m) =>
      `<a class="gv-btn full ${m.current ? 'primary' : 'primary-outlined'}" href="#"><span class="gv-btn__label">${m.cta}</span></a>`
    ).join('');
    requestAnimationFrame(() => s.classList.add('open'));
    document.body.style.overflow = 'hidden';
    const close = s.querySelector('.pv-sheet__close');
    if (close) close.focus();
  }
  function closeSheet() {
    if (!sheetEl) return;
    sheetEl.classList.remove('open');
    document.body.style.overflow = '';
    if (lastTrigger) { lastTrigger.focus(); lastTrigger = null; }
  }
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.pv-agg');
    if (!btn) return;
    e.preventDefault();
    lastTrigger = btn;
    let methods = [];
    try { methods = JSON.parse(btn.dataset.methods || '[]'); } catch (err) {}
    openSheet(btn.dataset.title || 'Participate', methods);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  function start() {
    buildSwitcher();
    const params = new URLSearchParams(window.location.search);
    const key = params.get('city');
    let idx = VARIANTS.findIndex((v) => v.key === key);
    if (idx < 0) idx = 0;
    render(idx);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
  </script>
</body>
</html>
