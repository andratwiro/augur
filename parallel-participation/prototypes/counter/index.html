<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Counter — GoVocal Prototype</title>
  <link rel="stylesheet" href="govocal-tokens.css" />
  <link rel="stylesheet" href="govocal-ui.css" />
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--gv-background); padding:24px; }
    .card { max-width:440px; width:100%; text-align:center; }
    .count { font-size:56px; font-weight:700; font-variant-numeric:tabular-nums; margin:8px 0 20px; color:var(--gv-tenant-primary); }
    .controls { display:flex; gap:10px; justify-content:center; }
    a.back { display:inline-block; margin-top:24px; color:var(--gv-tenant-primary); text-decoration:none; font-size:var(--gv-fs-s); font-weight:600; }
    a.back:hover { text-decoration:underline; }
  </style>
</head>
<body class="gv-root">
  <main class="card gv-card">
    <h1 class="gv-title h2" style="margin-bottom:8px">Counter</h1>
    <div class="count" id="count" aria-live="polite">0</div>
    <div class="controls">
      <button class="gv-btn primary" id="inc">Count +1</button>
      <button class="gv-btn secondary" id="reset">Reset</button>
    </div>
    <a class="back" href="../">← All prototypes</a>
  </main>
  <script src="govocal-themes.js" defer></script>
  <script>
    let n = 0;
    const out = document.getElementById("count");
    document.getElementById("inc").addEventListener("click", () => { n++; out.textContent = n; });
    document.getElementById("reset").addEventListener("click", () => { n = 0; out.textContent = n; });
  </script>
</body>
</html>
