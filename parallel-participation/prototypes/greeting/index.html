<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Greeting — GoVocal Prototype</title>
  <link rel="stylesheet" href="govocal-tokens.css" />
  <link rel="stylesheet" href="govocal-ui.css" />
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--gv-background); padding:24px; }
    .card { max-width:440px; width:100%; text-align:center; border:1px solid var(--gv-border-light); }
    .card .gv-label { display:block; text-align:left; }
    .out { margin:18px 0 4px; font-size:var(--gv-fs-l); min-height:1.5em; color:var(--gv-tenant-text); }
    a.back { display:inline-block; margin-top:24px; color:var(--gv-tenant-primary); text-decoration:none; font-size:var(--gv-fs-s); font-weight:600; }
    a.back:hover { text-decoration:underline; }
  </style>
</head>
<body class="gv-root">
  <main class="card gv-card">
    <h1 class="gv-title h2">Greeting</h1>
    <label class="gv-label" for="name">Your name</label>
    <input class="gv-input" id="name" type="text" placeholder="Type your name…" autofocus />
    <div class="out" id="out">Hello, world 👋</div>
    <a class="back" href="../">← All prototypes</a>
  </main>
  <script src="govocal-themes.js" defer></script>
  <script>
    const input = document.getElementById("name");
    const out = document.getElementById("out");
    input.addEventListener("input", () => {
      const n = input.value.trim();
      out.textContent = n ? `Hello, ${n} 👋` : "Hello, world 👋";
    });
  </script>
</body>
</html>
