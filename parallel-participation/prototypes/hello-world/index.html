<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hello World — GoVocal Prototype</title>
  <link rel="stylesheet" href="govocal-tokens.css" />
  <link rel="stylesheet" href="govocal-ui.css" />
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--gv-background); padding:24px; }
    .card { max-width:440px; width:100%; text-align:center; }
    .card p.sub { color:var(--gv-text-secondary); margin:0 0 24px; }
    .count { margin-top:16px; font-variant-numeric:tabular-nums; color:var(--gv-text-secondary); font-size:var(--gv-fs-s); }
    a.back { display:inline-block; margin-top:24px; color:var(--gv-tenant-primary); text-decoration:none; font-size:var(--gv-fs-s); font-weight:600; }
    a.back:hover { text-decoration:underline; }
  </style>
</head>
<body data-gv-theme-picker="off" class="gv-root">
  <main class="card gv-card">
    <h1 class="gv-title h2" style="margin-bottom:8px">Hello, world 👋</h1>
    <p class="gv-text bodyM sub">Self-contained static prototype for <strong>Parallel Participation</strong>.</p>
    <button class="gv-btn primary" id="cta"><span class="gv-btn__label">Click me</span></button>
    <div class="count" id="count">No clicks yet</div>
    <a class="back" href="../">← All prototypes</a>
  </main>
  <script src="govocal-themes.js" defer></script>
  <script>
    const btn = document.getElementById("cta");
    const out = document.getElementById("count");
    let n = 0;
    btn.addEventListener("click", () => {
      n += 1;
      out.textContent = n === 1 ? "1 click" : n + " clicks";
    });
  </script>
</body>
</html>
