<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>City Theme Preview — GoVocal Prototype</title>
  <link rel="stylesheet" href="govocal-tokens.css" />
  <link rel="stylesheet" href="govocal-ui.css" />
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--gv-background); padding:24px; }
    .card { max-width:460px; width:100%; }
    .swatches { display:flex; gap:10px; margin:4px 0 20px; }
    .sw { flex:1; height:60px; border-radius:var(--gv-radius); display:flex; align-items:flex-end; padding:6px; font-size:11px; font-weight:600; color:#fff; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
    .demo { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    a.back { display:inline-block; margin-top:24px; color:var(--gv-tenant-primary); text-decoration:none; font-size:var(--gv-fs-s); font-weight:600; }
    a.back:hover { text-decoration:underline; }
  </style>
</head>
<body class="gv-root">
  <main class="card gv-card">
    <h1 class="gv-title h2" style="margin-bottom:4px">City theme preview</h1>
    <p class="gv-text bodyS gv-text--secondary" style="margin-bottom:16px">
      Each city configures three brand colours, a custom font and a logo —
      all live-captured from the real GoVocal platforms. Pick a city with the
      swatches (bottom-right) or set <code>?theme=</code> in the URL
      (<code>0</code>–<code>9</code>) and watch the components re-skin.
    </p>
    <div class="swatches" aria-hidden="true">
      <div class="sw" style="background:var(--gv-tenant-primary)">Primary</div>
      <div class="sw" style="background:var(--gv-tenant-secondary)">Secondary</div>
      <div class="sw" style="background:var(--gv-tenant-text)">Text</div>
    </div>
    <div class="demo">
      <button class="gv-btn primary">Submit idea</button>
      <button class="gv-btn primary-outlined">Learn more</button>
      <label class="gv-checkbox"><input type="checkbox" checked /><span class="box"><span class="check">✓</span></span> Subscribe</label>
      <span class="gv-status-label" style="--bg: var(--gv-success)">Open</span>
    </div>
    <a class="back" href="../">← All prototypes</a>
  </main>
  <script src="govocal-themes.js" defer></script>
</body>
</html>
