<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project page</title>
<!-- Canonical tokens + components + the project-page layout (all "from Pages"). -->
<link rel="stylesheet" href="assets/govocal-tokens.css" />
<link rel="stylesheet" href="assets/govocal-ui.css" />
<link rel="stylesheet" href="assets/pp-page.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  /* The shared renderer paints into THIS skeleton; only the wrap measure is page-local. */
  .gv-wrap { max-width: 1120px; margin: 0 auto; padding: 0 40px; }
  @media (max-width: 760px) { .gv-wrap { padding: 0 18px; } }
</style>
</head>
<body class="gv-root pp-doc" data-gv-theme-picker="off">
  <main class="gv-root">
    <div class="gv-wrap">
      <div class="pp-managers">
        <a class="gv-btn secondary-outlined size-s" href="#" id="editProject"><span data-gv-icon="edit" aria-hidden="true"></span> Edit project</a>
        <button class="gv-btn primary size-s" id="followBtn" aria-pressed="true"><span data-gv-icon="notification" aria-hidden="true"></span> <span id="followLabel">Following (9)</span></button>
      </div>
      <section class="pp-banner" aria-label="Project banner"><img id="banner" src="" alt="" /></section>
      <div class="pp-head">
        <h1 class="gv-title h1" id="title"></h1>
        <div class="pp-row">
          <div class="gv-projdesc pp-intro" id="intro"></div>
          <div class="pp-ctacell"><div class="pp-cta" id="cta"></div></div>
        </div>
        <div class="pp-row" style="margin-top:18px;">
          <div class="pp-desccol"><div class="gv-projdesc pp-desc" id="desc"></div></div>
          <div aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="gv-partbar"><div class="gv-partbar__inner" id="partbar"></div></div>

    <div class="gv-methodband">
      <div class="gv-wrap">
        <section class="gv-phases" aria-labelledby="phasesTitle">
          <div class="gv-phases__bar">
            <h2 id="phasesTitle">Phases</h2>
            <div class="gv-phases__nav">
              <button class="gv-pnav" id="ppPrev" type="button" aria-label="Previous phase"><span data-gv-icon="chevron-left"></span></button>
              <button class="gv-pnav" id="ppCur" type="button" aria-label="Go to current phase"><span class="gv-dotmark"></span></button>
              <button class="gv-pnav" id="ppNext" type="button" aria-label="Next phase"><span data-gv-icon="chevron-right"></span></button>
            </div>
          </div>
          <div class="gv-stepper" role="tablist" aria-label="Project phases" id="stepper"></div>
          <div class="gv-phasepanel" id="phasepanel"></div>
          <div class="gv-phasebody gv-phasebody--full" role="tabpanel" id="phasebody"></div>
        </section>
      </div>
    </div>

    <div class="gv-wrap">
      <section class="gv-section" aria-labelledby="pp-events-title" style="padding-top:40px;">
        <div class="gv-events__head"><h2 class="gv-title h2" id="pp-events-title" style="margin:0">Events</h2><a class="gv-btn text" href="#">View all events</a></div>
        <div class="gv-events__grid" id="events"></div>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/govocal-icons.js"></script>
  <script src="assets/govocal-avatars.js"></script>
  <!-- Load the canonical theme engine so the tenant @font-face set is DEFINED in this
       iframe (it bundles each city font as a data-URI). Without it the iframe could set
       --gv-font-family to a tenant font name that had no @font-face here, so it fell back
       to Public Sans — colours themed, fonts didn't. Picker off (this is a preview frame). -->
  <script src="assets/govocal-themes.js"></script>
  <script src="assets/govocal-widgets.js"></script>
  <script src="assets/pp-render.js"></script>
  <script>
    // Model + theme arrive from the parent via postMessage (origin-safe on file:// AND https).
    function applyTheme(t) {
      if (!t) return;
      var r = document.documentElement.style;
      if (t.primary) r.setProperty('--gv-tenant-primary', t.primary);
      if (t.secondary) r.setProperty('--gv-tenant-secondary', t.secondary);
      if (t.text) r.setProperty('--gv-tenant-text', t.text);
      if (t.font) r.setProperty('--gv-font-family', t.font);
    }
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.ppTheme) applyTheme(d.ppTheme);
      if (d.ppModel && window.PP) window.PP.render(d.ppModel, d.ppMode);
    });
    // Tell the parent we're ready so it can post the first model (handshake).
    if (window.parent && window.parent !== window) { try { window.parent.postMessage({ ppReady: true }, '*'); } catch (e) {} }
  </script>
</body>
</html>
