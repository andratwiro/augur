<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Playground — GoVocal Prototypes</title>
  <link rel="stylesheet" href="govocal-tokens.css" />
  <link rel="stylesheet" href="govocal-ui.css" />
  <style>
    body { margin:0; min-height:100vh; background:#fff; color:var(--gv-text); }
    .pg-wrap { max-width:880px; margin:0 auto; padding:40px 24px 96px; }
    .pg-head { margin-bottom:8px; }
    .pg-sub { color:var(--gv-text-secondary); margin:0 0 32px; }
    .pg-sub code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.9em; color:var(--gv-text); background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px; }
    /* Scratch canvas — edit freely below this line. */
    .pg-canvas {
      border:1px dashed #9aa3ad; border-radius:var(--gv-radius, 3px);
      padding:32px 24px; min-height:240px; background:var(--gv-background, #edeff0);
    }
    a.back { display:inline-block; margin-top:32px; color:var(--gv-tenant-primary); text-decoration:none; font-size:var(--gv-fs-s); font-weight:600; }
    a.back:hover { text-decoration:underline; }
  </style>
</head>
<body class="gv-root">
  <main class="pg-wrap">
    <h1 class="gv-title h2 pg-head">Playground 🛝</h1>
    <p class="gv-text bodyM pg-sub">
      Scratch space for quick experiments. The GoVocal tokens, components and
      <code>?theme=</code> switcher are already loaded — just edit
      <code>playground/index.html</code> and start building.
    </p>

    <!-- ▼▼▼  SCRATCH CANVAS — replace everything inside  ▼▼▼ -->
    <section class="pg-canvas">
      <h2 class="gv-title h4" style="margin-top:0">Start here</h2>
      <p class="gv-text bodyM">A few primitives to riff on:</p>
      <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:8px">
        <button class="gv-btn primary"><span class="gv-btn__label">Primary</span></button>
        <button class="gv-btn secondary"><span class="gv-btn__label">Secondary</span></button>
        <span class="gv-status-label" style="--bg:var(--gv-success)">Open</span>
      </div>
    </section>
    <!-- ▲▲▲  SCRATCH CANVAS  ▲▲▲ -->

    <a class="back" href="../">← All prototypes</a>
  </main>
  <script src="govocal-themes.js" defer></script>
</body>
</html>
