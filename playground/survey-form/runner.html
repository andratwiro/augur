<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Umfrage — Runner</title>
  <!-- DETACHED COPY of the GoVocal survey kit (forked into this playground prototype
       so footer experiments never touch the canonical skills/govocal-ui source).
       Content is German here to stress-test long-text fit. -->
  <link rel="stylesheet" href="govocal-tokens.css" />
  <link rel="stylesheet" href="govocal-ui.css" />
  <link rel="stylesheet" href="govocal-survey.css" />
  <script src="govocal-themes.js" defer></script>
  <script src="govocal-icons.js" defer></script>
  <script src="govocal-survey.js" defer></script>
  <style>
    body { margin: 0; background: var(--gv-survey-canvas); font-family: var(--gv-font-family); }
    .sv-intro__media {
      background:
        linear-gradient(180deg, rgba(26,43,43,0) 40%, rgba(26,43,43,0.45) 100%),
        url('img/westmere/square.webp') center/cover no-repeat;
      height: 240px;
    }
  </style>
</head>
<body class="gv-root" data-gv-theme-picker="off">
  <main class="sv-wrap"><div id="survey"></div></main>

  <script>
  /* ════════════════════════════════════════════════════════════════════════
     FORM — die „Ein Platz für alle“-Umfrage aus Westmere (pages/input-form),
     ins Deutsche übersetzt, um die Platzierung bei langen Texten zu testen.
     ════════════════════════════════════════════════════════════════════════ */
  const FORM = {
    pages: [
      { kind:'intro', title:"Ein Platz für alle", media:" ",
        desc:"Helfen Sie mit, die Neugestaltung des Marktplatzes in der Altstadt zu gestalten. Wir sammeln Ideen der Anwohnerinnen und Anwohner für einen Platz, der für alle funktioniert — für den Wochenmarkt, zum Verweilen in der Sonne und für alle, die zu Fuß oder mit dem Rad unterwegs sind. Teilen Sie unten Ihre Idee; sie reiht sich in die 122 Beiträge ein, die bereits zum Projekt eingegangen sind. Vielen Dank für Ihre Teilnahme." },

      { emoji:'👋', title:'Über Sie', desc:'Ein paar Angaben zu Ihrer Person, damit wir verstehen können, für wen der Platz funktionieren soll. Nichts davon wird gemeinsam mit Ihrer Idee veröffentlicht.',
        fields:[
          { type:'select', label:'Welcher Altersgruppe gehören Sie an?', desc:'Bitte eine auswählen',
            options:['Unter 18','18–24','25–34','35–44','45–54','55–64','65+'] },
          { type:'select', label:'In welchem Stadtteil von Westmere wohnen Sie?', desc:'Bitte einen auswählen',
            options:['Altstadt','Hafenviertel','Nordtor','Flussufer','Weststadt','Seeufer','Ich wohne außerhalb von Westmere'] },
        ] },

      { emoji:'🧭', title:'Wie Sie den Marktplatz heute nutzen', desc:'Erzählen Sie uns, welche Rolle der Platz in Ihrer Woche spielt, damit wir auf dem aufbauen können, was bereits gut funktioniert.',
        fields:[
          { type:'select', label:'Wie oft halten Sie sich auf dem Marktplatz auf?', options:['Täglich','Mehrmals pro Woche','Wöchentlich','Mehrmals im Monat','Selten','Nie'] },
          { type:'multiselect', label:'Wofür kommen Sie hauptsächlich auf den Platz?', desc:'Alle Zutreffenden auswählen',
            options:['Den Wochenmarkt','Freunde treffen','Sitzen und entspannen','Zu Fuß hindurchgehen','Mit dem Rad hindurchfahren','Cafés und Terrassen','Veranstaltungen und Feste','Einkaufen in der Umgebung','Sonstiges'] },
          { type:'text', label:'Welches Wort kommt Ihnen als Erstes in den Sinn, wenn Sie sich den Marktplatz heute vorstellen?' },
          { type:'rating', label:'Wie würden Sie den Platz aktuell als Ort zum Verweilen bewerten?', desc:'(1 = sehr schlecht, 5 = ausgezeichnet)', max:5, gate:true },
        ] },

      { emoji:'💡', title:'Ihre Idee für den Platz', desc:'Das ist das Herzstück. Geben Sie Ihrer Idee einen klaren Titel und beschreiben Sie, was Sie verändern würden — sie wird im Projekt veröffentlicht, damit andere sie lesen und unterstützen können.',
        fields:[
          { type:'text', label:'Geben Sie Ihrer Idee einen Titel', desc:'Eine kurze, klare Überschrift — z. B. „Mehr Schatten und Sitzgelegenheiten an der Südseite“' },
          { type:'multiline_text', label:'Beschreiben Sie Ihre Idee', desc:'Was würden Sie verändern, und warum ist das wichtig? Je konkreter, desto besser.' },
          { type:'multiselect', label:'Welche Themen berührt Ihre Idee?', desc:'Alle Zutreffenden auswählen — daraus werden die Schlagworte Ihres Beitrags',
            options:['Grün & Bepflanzung','Sitzgelegenheiten & Schatten','Gehen & Barrierefreiheit','Radverkehr','Der Wochenmarkt','Spielen für Kinder','Veranstaltungen & Kultur','Beleuchtung & Sicherheit','Erbe & Charakter'] },
          { type:'ranking', label:'Was sollte bei der Neugestaltung für Sie Priorität haben? Bringen Sie diese Punkte in eine Reihenfolge von am wichtigsten bis am wenigsten wichtig.', desc:'(1 = am wichtigsten)',
            options:['Grün und Schatten','Platz für den Wochenmarkt','Bequeme Sitzgelegenheiten','Raum für Veranstaltungen','Gutes Gehen und Barrierefreiheit','Ruhigerer Verkehr und Radwege','Den historischen Charakter des Platzes bewahren'] },
          { type:'linear_scale', label:'Wie wichtig ist Ihnen der Erhalt des historischen Charakters der Altstadt bei der Neugestaltung?', desc:'(1 = nicht wichtig, 7 = unverzichtbar)', max:7, minLabel:'nicht wichtig', maxLabel:'unverzichtbar', gate:true },
          { type:'sentiment', label:'Wie fühlen Sie sich dabei, wie sicher und einladend der Platz am Abend wirkt?', desc:'(von sehr schlecht bis sehr gut)',
            faces:['😣','🙁','😐','🙂','😄'], labels:['Sehr schlecht','Schlecht','Geht so','Gut','Sehr gut'], gate:true },
        ] },

      { emoji:'🎨', title:'Aussehen & Atmosphäre', desc:'Wir erkunden verschiedene Charaktere für den Platz. Welche Richtung spricht Sie am meisten an?',
        fields:[
          { type:'multiselect_image', label:'Welches Erscheinungsbild würden Sie sich für den neugestalteten Marktplatz am ehesten wünschen?', desc:'(Ein Bild auswählen)',
            images:[
              { src:'img/westmere/square.webp',            label:'Ein offener Stadtplatz — Raum zum Verweilen und für Bewegung' },
              { src:'img/westmere/oldtown.webp',           label:'Historisches Kopfsteinpflaster — Betonung des Altstadtcharakters' },
              { src:'img/westmere/park.webp',              label:'Ein grünerer Platz — Bäume, Bepflanzung und Schatten' },
              { src:'img/westmere/street-townhouses.webp', label:'Caféterrassen — Leben, das auf den Platz überschwappt' },
            ] },
          { type:'matrix', label:'Wie sehr stimmen Sie den folgenden Abwägungen zu?', gate:true,
            scale:['Stimme überhaupt nicht zu','Stimme nicht zu','Neutral','Stimme zu','Stimme voll und ganz zu'],
            statements:[
              'Ich würde weniger Parkplätze auf dem Platz in Kauf nehmen, um mehr Grün und Sitzgelegenheiten zu bekommen.',
              'Der Platz sollte Fußgängerinnen und Fußgängern Vorrang einräumen, auch wenn das den Durchgangsverkehr verlangsamt.',
              'Platz für den Wochenmarkt zu erhalten ist mir wichtiger als das Hinzufügen dauerhafter Einrichtungen.',
              'Ich würde mehr Abendbeleuchtung begrüßen, auch wenn das den ruhigen Charakter des Platzes verändert.',
              'Der Platz sollte mehr Veranstaltungen beherbergen, auch wenn das gelegentlich Lärm bedeutet.',
              'Ich hätte lieber heimische Bäume und Bepflanzung als große gepflasterte Flächen.',
              'Ich würde Caféterrassen auf dem Platz befürworten, auch wenn das die offene Fläche verringert.',
            ] },
          { type:'file_upload', label:'Haben Sie eine Skizze, ein Foto oder eine Vorlage für Ihre Idee? Fügen Sie sie hier hinzu.', desc:'Dateien hier hochladen (optional)' },
        ] },

      { emoji:'🚦', title:'Verkehr auf dem Platz',
        desc:"Eine der größeren Entscheidungen bei dieser Neugestaltung ist, wie viel Durchgangsverkehr der Platz tragen soll. Wir möchten gerne wissen, wie Sie dazu stehen.",
        fields:[
          { type:'linear_scale', label:'Sollten wir den Autoverkehr über den Marktplatz reduzieren?', desc:'(1 = Stimme überhaupt nicht zu, 5 = Stimme voll und ganz zu)', max:5, minLabel:'Stimme überhaupt nicht zu', maxLabel:'Stimme voll und ganz zu', gate:true },
          { type:'text', label:'Warum?' },
          { type:'select', label:'Wenn der Durchgangsverkehr reduziert würde, was würden Sie sich in der frei werdenden Fläche am meisten wünschen?', options:['Sitzgelegenheiten und Terrassen','Bäume und Bepflanzung','Eine größere Marktfläche','Einen Spielbereich für Kinder','Eine offene, flexible Fläche für Veranstaltungen','Sonstiges'] },
        ] },

      { emoji:'🗺️', title:'Zeigen Sie es uns auf der Karte', desc:'Nutzen Sie die Kartenwerkzeuge, um auf die genauen Stellen auf und rund um den Marktplatz zu zeigen, um die es bei Ihrer Idee geht.',
        fields:[
          { type:'map', shape:'line', label:'Welche Route über den Platz ist Ihnen am wichtigsten?', desc:'Zeichnen Sie den Weg ein, den Sie üblicherweise über den Marktplatz nehmen — zu Fuß oder mit dem Rad.' },
          { type:'map', shape:'point', label:'Wo auf dem Platz würden Sie neue Sitzgelegenheiten oder Grün platzieren?', desc:'Setzen Sie eine Markierung an die Stelle, wo Sie es sich am meisten wünschen.' },
        ] },

      { emoji:'✅', title:'Noch etwas?', desc:'Vielen Dank — Ihre Idee gestaltet die Zukunft des Marktplatzes in der Altstadt mit.',
        fields:[
          { type:'multiline_text', label:'Möchten Sie dem Beteiligungsteam noch etwas zur Neugestaltung mitteilen?' },
        ] },

      { kind:'thankyou', title:'Danke — Ihre Idee ist eingegangen!', desc:'Ihr Beitrag wurde zu „Ein Platz für alle“ hinzugefügt. Das Beteiligungsteam von Westmere liest jede Idee; auf der Projektseite können Sie verfolgen, wie die Neugestaltung Gestalt annimmt.' },
    ]
  };

  // Read experiment params from the URL (driven by the control shell index.html).
  var params = new URLSearchParams(location.search);
  var LAYOUTS = ['inline','stacked','topbar','footbar','tally','typeform','bottomedge','headernum','stepdots'];
  var layout = LAYOUTS.indexOf(params.get('layout')) >= 0 ? params.get('layout') : 'inline';
  var longLabels = params.get('labels') === 'long';
  // Realistic „long“ German labels — the verbose phrasing a city writes once the terse
  // defaults feel too curt — to stress the narrow-phone fit the inline placement struggles with.
  var LABELS = longLabels
    ? { prev: 'Vorheriger Schritt', next: 'Speichern und fortfahren', submit: 'Antwort absenden' }
    : { prev: 'Zurück',            next: 'Weiter',                  submit: 'Absenden' };

  document.addEventListener('DOMContentLoaded', function () {
    var mountEl = document.getElementById('survey');
    GVSurvey.mount(mountEl, FORM, {
      // Deliberately long title to demonstrate the header ellipsis.
      title: 'Umfrage zur Neugestaltung des Marktplatzes in der Altstadt von Westmere',
      labels: LABELS,
      // Open mid-survey (a content page with a few questions + both Zurück/Weiter), % seeded
      // to 65% on the first paint so the harness default reads like a real in-progress run.
      start: 5,
      demoPct: 65,
      onClose: function () { /* no-op in the experiment */ }
    });
    // Apply the layout under test (on the card, so it reaches the header bar too).
    var card = mountEl.querySelector('.sv-card');
    if (card) card.setAttribute('data-layout', layout);
  });
  </script>
</body>
</html>
