<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Survey Responses Export — a Go Vocal concept</title>
  <style>
    :root{
      --bg:#fbfbfd;
      --card:#ffffff;
      --ink:#17171a;
      --muted:#6c6a65;
      --faint:#9a978f;
      --line:#e6e4df;
      --gv:#0E7C86;
      --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:40px;}
    .stub{max-width:560px;text-align:center;}
    .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gv);margin:0 0 18px;}
    h1{font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0 0 16px;font-weight:680;}
    p{font-size:17px;line-height:1.5;color:var(--muted);margin:0;}
  </style>
</head>
<body>
  <div class="stub">
    <p class="eyebrow">Go Vocal · Playground</p>
    <h1>Survey Responses Export</h1>
    <p>Scaffold ready — awaiting context.</p>
  </div>
</body>
</html>
