<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Homepage spotlight row — Go Vocal pattern</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* redefinitions. */
    body { margin: 0; background: var(--gv-background); font-family: var(--gv-font-family); }
    .stage { max-width: 1040px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .rail-frame { background: var(--gv-white); border-radius: var(--gv-radius); box-shadow: var(--gv-shadow); padding: 24px; }
    /* the rail margins assume a 24px-padded container; the frame provides it */
    .rail-frame > .gv-carousel > .gv-rail { padding-left: 24px; padding-right: 24px; margin: 0 -24px; }
  </style>
</head>
<body class="gv-root" data-gv-theme-picker="off" data-gv-cookies="off">

  <div class="stage">
    <h2 class="heading">Homepage spotlight row</h2>

    <div class="rail-frame">
      <!-- ════════ Homepage project row (.gv-carousel head + controls + .gv-rail of .gv-pcard) ════════ -->
      <section class="gv-carousel" role="region" aria-roledescription="carousel" aria-label="Open engagements">
        <div class="gv-carousel__head">
          <h2 class="gv-title h2 gv-carousel__title">Open engagements</h2>
          <div class="gv-carousel__controls">
            <button type="button" class="gv-carousel__scroll disabled" aria-disabled="true"
                    data-gv-carousel-prev aria-label="Scroll left">
              <span data-gv-icon="chevron-left" aria-hidden="true"></span>
            </button>
            <button type="button" class="gv-carousel__scroll"
                    data-gv-carousel-next aria-label="Scroll right">
              <span data-gv-icon="chevron-right" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <button type="button" class="gv-sr-only gv-carousel__skip" data-gv-carousel-skip>Press escape to skip carousel</button>

        <div class="gv-rail rail--fade-right" tabindex="0" role="group" aria-label="Open engagements, scroll for more" data-gv-carousel-rail>

          <article class="gv-pcard light compact">
            <div class="gv-pcard__thumb"><img src="../../pages/homepage/img/done-oldtown.webp" alt="A restored cobbled street" loading="lazy" /></div>
            <div class="gv-pcard__body">
              <h3 class="gv-pcard__title"><a href="#">Active travel route</a></h3>
              <span class="gv-pcard__status">
                <span data-gv-icon="clock-solid" aria-hidden="true"></span>
                No end date
              </span>
              <span class="gv-pcard__more">Learn more</span>
            </div>
          </article>

          <article class="gv-pcard light compact">
            <div class="gv-pcard__thumb"><img src="../../pages/homepage/img/done-square.webp" alt="Market square with people" loading="lazy" /></div>
            <div class="gv-pcard__body">
              <h3 class="gv-pcard__title"><a href="#">Town centre vision</a></h3>
              <span class="gv-pcard__status">
                <span data-gv-icon="clock-solid" aria-hidden="true"></span>
                No end date
              </span>
              <span class="gv-pcard__more">Learn more</span>
            </div>
          </article>

          <article class="gv-pcard light compact">
            <div class="gv-pcard__thumb"><img src="../../pages/homepage/img/done-youth.webp" alt="Community workshop" loading="lazy" /></div>
            <div class="gv-pcard__body">
              <h3 class="gv-pcard__title"><a href="#">Green spaces plan</a></h3>
              <span class="gv-pcard__status">
                <span data-gv-icon="clock-solid" aria-hidden="true"></span>
                No end date
              </span>
              <span class="gv-pcard__more">Learn more</span>
            </div>
          </article>

          <article class="gv-pcard light compact">
            <div class="gv-pcard__thumb gv-pcard__thumb--forest"></div>
            <div class="gv-pcard__body">
              <h3 class="gv-pcard__title"><a href="#">Cycling network consultation</a></h3>
              <span class="gv-pcard__status">
                <span data-gv-icon="clock-solid" aria-hidden="true"></span>
                No end date
              </span>
              <span class="gv-pcard__more">Learn more</span>
            </div>
          </article>

          <article class="gv-pcard light compact">
            <div class="gv-pcard__thumb gv-pcard__thumb--ocean"></div>
            <div class="gv-pcard__body">
              <h3 class="gv-pcard__title"><a href="#">River corridor study</a></h3>
              <span class="gv-pcard__status">
                <span data-gv-icon="clock-solid" aria-hidden="true"></span>
                No end date
              </span>
              <span class="gv-pcard__more">Learn more</span>
            </div>
          </article>

        </div>
      </section>
    </div>
  </div>

  <script>
    // Page-local carousel behaviour (demo only — no canonical .gv-* defined here).
    document.querySelectorAll('.gv-carousel').forEach(function (car) {
      var rail = car.querySelector('[data-gv-carousel-rail]');
      var prev = car.querySelector('[data-gv-carousel-prev]');
      var next = car.querySelector('[data-gv-carousel-next]');
      var skip = car.querySelector('[data-gv-carousel-skip]');
      if (!rail) return;
      function page(dir) { rail.scrollBy({ left: dir * Math.round(rail.clientWidth * 0.8), behavior: 'smooth' }); }
      function sync() {
        var atStart = rail.scrollLeft <= 2;
        var atEnd = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 2;
        if (prev) { prev.classList.toggle('disabled', atStart); prev.setAttribute('aria-disabled', atStart); }
        if (next) { next.classList.toggle('disabled', atEnd); next.setAttribute('aria-disabled', atEnd); }
        rail.classList.toggle('rail--fade-left', !atStart);
        rail.classList.toggle('rail--fade-right', !atEnd);
      }
      if (prev) prev.addEventListener('click', function () { page(-1); });
      if (next) next.addEventListener('click', function () { page(1); });
      rail.addEventListener('scroll', sync, { passive: true });
      car.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && skip) { skip.focus(); }
      });
      if (skip) skip.addEventListener('click', function () {
        var after = car.nextElementSibling;
        var f = after && after.querySelector('a,button,[tabindex]');
        if (f) f.focus();
      });
      sync();
    });
  </script>
</body>
</html>
