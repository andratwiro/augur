<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Participation flow — Go Vocal pattern</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-primitives.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-avatars.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-partbar.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* redefinitions. */
    body { margin: 0; background: var(--gv-background); font-family: var(--gv-font-family); }
    .stage { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .pbox-wrap { background: var(--gv-white); border: 1px solid var(--gv-grey-300); border-radius: var(--gv-radius); padding: 22px; box-shadow: var(--gv-shadow); margin-top: 22px; }
  </style>
</head>
<body class="gv-root" data-gv-theme-picker="off" data-gv-cookies="off">

  <!-- ════════ Sticky participation bar (.gv-partbar) — pins as residents scroll ════════ -->
  <div class="gv-partbar">
    <div class="gv-partbar__inner">
      <span class="gv-partbar__status">Open for participation</span>
      <a class="gv-btn on-color" href="#ideas">Submit your idea <span data-gv-icon="arrow-right" aria-hidden="true"></span></a>
    </div>
  </div>

  <div class="stage">
    <h2 class="heading">Participation flow</h2>

    <!-- ════════ Participation box (.gv-pbox) — project CTA stack + participant row ════════ -->
    <div class="pbox-wrap">
      <div class="gv-pbox">
        <div class="gv-pbox__actions">
          <a class="gv-btn primary full" href="#">View 82 proposals</a>
          <a class="gv-btn secondary-outlined full" href="#">Ask the budget team anything</a>
        </div>
        <div class="gv-participants gv-pbox__people">
          <span class="gv-avatars on-light" aria-hidden="true"><span class="av"></span><span class="av"></span><span class="av"></span></span>
          <span class="gv-pcount">+19 participants</span>
          <span class="gv-icon gv-pinfo" data-gv-icon="info-solid" aria-hidden="true" title="Real-time participant count."></span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
