<!-- LINKED INSTANCE — this demo owns no typography markup; it imports GV.render('typography', props). -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Typography — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
  </style>
</head>
<body class="gv-root">
  <div class="stage">
    <h2 class="heading">Type scale</h2>
    <div class="gv-card" id="type-scale"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var container = document.getElementById('type-scale');

      // The full type-scale specimen list, same order as HEAD.
      var specimens = [
        { tag: 'h1', className: 'gv-title h1', text: 'Title h1 — 30',           margin: '0 0 8px' },
        { tag: 'h2', className: 'gv-title h2', text: 'Title h2 — 25',           margin: '0 0 8px' },
        { tag: 'h3', className: 'gv-title h3', text: 'Title h3 — 21',           margin: '0 0 8px' },
        { tag: 'p',  className: 'gv-text bodyL', text: 'Body L — 18 / 600',     margin: '0 0 6px' },
        { tag: 'p',  className: 'gv-text bodyM', text: 'Body M — 16',           margin: '0 0 6px' },
        { tag: 'p',  className: 'gv-text bodyS', text: 'Body S secondary — 14', margin: '0', extraClass: 'gv-text--secondary' },
      ];

      container.innerHTML = specimens.map(function (s) {
        return GV.render('typography', s);
      }).join('');

      GV.hydrate(container);
    });
  </script>
</body>
</html>
