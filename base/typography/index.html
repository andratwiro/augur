<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Typography — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
  </style>
</head>
<body class="gv-root">
  <div class="stage">
    <h2 class="heading">Type scale</h2>
    <div class="gv-card">
      <h1 class="gv-title h1" style="margin:0 0 8px">Title h1 — 30</h1>
      <h2 class="gv-title h2" style="margin:0 0 8px">Title h2 — 25</h2>
      <h3 class="gv-title h3" style="margin:0 0 8px">Title h3 — 21</h3>
      <p class="gv-text bodyL" style="margin:0 0 6px">Body L — 18 / 600</p>
      <p class="gv-text bodyM" style="margin:0 0 6px">Body M — 16</p>
      <p class="gv-text bodyS gv-text--secondary" style="margin:0">Body S secondary — 14</p>
    </div>
  </div>
</body>
</html>
