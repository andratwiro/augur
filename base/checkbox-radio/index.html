<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Checkbox &amp; radio — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
    .row + .row { margin-top: 14px; }
  </style>
</head>
<body class="gv-root">
  <div class="stage">
    <h2 class="heading">Selection controls</h2>
    <div class="gv-card">
      <div class="row">
        <label class="gv-checkbox"><input type="checkbox" checked /><span class="box"><span class="check">✓</span></span> Checked</label>
        <label class="gv-checkbox"><input type="checkbox" /><span class="box"><span class="check">✓</span></span> Unchecked</label>
        <label class="gv-checkbox"><input type="checkbox" checked disabled /><span class="box"><span class="check">✓</span></span> Disabled</label>
      </div>
      <div class="row">
        <label class="gv-radio"><input type="radio" name="g-r" checked /><span class="circle"></span> Option A</label>
        <label class="gv-radio"><input type="radio" name="g-r" /><span class="circle"></span> Option B</label>
        <label class="gv-radio"><input type="radio" name="g-r" disabled /><span class="circle"></span> Disabled</label>
      </div>
      <div class="row">
        <label class="gv-toggle"><input type="checkbox" checked /><span class="track"></span><span class="label">On</span></label>
        <label class="gv-toggle"><input type="checkbox" /><span class="track"></span><span class="label">Off</span></label>
        <label class="gv-toggle"><input type="checkbox" disabled /><span class="track"></span><span class="label">Disabled</span></label>
      </div>
    </div>
  </div>
</body>
</html>
