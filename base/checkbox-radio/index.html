<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Checkbox &amp; radio — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
    .row + .row { margin-top: 14px; }
  </style>
</head>
<body class="gv-root">
  <!-- LINKED INSTANCE — this demo owns no checkbox-radio markup; it imports GV.render('checkbox-radio', props). -->
  <div class="stage">
    <h2 class="heading">Selection controls</h2>
    <div class="gv-card">
      <div class="row" id="row-checkbox"></div>
      <div class="row" id="row-radio"></div>
      <div class="row" id="row-toggle"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Row 1: checkboxes — checked / unchecked / disabled
      document.getElementById('row-checkbox').innerHTML =
        GV.render('checkbox-radio', { variant: 'checkbox', label: 'Checked',   checked: true }) +
        GV.render('checkbox-radio', { variant: 'checkbox', label: 'Unchecked', checked: false }) +
        GV.render('checkbox-radio', { variant: 'checkbox', label: 'Disabled',  checked: true, disabled: true });

      // Row 2: radios — Option A (checked) / Option B / disabled
      document.getElementById('row-radio').innerHTML =
        GV.render('checkbox-radio', { variant: 'radio', name: 'g-r', label: 'Option A', checked: true }) +
        GV.render('checkbox-radio', { variant: 'radio', name: 'g-r', label: 'Option B', checked: false }) +
        GV.render('checkbox-radio', { variant: 'radio', name: 'g-r', label: 'Disabled', checked: false, disabled: true });

      // Row 3: toggles — On / Off / disabled
      document.getElementById('row-toggle').innerHTML =
        GV.render('checkbox-radio', { variant: 'toggle', label: 'On',       checked: true }) +
        GV.render('checkbox-radio', { variant: 'toggle', label: 'Off',      checked: false }) +
        GV.render('checkbox-radio', { variant: 'toggle', label: 'Disabled', checked: false, disabled: true });

      GV.hydrate(document);
    });
  </script>
</body>
</html>
