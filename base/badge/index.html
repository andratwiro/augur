<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Badge — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  </style>
</head>
<body class="gv-root">
  <!-- LINKED INSTANCE — this demo owns no badge markup; it imports GV.render('badge', props). -->
  <div class="stage">
    <h2 class="heading">Status, badges &amp; spinner</h2>
    <div class="gv-card">
      <div class="row">
        <span id="b-published"></span>
        <span id="b-pending"></span>
        <span id="b-draft"></span>
        <span id="b-new"></span>
        <span id="b-live"></span>
        <span class="gv-spinner"></span>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      GV.mount('#b-published', 'badge', { variant: 'status', label: 'Published', bg: 'var(--gv-success)' });
      GV.mount('#b-pending',   'badge', { variant: 'status', label: 'Pending',   bg: 'color-mix(in srgb, var(--gv-orange-500) 72%, #000)' });
      GV.mount('#b-draft',     'badge', { variant: 'status', modifier: 'outlined', label: 'Draft' });
      GV.mount('#b-new',       'badge', { variant: 'badge',  label: 'New',  color: 'var(--gv-teal-500)' });
      GV.mount('#b-live',      'badge', { variant: 'badge',  modifier: 'inverse', label: 'Live', bg: 'var(--gv-success)' });
    });
  </script>
</body>
</html>
