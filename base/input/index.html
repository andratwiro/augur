<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Input — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
    .row + .row { margin-top: 14px; }
  </style>
</head>
<body class="gv-root">
  <!-- LINKED INSTANCE — this demo owns no input markup; it imports GV.render('input', props). -->
  <div class="stage">
    <h2 class="heading">Input</h2>
    <div class="gv-card">
      <!-- row 1: email input + error state -->
      <div class="row" id="row-1"></div>
      <!-- row 2: disabled input + textarea -->
      <div class="row" id="row-2"></div>
      <!-- row 3: select + disabled select -->
      <div class="row" id="row-3"></div>
    </div>
  </div>

  <script>
    // LINKED INSTANCE — this demo owns NO input markup. It imports the canonical
    // renderer GV.render('input', props) from govocal-instances.js + input.js and
    // passes only PROPS (type, label, id, placeholder, value, disabled, error,
    // options, ariaLabel). Edit the renderer or the .gv-input/.gv-textarea/.gv-select
    // CSS upstream and every instance reflows.
    document.addEventListener('DOMContentLoaded', function () {
      var r1 = document.getElementById('row-1');
      var r2 = document.getElementById('row-2');
      var r3 = document.getElementById('row-3');

      // Row 1 — email input (primary) + error state
      r1.innerHTML =
        GV.render('input', {
          id: 'g-email', label: 'Email',
          inputType: 'email', placeholder: 'you@example.com'
        }) +
        GV.render('input', {
          id: 'g-err', label: 'Email (error)',
          inputType: '', placeholder: '', value: 'nope',
          error: 'Enter a valid email address.'
        });

      // Row 2 — disabled input + textarea
      r2.innerHTML =
        GV.render('input', {
          id: 'g-dis', label: 'Disabled',
          inputType: '', placeholder: '',
          disabled: true, value: 'Disabled field'
        }) +
        GV.render('input', {
          type: 'textarea',
          id: 'g-ta', label: 'Idea',
          placeholder: 'Share your idea…'
        });

      // Row 3 — select + disabled select
      r3.innerHTML =
        GV.render('input', {
          type: 'select',
          id: 'g-sel', label: 'Sort by', ariaLabel: 'Sort by'
          /* options: default (Choose… / Most recent / Most discussed / Trending) */
        }) +
        GV.render('input', {
          type: 'select',
          id: 'g-sel2', label: 'Disabled select', ariaLabel: 'Disabled',
          disabled: true,
          options: [{ label: 'Locked value' }]
        });

      GV.hydrate(document.querySelector('.gv-card'));
    });
  </script>
</body>
</html>
