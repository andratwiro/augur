<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Icon — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--gv-text-secondary); font-weight: 600; margin: 0 0 10px; }
    .glyphs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 10px; }
    .cell {
      display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 16px 6px 11px;
      border: 1px solid var(--gv-divider); border-radius: 10px; background: var(--gv-background); color: var(--gv-text);
    }
    .cell .g { font-size: 23px; line-height: 0; }
    .cell .n { font-size: 10.5px; color: var(--gv-text-secondary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body class="gv-root">
  <div class="stage">
    <h2 class="heading">Icon buttons &amp; glyphs</h2>
    <div class="gv-card">
      <p class="eyebrow">Icon buttons (<code>.gv-iconbtn</code> + <code>data-gv-icon</code>)</p>
      <div class="row" id="row-iconbtns"></div>

      <p class="eyebrow" style="margin-top:24px">Glyphs (<code>&lt;span data-gv-icon="…"&gt;</code> — inherits size &amp; colour)</p>
      <div class="glyphs" id="grid-glyphs"></div>
    </div>
  </div>

  <script>
    // LINKED INSTANCE — this demo owns no icon markup; it imports GV.render('icon', props)
    // and GV.render('iconbtn', props) from govocal-instances.js.
    document.addEventListener('DOMContentLoaded', function () {
      // Icon buttons — same six as HEAD, in order.
      var iconbtns = [
        { name: 'search',          ariaLabel: 'Search' },
        { name: 'vote-up',         ariaLabel: 'Like' },
        { name: 'comment',         ariaLabel: 'Comment' },
        { name: 'share',           ariaLabel: 'Share' },
        { name: 'dots-horizontal', ariaLabel: 'More' },
        { name: 'settings',        ariaLabel: 'Settings' }
      ];
      var rowEl = document.getElementById('row-iconbtns');
      rowEl.innerHTML = iconbtns.map(function (p) { return GV.render('iconbtn', p); }).join('');
      GV.hydrate(rowEl);

      // Glyph cells — same twelve as HEAD, in order.
      var glyphs = [
        'search', 'vote-up', 'comment', 'share', 'settings', 'close',
        'plus', 'arrow-right', 'info-outline', 'dots-horizontal', 'calendar', 'location'
      ];
      var gridEl = document.getElementById('grid-glyphs');
      gridEl.innerHTML = glyphs.map(function (name) { return GV.render('icon', { name: name }); }).join('');
      GV.hydrate(gridEl);
    });
  </script>
</body>
</html>
