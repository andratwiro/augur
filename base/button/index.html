<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Button — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .row + .row { margin-top: 14px; }
  </style>
</head>
<body class="gv-root">
  <!-- LINKED INSTANCE — this demo owns no button markup; it imports GV.render('button', props). -->
  <div class="stage">
    <h2 class="heading">Button</h2>
    <div class="gv-card">
      <div class="row" id="row-variants"></div>
      <div class="row" id="row-states"></div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var variants = [
        { /* default props → Primary */ },
        { variant: 'primary-outlined', label: 'Outlined' },
        { variant: 'secondary',        label: 'Secondary' },
        { variant: 'white',            label: 'White' },
        { variant: 'text',             label: 'Text' },
        { variant: 'delete',           label: 'Delete' },
        { variant: 'admin-dark',       label: 'Admin' }
      ];
      document.getElementById('row-variants').innerHTML =
        variants.map(function (p) { return GV.render('button', p); }).join('');

      var states = [
        { label: 'With icon', icon: 'plus' },
        { label: 'Disabled',  disabled:   true },
        { label: 'Saving',    processing: true },
        { label: 'Medium',    size: 'm' },
        { label: 'Large',     size: 'l' },
        { label: 'XL',        size: 'xl' }
      ];
      document.getElementById('row-states').innerHTML =
        states.map(function (p) { return GV.render('button', p); }).join('');

      GV.hydrate(document.getElementById('row-states')); // fill the icon glyph
    });
  </script>
</body>
</html>
