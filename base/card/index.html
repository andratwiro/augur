<!-- LINKED INSTANCE — this demo owns no card markup; it imports GV.render('card', props). -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Card — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  </style>
</head>
<body class="gv-root">
  <div class="stage">
    <h2 class="heading">Card</h2>
    <div id="card-grid" class="grid">
      <div id="card-default"></div>
      <div id="card-meta"></div>
      <div id="card-actions"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Card 1 — plain surface: title + body + status label + primary button
      GV.mount('#card-default', 'card', {});

      // Card 2 — meta footer: title + body + divider + icon + meta text
      GV.mount('#card-meta', 'card', { variant: 'meta' });

      // Card 3 — icon actions: title + body + icon button row
      GV.mount('#card-actions', 'card', { variant: 'actions' });

      GV.hydrate(document.getElementById('card-grid'));
    });
  </script>
</body>
</html>
