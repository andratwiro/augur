<!-- LINKED INSTANCE — this demo owns no modal markup; it imports GV.render('modal', props). -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Modal — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  </style>
</head>
<body class="gv-root">
  <div class="stage">
    <h2 class="heading">Modal &amp; overlay</h2>
    <div class="gv-card">
      <p class="gv-text bodyS gv-text--secondary" style="margin:0 0 12px">
        <code>.gv-modal-overlay</code> (scrim, toggle <code>.is-open</code>) centres a
        <code>.gv-modal</code> card: <code>__header</code>/<code>__title</code>, top-right
        <code>__close</code>, scrollable <code>__body</code>. The card is the dialog
        (<code>role="dialog"</code> · <code>aria-modal</code> · <code>aria-labelledby</code>).
      </p>
      <div class="row">
        <button class="gv-btn primary" type="button" data-open-modal>Open modal</button>
      </div>
      <!-- Static preview of the dialog card (no overlay, so it doesn't cover the page). -->
      <div id="modal-static"></div>
      <!-- Live overlay instance, opened by the button above. -->
      <div id="modal-overlay"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Instance 1 — static preview (bare .gv-modal, no scrim). Demo chrome applies
      // margin-top + box-shadow via the wrapper below so the card is visible in-page.
      var staticWrap = document.getElementById('modal-static');
      staticWrap.style.marginTop = '16px';
      staticWrap.style.boxShadow = 'var(--gv-shadow)';
      GV.mount(staticWrap, 'modal', {});

      // Instance 2 — live overlay (scrim + .gv-modal-overlay wrapper). JS below
      // wires open/close behaviour onto the rendered DOM.
      GV.mount('#modal-overlay', 'modal', { variant: 'overlay' });

      GV.hydrate(document.querySelector('.gv-card'));

      // Open/close behaviour operates on the rendered overlay DOM.
      (function () {
        var ov = document.getElementById('g-overlay');
        if (ov) {
          var open  = function () { ov.classList.add('is-open'); };
          var close = function () { ov.classList.remove('is-open'); };
          document.querySelectorAll('[data-open-modal]').forEach(function (b) { b.addEventListener('click', open); });
          ov.querySelectorAll('[data-close-modal]').forEach(function (b) { b.addEventListener('click', close); });
          ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
          document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
        }
      })();
    });
  </script>
</body>
</html>
