<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Status label — Go Vocal base</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* selectors. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  </style>
</head>
<body class="gv-root">
  <div class="stage">
    <h2 class="heading">Status label</h2>
    <div class="gv-card">
      <div class="row">
        <span class="gv-status-label" style="--bg: var(--gv-success)">Published</span>
        <span class="gv-status-label" style="--bg: color-mix(in srgb, var(--gv-orange-500) 72%, #000)">Pending</span>
        <span class="gv-status-label outlined">Draft</span>
      </div>
    </div>
  </div>
</body>
</html>
