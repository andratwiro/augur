name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Doc drift (doc-lint)
        run: node scripts/doc-lint.mjs
      - name: No new module-scope tenant state (no-tenant-globals)
        # The worker's config globals have been replaced by a per-request tenant context.
        # The way that gets undone is one convenient new global — invisible to every other
        # test, because a single-tenant deployment cannot observe the difference between
        # state shared between workspaces and state belonging to the only workspace there
        # is. This lint holds the line, and it lives HERE rather than only in the suite
        # because a live deploy is gated on this workflow: a guard in `test` reports the
        # problem, a guard in `check` stops it shipping.
        #
        # It takes no arguments ON PURPOSE. It discovers the modules it checks by following
        # the worker's relative imports, so a new module holding tenant state is scanned
        # the moment the worker can reach it. Naming the files here instead would have put
        # the list in the one file nobody edits when adding a module — the same silent
        # escape by omission the lint exists to catch, moved into its own configuration.
        #
        # It also decides, rather than only enumerating. Two reproduced cross-tenant leaks
        # were both ON its allowlist under written reasons asserting the safety they did
        # not have, so the kinds it accepts are now checked against the code: a cache it
        # calls keyed must be a Map touched with a tenantId at every access, a table it
        # calls invariant must never be written after module load, and the bare per-isolate
        # slot that both leaks were is a budgeted quarantine. No reason is read.
        run: node scripts/no-tenant-globals.mjs
      - name: One tenant resolver, one call site (one-tenant-resolver)
        # Which workspace a request belongs to is decided in exactly one place, at the
        # top of fetch(). That is what makes swapping the static answer for a Host-header
        # lookup a body change with nothing else to find. A second call site returns the
        # same answer today and is invisible to every other check, so it is caught here —
        # in `check`, which gates the deploy, rather than only in the suite.
        run: node scripts/one-tenant-resolver.mjs
      - name: No foreign vocabulary in the engine (no-foreign-vocabulary)
        # The word scan below is a DENYLIST, so it only ever catches a name somebody
        # already wrote down — which is why it passed green through an extraction that
        # removed nine customer names, a customer's slug prefixes and a customer's
        # CSS-variable namespace from this repo. Widening that list is not the fix: a
        # list of client names in a public repo is the same problem with a canonical
        # index attached. This guard checks SHAPES instead — a colour stored under a
        # proper noun, a hardcoded custom-property prefix, a meta tag in a namespace
        # the engine does not own — and names nobody. It runs BEFORE the word scan
        # because it is the one that catches the client nobody has met yet.
        run: node scripts/no-foreign-vocabulary.mjs
      - name: No instance, product, or personal words in the engine
        # The engine is generic — instance-specific values belong in deploy.config.json /
        # space.json, never in engine code, scripts, docs, or shipped chrome. Scan the
        # WHOLE repo (case-insensitive) minus vendored/build output and this file (which
        # necessarily names the words). Two pattern groups: instance/product names (each
        # separator class allows a SPACE — a product name written the way a human writes
        # it slips past a slug-only pattern), and personal names — people and pets have
        # no place in a shared engine. Correct exit handling: grep 0 = found (fail),
        # 1 = clean (pass), >=2 = error such as a renamed path (fail, never a silent pass).
        run: |
          set +e
          grep -rInEi \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
            --exclude=check.yml \
            'go[ ._-]?vocal|citizen[ ._-]?lab|delta[ ._-]?studio|delta[ ._-]?designs|demo[ ._-]?gouda|\bgouda\b|wervik|westmere|\brob\b|\birene\b|\btali\b|\baslam\w*|\bsenda\b|\bpruna\b|god[ -]?mode' \
            .
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "::error::instance/product word found in the engine (matches above)"; exit 1; fi
          if [ "$rc" -ge 2 ]; then echo "::error::product-word scan failed to run (grep rc=$rc)"; exit 1; fi
          echo "clean — no instance/product words"
