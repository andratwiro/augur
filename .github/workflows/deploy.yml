name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Augur composes ONE private submodule: gv-workspace, which now holds BOTH the
      # design system and the prototypes, organized into spaces/<id>/ (each a self-
      # contained DS + opportunities bundle). The default GITHUB_TOKEN cannot read other
      # private repos, so submodule fetch uses a PAT secret (SUBMODULE_PAT, Contents:read
      # on gv-workspace).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for per-prototype "last worked on" ordering
          submodules: true        # pull gv-workspace (carries the spaces, incl. the DS)
          token: ${{ secrets.SUBMODULE_PAT }}

      # Sanity guard: the workspace submodule checked out with at least one space that
      # carries the design-system assets build.js needs. (The old read-only DS guard is
      # retired — the DS is now part of the editable gv-workspace by design.)
      - name: Guard — gv-workspace spaces checked out
        run: |
          if ! ls gv-workspace/spaces/*/skills/govocal-ui/govocal-ui.css >/dev/null 2>&1; then
            echo "::error::gv-workspace submodule has no space with DS assets at spaces/*/skills/govocal-ui/ (PAT/scope, or not yet restructured?)."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: node build.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=govocal-prototypes --branch=main
