name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Augur composes ONE private submodule PER SPACE, mounted at spaces/<id> (each
      # space repo is a self-contained DS + prototypes bundle at its root). The default
      # GITHUB_TOKEN cannot read other private repos, so submodule fetch uses a PAT
      # secret (SUBMODULE_PAT, Contents:read on every space repo).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for per-prototype "last worked on" ordering
          submodules: true        # pull every space repo (each carries its own DS)
          token: ${{ secrets.SUBMODULE_PAT }}

      # Sanity guard: at least one space submodule checked out with the design-system
      # assets build.js needs.
      - name: Guard — space submodules checked out
        run: |
          if ! ls spaces/*/skills/govocal-ui/govocal-ui.css >/dev/null 2>&1; then
            echo "::error::no space submodule with DS assets at spaces/*/skills/govocal-ui/ checked out (PAT/scope, or missing submodule?)."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: node build.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=govocal-prototypes --branch=main
