name: Trigger live deploy

# Engine-side auto-deploy bridge. This repo deploys nothing itself — a live site ships
# from a deploy shell, which pins this repo as its `engine` submodule. A push here asks
# the configured shells to bump that pin immediately (repository_dispatch
# `engine-updated` → each shell's engine-bump.yml), which triggers their deploys. An
# instance that would rather pull on its own schedule just stays out of the list, so
# this is a convenience for the shells that want the engine the moment it moves, never
# a requirement.
#
# Which shells: the `SHELL_REPO` repository VARIABLE — one or more `owner/repo`,
# comma-separated — so no shell repo is named in this file, and a fork with the
# variable unset simply skips the job.
# Auth: AUGUR_DISPATCH_TOKEN — a fine-grained PAT with Contents read & write on every
# shell repo. Until it exists, this job fails harmlessly and nothing ships.
#
# GATED ON `check`: this fires only after the `check` workflow SUCCEEDS on main, so a
# push that fails product-word / doc-lint never ships. `workflow_dispatch` stays as a
# manual override (skips the gate deliberately). The SHA/actor come from the checked
# run for the gated path, from the current ref for a manual re-trigger.

on:
  workflow_run:
    workflows: [check]
    types: [completed]
  workflow_dispatch: # manual override — re-trigger from the Actions tab, bypasses the gate

permissions:
  contents: read

jobs:
  notify-shell:
    runs-on: ubuntu-latest
    # Fire when: a shell is configured AND either this is a manual dispatch, or `check`
    # passed on main. A failed/cancelled check, or a check on a non-main branch (PRs),
    # never deploys.
    if: >-
      vars.SHELL_REPO != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    steps:
      - name: Ask the deploy shell to bump the engine pin and deploy
        env:
          GH_TOKEN: ${{ secrets.AUGUR_DISPATCH_TOKEN }}
          SHELL_REPO: ${{ vars.SHELL_REPO }}
          # workflow_run carries the checked commit's SHA; a manual dispatch has none, so
          # fall back to the ref this workflow ran on.
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
        run: |
          # SHELL_REPO is a comma- or space-separated LIST of owner/repo. Every instance
          # that wants the engine the moment it moves goes in the list; an instance that
          # prefers to pull on its own schedule simply stays out of it. One shell is just
          # a list of one, so the single-value form keeps working unchanged.
          #
          # Each dispatch is attempted independently and a failure is reported, never
          # swallowed — one shell whose token scope is missing must not silently look
          # like a successful deploy for the others. The job fails if ANY shell failed,
          # after all of them have been tried.
          failed=""
          for shell in $(echo "$SHELL_REPO" | tr ',' ' '); do
            if gh api -X POST "/repos/$shell/dispatches" \
                 -f event_type=engine-updated \
                 -f "client_payload[sha]=$SHA" \
                 -f "client_payload[actor]=$ACTOR"; then
              echo "Dispatched engine-updated for $SHA → $shell"
            else
              echo "::error::dispatch to $shell FAILED — check AUGUR_DISPATCH_TOKEN covers it"
              failed="$failed $shell"
            fi
          done
          if [ -n "$failed" ]; then echo "::error::shells not dispatched:$failed"; exit 1; fi
