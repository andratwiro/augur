name: Preflight — can CI read a space repo?

# Part of the add-a-space ritual: BEFORE mounting a new space repo as a submodule,
# verify SUBMODULE_PAT can read it — mounting first would break every deploy at the
# checkout step until the grant is fixed. Run from the Actions tab (or
# `gh workflow run space-preflight.yml -f repo=<id>`); green = safe to mount.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Space repo name (under andratwiro/)"
        required: true
        default: go-vocal-2

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SUBMODULE_PAT read access
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REPO" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "::error::bad repo name '$REPO'"; exit 1
          fi
          # Output fully discarded so the token-bearing URL can never reach the log.
          if git ls-remote "https://x-access-token:${PAT}@github.com/andratwiro/${REPO}.git" HEAD >/dev/null 2>&1; then
            echo "OK — SUBMODULE_PAT can read andratwiro/${REPO}; safe to mount at spaces/${REPO}."
          else
            echo "::error::SUBMODULE_PAT cannot read andratwiro/${REPO} — add it to the token's repository access (github.com → Settings → Developer settings → Personal access tokens), then re-run."; exit 1
          fi
