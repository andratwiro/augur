# Publish the CLI to npm WITH PROVENANCE — from here, never from a laptop.
#
# Why here: a package published from a machine carries nothing that ties it to this
# repository. Fresh agents that are handed a workspace link check exactly that before they
# run `npx @augurworks/augur connect`, and on 6 Sep 2026 two of two refused on it ("published
# hours ago, by a maintainer whose email does not match the scope, nothing links it to the
# repo the site names"). `npm publish --provenance` from GitHub Actions attaches a signed
# attestation naming this repository, this commit and this workflow; `npm audit signatures`
# verifies it, and the registry page shows it.
#
# Trigger: push a tag `npm-v<version>` whose version equals package.json's. The tag namespace
# is deliberately NOT `v*`: instances on `TRACK: release` follow GitHub releases, and an npm
# cut is not an engine release. `workflow_dispatch` re-runs the same for the checked-out ref.
#
# Credential: the job's OIDC identity once the package's npm settings name this workflow as
# a trusted publisher (owner andratwiro, repository augur, workflow publish.yml, "allow npm
# publish") — the same identity the attestation is signed with. Until that entry exists,
# the `NPM_TOKEN` repo secret is written to an .npmrc for the publish step and nothing
# else; delete the secret and the step below publishes on the OIDC identity alone.
name: publish

on:
  push:
    tags: ["npm-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # the provenance attestation is signed against this workflow's identity

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # No `registry-url` here ON PURPOSE: with it, setup-node writes an .npmrc whose
      # `_authToken` is a placeholder, npm takes that for a credential and skips the
      # trusted-publisher exchange, and the registry answers the unauthenticated upload with
      # a 404 (two cuts went that way on 6 Sep 2026). With nothing configured, npm >= 11.5.1
      # trades the job's OIDC token for the publish itself.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node -v && npm -v && npm config get registry
      # The identity this run presents to npm, decoded — the trusted-publisher entry on the
      # package must match these fields exactly (owner/repository, workflow file, environment).
      - name: the OIDC claims this run presents
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).value")
          node -e "const c=JSON.parse(Buffer.from(process.argv[1].split('.')[1],'base64url'));for(const k of ['iss','aud','repository','repository_owner','workflow_ref','job_workflow_ref','environment','ref','event_name'])console.log(k.padEnd(18),c[k]??'(absent)')" "$tok"
      - name: the tag names the version package.json carries
        if: startsWith(github.ref, 'refs/tags/npm-v')
        run: |
          want="${GITHUB_REF_NAME#npm-v}"
          have="$(node -p "require('./package.json').version")"
          [ "$want" = "$have" ] || { echo "tag says $want, package.json says $have"; exit 1; }
      - run: npm run check
      - name: a token only while no trusted-publisher entry exists
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc; chmod 600 ~/.npmrc; echo "publishing with the token"; else echo "publishing on the OIDC identity"; fi
      - run: set -o pipefail; npm publish --provenance --access public --loglevel verbose 2>&1 | grep -viE "^npm (verb|http) (fetch|cache)"
      - if: always()
        run: rm -f ~/.npmrc
      - name: the registry shows the attestation
        run: |
          v="$(node -p "require('./package.json').version")"
          for i in 1 2 3 4 5 6; do
            if npm view "@augurworks/augur@$v" dist.attestations.url 2>/dev/null | grep -q .; then npm view "@augurworks/augur@$v" dist.attestations; exit 0; fi
            sleep 20
          done
          echo "no attestation visible yet for $v"; exit 1
