name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # This shell composes the public Augur ENGINE (submodule at engine/) plus one
      # submodule per space, mounted at spaces/<id>. The engine is public, but the space
      # repos are private — and actions/checkout uses ONE token for the host repo and
      # every submodule, so SUBMODULE_PAT needs Contents:read on THIS repo and on every
      # space repo. (.gitmodules URLs must stay HTTPS — checkout cannot authenticate SSH
      # URLs.)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for per-prototype "last worked on" ordering
          submodules: true        # pull the engine + every space repo
          token: ${{ secrets.SUBMODULE_PAT }}

      # Sanity guard: at least one space submodule actually checked out. A PAT/scope
      # mistake surfaces as an empty spaces/ dir, and the build would ship an empty site.
      - name: Guard — space submodules checked out
        run: |
          if ! ls spaces/*/space.json >/dev/null 2>&1; then
            echo "::error::no space submodule with a space.json checked out (PAT scope, or missing submodule?)."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The engine's build.js reads spaces + identity + deploy config from THIS repo via
      # env overrides; it emits dist inside the engine checkout (engine/dist).
      - name: Build site
        run: node engine/build.js
        env:
          GV_SPACES_ROOT: ${{ github.workspace }}/spaces
          GV_IDENTITY_PATH: ${{ github.workspace }}/identity.json
          GV_DEPLOY_CONFIG_PATH: ${{ github.workspace }}/deploy.config.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy engine/dist --project-name=your-pages-project --branch=main

      # In R2 bundle mode, the Pages deploy above ships worker CODE + chrome; content
      # ships exclusively via `augur publish` from the space clones — this job's
      # space checkouts are pinned and may lag direct publishes, so it must
      # never touch space content (--engine can't, by construction). Skips
      # gracefully while AUGUR_TOKEN isn't configured (assets-mode setups).
      - name: Publish engine chrome to the bundle store
        env:
          AUGUR_TOKEN: ${{ secrets.AUGUR_TOKEN }}
          AUGUR_ORIGIN: https://your-site-origin.example
          GV_SPACES_ROOT: ${{ github.workspace }}/spaces
          GV_IDENTITY_PATH: ${{ github.workspace }}/identity.json
          GV_DEPLOY_CONFIG_PATH: ${{ github.workspace }}/deploy.config.json
        run: |
          if [ -z "$AUGUR_TOKEN" ]; then echo "AUGUR_TOKEN not configured — skipping store publish"; exit 0; fi
          cd engine && node scripts/publish.mjs --engine

      # The realtime (canvas multiplayer) worker deploys separately from Pages; its
      # instance config lives in THIS repo (realtime.wrangler.toml). Third parties
      # forget manual redeploys, so: when the engine pin moved AND the move touched
      # engine realtime code, redeploy it here. Skips gracefully when the shell has
      # no realtime config, the pin didn't move, or realtime/ is untouched.
      - name: Redeploy realtime if the engine bump changed it
        if: ${{ hashFiles('realtime.wrangler.toml') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OLD="$(git rev-parse '${{ github.event.before }}:engine' 2>/dev/null \
             || git rev-parse 'HEAD^:engine' 2>/dev/null || true)"
          NEW="$(git rev-parse 'HEAD:engine')"
          if [ -z "$OLD" ] || [ "$OLD" = "$NEW" ]; then echo "engine pin unmoved — skipping realtime."; exit 0; fi
          if git -C engine diff --quiet "$OLD" "$NEW" -- realtime/ 2>/dev/null; then
            echo "engine bump didn't touch realtime/ — skipping."; exit 0
          fi
          echo "realtime/ changed in ${OLD:0:12}..${NEW:0:12} — redeploying"
          npx wrangler deploy -c realtime.wrangler.toml
