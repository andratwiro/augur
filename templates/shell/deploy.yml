name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # A deploy shell composes ONLY the Augur ENGINE (submodule at engine/). No
      # space repo is mounted here and none is checked out: space content reaches
      # production exclusively through `augur publish` from a space clone, into the
      # bundle store the worker serves from.
      #
      # If you are tempted to mount spaces here and build the whole site: that was
      # the previous design, and it gave every page two sources of content with
      # nothing to tell them apart. The store shadowed the built assets at serve
      # time, so a submodule pin could sit weeks behind its space repo while the
      # live URL served something else — and bumping the pin changed nothing,
      # because pins were never the serving path. Keep the roster of space repos in
      # deploy.config.json (`spaces`) for repo-side automation instead.
      #
      # The engine is public; SUBMODULE_PAT is only needed because actions/checkout
      # uses one token for the host repo and its submodules, and this shell repo is
      # private. (.gitmodules URLs must stay HTTPS — checkout cannot authenticate
      # SSH URLs.)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the realtime step below diffs across the engine pin move
          submodules: true        # the engine only
          token: ${{ secrets.SUBMODULE_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # GV_ENGINE_ONLY=1 builds the shared chrome and the worker with NO space on
      # disk. That is the point: a build that never sees a space cannot emit one, so
      # this job is structurally incapable of overwriting a direct publish however
      # stale its checkout. build.js asserts the result really is chrome-only and
      # fails the deploy if anything space-derived slipped in.
      - name: Build engine chrome
        run: node engine/build.js
        env:
          GV_ENGINE_ONLY: "1"
          GV_IDENTITY_PATH: ${{ github.workspace }}/identity.json
          GV_DEPLOY_CONFIG_PATH: ${{ github.workspace }}/deploy.config.json

      # Pages carries the WORKER (_worker.js) — the code that serves the site — plus
      # the chrome as an assets-mode fallback. Content is not here.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy engine/dist --project-name=your-pages-project --branch=main

      # The store's copy of the chrome, plus the instance config (identity + knobs)
      # the worker reads at runtime. --engine sets GV_ENGINE_ONLY itself, so it
      # cannot touch space content. Skips gracefully while AUGUR_TOKEN isn't
      # configured (assets-mode setups, where Pages is the only source).
      - name: Publish engine chrome to the bundle store
        env:
          AUGUR_TOKEN: ${{ secrets.AUGUR_TOKEN }}
          AUGUR_ORIGIN: https://your-site-origin.example
          GV_IDENTITY_PATH: ${{ github.workspace }}/identity.json
          GV_DEPLOY_CONFIG_PATH: ${{ github.workspace }}/deploy.config.json
        run: |
          if [ -z "$AUGUR_TOKEN" ]; then echo "AUGUR_TOKEN not configured — skipping store publish"; exit 0; fi
          cd engine && node scripts/publish.mjs --engine

      # The realtime (canvas multiplayer) worker deploys separately from Pages; its
      # instance config lives in THIS repo (realtime.wrangler.toml). Third parties
      # forget manual redeploys, so: when the engine pin moved AND the move touched
      # engine realtime code, redeploy it here. Skips gracefully when the shell has
      # no realtime config, the pin didn't move, or realtime/ is untouched.
      - name: Redeploy realtime if the engine bump changed it
        if: ${{ hashFiles('realtime.wrangler.toml') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OLD="$(git rev-parse '${{ github.event.before }}:engine' 2>/dev/null \
             || git rev-parse 'HEAD^:engine' 2>/dev/null || true)"
          NEW="$(git rev-parse 'HEAD:engine')"
          if [ -z "$OLD" ] || [ "$OLD" = "$NEW" ]; then echo "engine pin unmoved — skipping realtime."; exit 0; fi
          if git -C engine diff --quiet "$OLD" "$NEW" -- realtime/ 2>/dev/null; then
            echo "engine bump didn't touch realtime/ — skipping."; exit 0
          fi
          echo "realtime/ changed in ${OLD:0:12}..${NEW:0:12} — redeploying"
          npx wrangler deploy -c realtime.wrangler.toml

  # Published pages bake the engine's page-level chrome (rail, profile menu, overlays,
  # responsive layout) at PUBLISH time; the deploy above refreshes the SERVING engine but
  # leaves already-published space pages on their old baked chrome until the space
  # republishes (its /_build.json `builtWithEngine` is what moves). So when the engine pin
  # moved, re-bake every space in the roster against the new engine — HERE, with the
  # shell's own token, not by asking each space to do it.
  #
  # Why the shell and not the space: AUGUR_TOKEN is `*`-scoped (it has to be — it pushes
  # instance config), so it can publish any space on this instance. Re-baking centrally
  # means the star token lives ONLY in this private shell, never in a (possibly public)
  # space repo, and no space needs a token or CI of its own. It does NOT weaken the "one
  # source of content" rule: it runs the ordinary `augur publish` client against a fresh
  # clone of the space's own repo (its git HEAD, the real source), exactly as a person
  # would — the store's stale-base / unpublish guards still apply.
  rebake:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # the engine, at the just-deployed pin — bakes exactly it
          token: ${{ secrets.SUBMODULE_PAT }}
          fetch-depth: 0            # to tell whether the pin actually moved
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Only when the pin moved. For each roster space: clone it (full history — publish.mjs
      # refuses a shallow clone, it dates cards from git) and publish it with the star token
      # and the shell's pinned engine. A single space's failure warns and the job fails at
      # the end so it's visible; health.yml (f) also alarms on any drift that outlives its
      # window. AUGUR_TOKEN unset = assets-mode shell with nothing to publish.
      - name: Re-bake each roster space against the new engine (only when the pin moved)
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_PAT }}   # clone the space repos
          AUGUR_TOKEN: ${{ secrets.AUGUR_TOKEN }}  # *-scoped: publishes any space's content
        run: |
          set -uo pipefail
          if [ -z "${AUGUR_TOKEN:-}" ]; then echo "AUGUR_TOKEN unset (assets-mode) — nothing to re-bake"; exit 0; fi
          OLD="$(git rev-parse '${{ github.event.before }}:engine' 2>/dev/null \
             || git rev-parse 'HEAD^:engine' 2>/dev/null || true)"
          NEW="$(git rev-parse 'HEAD:engine' 2>/dev/null || true)"
          if [ -z "$NEW" ] || [ -z "$OLD" ] || [ "$OLD" = "$NEW" ]; then echo "engine pin unmoved — no re-bake needed."; exit 0; fi
          FAILED=""
          while read -r ID REPO; do
            [ -n "$ID" ] && [ -n "$REPO" ] || continue
            DIR="$RUNNER_TEMP/space-$ID"; rm -rf "$DIR"
            if ! git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$DIR"; then
              echo "::warning::clone of $REPO failed — skipping $ID"; FAILED="$FAILED $ID"; continue
            fi
            echo "re-baking $ID ($REPO) @ engine ${NEW:0:12}"
            if GV_SPACES_ROOT="$DIR" node engine/scripts/publish.mjs; then
              echo "re-baked $ID"
            else
              echo "::warning::re-bake of $ID failed"; FAILED="$FAILED $ID"
            fi
          done < <(jq -r '.spaces[]? | "\(.id) \(.repo)"' deploy.config.json)
          if [ -n "$FAILED" ]; then echo "::error::re-bake failed for:$FAILED — see warnings above"; exit 1; fi
          echo "re-bake complete."
