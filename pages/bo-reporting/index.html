<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reporting — GoVocal back office (reference)</title>
  <meta name="gv-surface" content="back-office" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-bo.css" />
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-avatars.js" defer></script>
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: var(--gv-bo-canvas); font-family: var(--gv-font-family); }
    .rp-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .rp-head__actions { margin-left: auto; flex: none; }
    /* Page header in this view is 30px/700 (digest); canonical .gv-bo-pagehead is 28px/600 — override locally */
    .rp-pagehead { font-size: var(--gv-fs-xxxl); font-weight: 700; line-height: 39px; }

    /* Tabs + rows sit inside one bordered card (digest: border 1px #E0E0E0, radius 3px). */
    .rp-card { border: 1px solid var(--gv-divider); border-radius: var(--gv-radius); background: #fff; margin-top: 16px; }
    /* Tab bar = light-grey strip, rounded top, ~44px left indent (digest: bg #FBFBFB, radius 3px 3px 0 0, padding-left 44px). */
    .rp-tabs { display: flex; gap: 32px; background: var(--gv-grey-50, #FBFBFB); border-bottom: 1px solid var(--gv-divider); border-radius: var(--gv-radius) var(--gv-radius) 0 0; padding: 0 0 0 44px; }
    .rp-tabs a { padding: 16px 0; font-size: var(--gv-fs-base); line-height: 24px; color: var(--gv-text-secondary); text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -1px; }
    .rp-tabs a.is-active { color: var(--gv-bo-primary); border-color: var(--gv-bo-primary); }
    /* Card body: rows get 36px side padding (digest: padding 0 36px 36px). */
    .rp-list { padding: 0 36px; }

    .rp-title { font-size: var(--gv-fs-base); font-weight: 700; line-height: 20.8px; }
    .rp-title a { color: var(--gv-bo-primary); text-decoration: none; }
    .rp-title a:hover { text-decoration: underline; }
    .rp-meta { font-size: var(--gv-fs-s); line-height: 21px; color: var(--gv-text-secondary); }
    /* Modified-by indicator is a small round author avatar (digest: avatarImage, 28px native ≈ 14px, radius 50%) — NOT a coral pen. */
    .rp-meta .rp-avatar { width: 16px; height: 16px; border-radius: 50%; background: var(--gv-grey-200); vertical-align: -3px; display: inline-block; }

    /* Row action buttons use base .gv-btn size (digest: 16px/400, padding 9px 18px, radius 3px). */
    .rp-actions { gap: 12px; }
    /* Delete reads flat: white bg, transparent border, secondary-grey label (digest). */
    .rp-actions .rp-del { background: #fff; border-color: transparent; color: var(--gv-text-secondary); }
    .rp-actions .rp-del:hover { background: var(--gv-grey-100); }
  </style>
</head>
<body class="gv-bo">
  <div class="gv-bo-shell">
    <nav class="gv-bo-side" aria-label="Admin" data-active="reporting"></nav>

    <div class="gv-bo-main">
      <section class="gv-bo-section">
        <div class="rp-head">
          <h1 class="gv-bo-pagehead rp-pagehead">Report builder</h1>
          <div class="rp-head__actions"><button class="gv-btn admin-dark"><span data-gv-icon="plus"></span><span class="gv-btn__label">Create a report</span></button></div>
        </div>

        <span class="gv-bo-search" style="display:inline-block"><input class="gv-input" type="search" placeholder="Search reports" aria-label="Search reports" style="max-width:280px"><span class="gv-icon" data-gv-icon="search"></span></span>

        <div class="rp-card">
          <nav class="rp-tabs" aria-label="Report views">
            <a href="#">Your reports (10)</a>
            <a class="is-active" href="#">All reports (17)</a>
            <a href="#">Progress reports (10)</a>
          </nav>
          <div class="rp-list" id="reports"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="bo-chrome.js"></script>
  <script>
    // [title, date, modifiedDays]
    const REPORTS = [
      ["Issues on public health care service", "18/09/2024", 727],
      ["Ideation report demo", "26/09/2023", 993],
      ["Survey report 3", "26/09/2023", 993],
      ["Report survey", "26/09/2023", 993],
      ["Survey report 2", "26/09/2023", 993],
      ["Test", "25/09/2023", 994],
      ["Enquête", "25/09/2023", 994],
      ["Survey report", "25/09/2023", 994],
      ["Test report", "25/09/2023", 994],
      ["Community survey", "24/09/2023", 994],
      ["Survey Results", "24/09/2023", 994],
      ["Ideation project report", "24/09/2023", 994],
      ["Loneliness project", "24/09/2023", 995],
      ["Park project", "24/09/2023", 995],
      ["Survey results", "24/09/2023", 995],
      ["City park - report", "24/09/2023", 995],
      ["Survey report", "24/09/2023", 995],
    ];
    document.getElementById("reports").innerHTML = REPORTS.map(([title, date, days]) => `
      <div class="gv-bo-listrow">
        <div class="gv-bo-listrow__main">
          <div class="rp-title"><a href="#">${title}</a></div>
          <div class="gv-bo-listrow__sub rp-meta">${date} • <span class="av rp-avatar" aria-hidden="true"></span> Modified ${days} days ago</div>
        </div>
        <div class="gv-bo-listrow__actions rp-actions">
          <button class="gv-btn rp-del"><span data-gv-icon="delete"></span><span class="gv-btn__label">Delete</span></button>
          <button class="gv-btn secondary-outlined"><span data-gv-icon="open-in-new"></span><span class="gv-btn__label">Duplicate</span></button>
          <button class="gv-btn secondary-outlined"><span data-gv-icon="edit"></span><span class="gv-btn__label">Edit</span></button>
        </div>
      </div>`).join("");
    if (window.GVIcons) window.GVIcons.render(document.body);
    if (window.GVAvatars) window.GVAvatars.fill(document.body);
  </script>
</body>
</html>
</content>
