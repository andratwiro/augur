<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reporting — GoVocal back office (reference)</title>
  <meta name="gv-surface" content="back-office" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-bo.css" />
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: var(--gv-bo-canvas); font-family: var(--gv-font-family); }
    .rp-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .rp-head__actions { margin-left: auto; flex: none; }
    .rp-tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--gv-divider); margin: 14px 0 0; }
    .rp-tabs a { padding: 12px 0; color: var(--gv-text-secondary); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .rp-tabs a.is-active { color: var(--gv-bo-primary); border-color: var(--gv-bo-primary); font-weight: 600; }
    .rp-title { font-size: 15px; font-weight: 700; }
    .rp-title a { color: var(--gv-bo-primary); text-decoration: none; }
    .rp-title a:hover { text-decoration: underline; }
    .rp-meta { color: var(--gv-text-secondary); }
    .rp-meta .gv-icon { width: 13px; height: 13px; vertical-align: -2px; color: var(--gv-orange-500); }
  </style>
</head>
<body class="gv-bo">
  <div class="gv-bo-shell">
    <nav class="gv-bo-side" aria-label="Admin" data-active="reporting"></nav>

    <div class="gv-bo-main">
      <section class="gv-bo-section">
        <div class="rp-head">
          <h1 class="gv-bo-pagehead">Report builder</h1>
          <div class="rp-head__actions"><button class="gv-btn admin-dark"><span data-gv-icon="plus"></span><span class="gv-btn__label">Create a report</span></button></div>
        </div>

        <span class="gv-bo-search" style="display:inline-block"><input class="gv-input" type="search" placeholder="Search reports" aria-label="Search reports" style="max-width:280px"><span class="gv-icon" data-gv-icon="search"></span></span>

        <nav class="rp-tabs" aria-label="Report views">
          <a href="#">Your reports (10)</a>
          <a class="is-active" href="#">All reports (17)</a>
          <a href="#">Progress reports (10)</a>
        </nav>

        <div style="margin-top:8px"><div id="reports"></div></div>
      </section>
    </div>
  </div>

  <script src="bo-chrome.js"></script>
  <script>
    // [title, date, modifiedDays]
    const REPORTS = [
      ["Issues on public health care service", "18/09/2024", 727],
      ["Ideation report demo", "26/09/2023", 993],
      ["Survey report 3", "26/09/2023", 993],
      ["Report survey", "26/09/2023", 993],
      ["Survey report 2", "26/09/2023", 993],
      ["Test", "25/09/2023", 994],
      ["Enquête", "25/09/2023", 994],
      ["Survey report", "25/09/2023", 994],
      ["Test report", "25/09/2023", 994],
      ["Community survey", "24/09/2023", 994],
      ["Survey Results", "24/09/2023", 994],
      ["Ideation project report", "24/09/2023", 994],
      ["Loneliness project", "24/09/2023", 995],
      ["Park project", "24/09/2023", 995],
      ["Survey results", "24/09/2023", 995],
      ["City park - report", "24/09/2023", 995],
      ["Survey report", "24/09/2023", 995],
    ];
    document.getElementById("reports").innerHTML = REPORTS.map(([title, date, days]) => `
      <div class="gv-bo-listrow">
        <div class="gv-bo-listrow__main">
          <div class="rp-title"><a href="#">${title}</a></div>
          <div class="gv-bo-listrow__sub rp-meta">${date} · <span class="gv-icon" data-gv-icon="pen"></span> Modified ${days} days ago</div>
        </div>
        <div class="gv-bo-listrow__actions">
          <button class="gv-bo-link" style="color:var(--gv-text-secondary)"><span data-gv-icon="delete"></span>Delete</button>
          <button class="gv-bo-link" style="color:var(--gv-text-secondary)"><span data-gv-icon="open-in-new"></span>Duplicate</button>
          <button class="gv-btn secondary-outlined size-s"><span data-gv-icon="edit"></span><span class="gv-btn__label">Edit</span></button>
        </div>
      </div>`).join("");
    if (window.GVIcons) window.GVIcons.render(document.body);
  </script>
</body>
</html>
</content>
