<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Notifications — GoVocal back office (reference)</title>
  <meta name="gv-surface" content="back-office" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-bo.css" />
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: var(--gv-bo-canvas); font-family: var(--gv-font-family); }
    .nt-head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .nt-head__actions { margin-left: auto; }
    .nt-group { margin: 18px 0 6px; font-size: var(--gv-fs-13); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--gv-cool-grey-500); }
    .nt-row { display: flex; align-items: flex-start; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--gv-divider); position: relative; }
    .nt-row:last-child { border-bottom: 0; }
    .nt-row.is-unread { background: var(--gv-teal-75); }
    .nt-row.is-unread::before { content: ""; position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 7px; height: 7px; border-radius: 50%; background: var(--gv-teal-400); }
    .nt-ava { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--gv-white); font-size: var(--gv-fs-13); font-weight: 600; background: var(--gv-cool-grey-500); }
    .nt-ava.icon { background: var(--gv-teal-75); color: var(--gv-bo-primary); }
    .nt-ava.icon .gv-icon { width: 18px; height: 18px; }
    .nt-body { min-width: 0; flex: 1 1 auto; }
    .nt-text { font-size: var(--gv-fs-s); color: var(--gv-text-primary); line-height: 1.45; }
    .nt-text b { color: var(--gv-bo-primary); }
    .nt-text a { color: var(--gv-bo-link); text-decoration: none; }
    .nt-text a:hover { text-decoration: underline; }
    .nt-time { margin-top: 3px; font-size: var(--gv-fs-xs); color: var(--gv-text-secondary); }
  </style>
</head>
<body class="gv-bo">
  <div class="gv-bo-shell">
    <nav class="gv-bo-side" aria-label="Admin" data-active="notifications"></nav>

    <div class="gv-bo-main">
      <section class="gv-bo-section">
        <div class="nt-head">
          <h1 class="gv-bo-pagehead">Notifications</h1>
          <div class="nt-head__actions"><button class="gv-bo-link"><span data-gv-icon="check"></span>Mark all as read</button></div>
        </div>

        <p class="nt-group">Today</p>
        <div class="gv-bo-card" style="padding:0" id="today"></div>

        <p class="nt-group">Earlier</p>
        <div class="gv-bo-card" style="padding:0" id="earlier"></div>
      </section>
    </div>
  </div>

  <script src="bo-chrome.js"></script>
  <script>
    // [type, actor, html, time, unread]
    // type: 'avatar' -> initials; 'icon' -> system icon
    const TODAY = [
      ["avatar", "Nola Moreau", `<b>Nola Moreau</b> posted a new input <a href="#">"More trees along the riverside path"</a> in <a href="#">Dorothea Dix Park</a>.`, "12 minutes ago", true, ""],
      ["avatar", "Kevin Anderson", `<b>Kevin Anderson</b> commented on <a href="#">"Better lighting near the south entrance"</a>.`, "1 hour ago", true, ""],
      ["icon", "", `An input was assigned to you: <a href="#">"A weekly food market on the plaza"</a>.`, "3 hours ago", true, "user-circle"],
      ["icon", "", `Your project <a href="#">2024 Budget priorities</a> reached <b>1,000 participants</b>.`, "5 hours ago", false, "trend-up"],
    ];
    const EARLIER = [
      ["avatar", "Pamela Beasly", `<b>Pamela Beasly</b> reacted to <a href="#">"Dog exercise area"</a>.`, "Yesterday", false, ""],
      ["icon", "", `The phase <b>Ideation</b> of <a href="#">Reimagine Dorothea Dix Park</a> ends in 3 days.`, "Yesterday", false, "clock"],
      ["avatar", "Roberto Andrade", `<b>Roberto Andrade</b> mentioned you in an internal comment.`, "2 days ago", false, ""],
      ["icon", "", `A proposal reached its voting threshold: <a href="#">"Protected bike lanes downtown"</a>.`, "3 days ago", false, "vote-up"],
      ["icon", "", `5 new inputs need feedback in <a href="#">Mapping: improve bicycle infrastructure</a>.`, "4 days ago", false, "comment"],
    ];
    function render(list) {
      return list.map(([type, actor, html, time, unread, icon]) => {
        const ava = type === "icon"
          ? `<span class="nt-ava icon"><span data-gv-icon="${icon}"></span></span>`
          : `<span class="nt-ava">${actor.split(" ").map(w => w[0]).join("").slice(0,2)}</span>`;
        return `<div class="nt-row${unread ? " is-unread" : ""}">
          ${ava}
          <div class="nt-body"><div class="nt-text">${html}</div><div class="nt-time">${time}</div></div>
        </div>`;
      }).join("");
    }
    document.getElementById("today").innerHTML = render(TODAY);
    document.getElementById("earlier").innerHTML = render(EARLIER);
    if (window.GVIcons) window.GVIcons.render(document.body);
  </script>
</body>
</html>
</content>
