<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Input Form (survey) — GoVocal (reference)</title>
  <link rel="stylesheet" href="govocal-tokens.css" />
  <link rel="stylesheet" href="govocal-ui.css" />
  <link rel="stylesheet" href="govocal-survey.css" />
  <script src="govocal-themes.js" defer></script>
  <script src="govocal-icons.js" defer></script>
  <script src="govocal-survey.js" defer></script>
  <!--
    REFERENCE REBUILD of the GoVocal resident INPUT FORM / survey runner.
    This page is now just the DATA: the FORM object below (a simplified GoVocal
    `custom_fields` payload). The field components, the wizard, the progress bar and
    the gate behaviour all come from the SHARED survey kit — govocal-survey.css +
    govocal-survey.js (skills/govocal-ui/) — which any prototype can reuse. Swap the
    FORM object to render a different survey; every colour/font is a --gv-* token so it
    re-skins per city via ?theme=. Pages-tab reference → NO cookie banner.

    Covers all 17 input types: text · multiline_text · number · select · multiselect ·
    rating · ranking · linear_scale · sentiment · multiselect_image · matrix ·
    file_upload · shapefile_upload · point/line/polygon (map) · page breaks.
  -->
  <style>
    /* Page-specific only: the survey field/runner CSS lives in govocal-survey.css. */
    body { margin: 0; background: var(--gv-background); font-family: var(--gv-font-family); }
  </style>
</head>
<body class="gv-root" data-gv-theme-picker="off">
  <main class="sv-wrap"><div id="survey"></div></main>

  <script>
  /* ════════════════════════════════════════════════════════════════════════
     THE FORM DEFINITION — the only page-specific part. `type` ∈ the 17 input
     types; `gate:true` = de-facto-required-to-advance (rating/scale/sentiment/matrix).
     ════════════════════════════════════════════════════════════════════════ */
  const FORM = {
    pages: [
      { kind:'intro', title:"We're renovating Coffman Park!", media:"COFFMAN PARK\nRENOVATION",
        desc:"In 2025 we've decided to do a renovation of the Coffman Park in order to build a more enjoyable recreation area for residents. Please explore the plan in the following survey and respond to questions about the proposal. Thank you!" },

      { emoji:'👋', title:'About you', desc:'Help us understand who is participating in this survey so we can design a park that meets the needs of the community.',
        fields:[
          { type:'select', label:'Which age group do you belong to?', desc:'Choose one',
            options:['Under 18','18–24','25–34','35–44','45–54','55–64','65+'] },
          { type:'number', label:'How many people in your household typically visit Coffman Park?' },
        ] },

      { emoji:'🌿', title:'How you use Coffman Park today', desc:'Tell us how often you visit the park and what you currently do there.',
        fields:[
          { type:'select', label:'Do you live within 15 minute walking distance of Coffman park?', options:['Yes','No'] },
          { type:'select', label:'How often do you visit the park?', options:['Daily','A few times a week','Weekly','A few times a month','Rarely','Never'] },
          { type:'text', label:'What’s the first word that comes to mind when you think of Coffman Park?' },
          { type:'multiselect', label:'What activities do you currently enjoy in the park?', desc:'Select all that apply',
            options:['Walking or running','Picnicking','Playing sports','Reading or relaxing','Letting kids play','Dog walking','Birdwatching','Attending events','Other'] },
          { type:'rating', label:'How would you rate your current overall experience with Coffman Park?', desc:'(1 = very poor, 5 = excellent)', max:5, gate:true },
        ] },

      { emoji:'🧠', title:'Ideas & improvements', desc:'Let’s improve together. Share your ideas and help us prioritize what matters most.',
        fields:[
          { type:'multiline_text', label:'What improvements would make Coffman Park more useful or enjoyable for you?' },
          { type:'ranking', label:'Rank the following features in order of importance for the redesigned park.', desc:'(1 = most important)',
            options:['Nature and biodiversity','Play and recreation','Accessibility for all ages and abilities','Community gathering spaces','Art and cultural installations','Safety and lighting','Public restrooms'] },
          { type:'linear_scale', label:'How important is environmental sustainability in the park redesign?', desc:'(1 = not important, 7 = extremely important)', max:7, minLabel:'not important', maxLabel:'extremely important', gate:true },
          { type:'sentiment', label:'How do you feel about the current safety in Coffman Park?', desc:'(from very unsafe to very safe)',
            faces:['😣','🙁','😐','🙂','😄'], labels:['Very bad','Bad','Ok','Good','Very good'], gate:true },
        ] },

      { emoji:'🎨', title:'Design preferences', desc:'We’d love to know what you’d like to see in terms of look, feel, and features.',
        fields:[
          { type:'multiselect_image', label:'Which type of playground style do you prefer for the new design?', desc:'(Select one image)',
            images:[
              { src:'img/playground-wooden.jpeg',    label:'Natural wooden play structures' },
              { src:'img/playground-modern.jpeg',    label:'Colorful rubberized modern sets' },
              { src:'img/playground-adventure.png',  label:'Adventure playground with climbing nets' },
              { src:'img/playground-splash.jpeg',    label:'Water-based splash zone' },
            ] },
          { type:'matrix', label:'Please rate the following aspects of Coffman Park.', gate:true,
            scale:['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'],
            statements:[
              'I prefer fewer features in the park if it means lower maintenance costs.',
              'The park should prioritize quiet natural areas, even if it means fewer activities.',
              'It’s more important to add security features than to keep the park feeling open.',
              'The park should host community events, even if it means more noise.',
              'I would accept fewer trees if it meant better lighting and visibility.',
              'I’d rather have more native plants than large lawn areas.',
              'I’d prefer a fenced playground for safety, even if it feels less open.',
              'I support water features (like fountains) even if they raise maintenance.',
              'The park should offer Wi-Fi access, even if it means installing more infrastructure.',
            ] },
          { type:'file_upload', label:'Do you have any documents, photos, or past proposals related to the park to share?', desc:'Upload files here' },
        ] },

      { emoji:'🚧', title:"Let's zoom in on the Recreation Features demolition",
        desc:"Due to the skate park and courts being largely unused, we've decided to demolish them and replace them with something the community wants more.",
        fields:[
          { type:'linear_scale', label:'Do you think demolishing these features is the right choice?', desc:'(1 = Strongly disagree, 5 = Strongly agree)', max:5, minLabel:'Strongly disagree', maxLabel:'Strongly agree', gate:true },
          { type:'text', label:'Why?' },
          { type:'select', label:'What features would you like to see here instead?', options:['Community garden','Splash pad','Playground','Botanical garden and greenhouse','Grass field','Other'] },
        ] },

      { emoji:'🗺️', title:'Spatial feedback', desc:'Let us know where improvements are most needed using the interactive map tools.',
        fields:[
          { type:'map', shape:'line', label:'What route do you most often walk in Coffman Park?', desc:'Draw the usual path you take when walking through the park.' },
          { type:'map', shape:'polygon', label:'Where would you like to see more parking along your walking route?', desc:'Highlight a specific area in the park that you believe needs the most improvement.' },
          { type:'map', shape:'point', label:'Where would you most like to see new bicycle storage in Coffman Park?', desc:'Highlight a specific area in the park that you believe needs the most improvement.' },
        ] },

      { emoji:'👷', title:'Are you a planner or GIS professional with an idea for the park development?',
        desc:'If you are a planner or GIS professional with ideas for the redevelopment, we invite you to share spatial data with us.',
        fields:[
          { type:'shapefile_upload', label:'Upload your Esri shapefile containing park redevelopment ideas here.', desc:'Are you part of a community group or planner with GIS data? Upload shapefiles here.' },
        ] },

      { emoji:'✅', title:'Final Thoughts', desc:'Thanks for your participation—your feedback is shaping the future of the Coffman Park!',
        fields:[
          { type:'multiline_text', label:'Do you have any additional thoughts to share with us on the redesigning of Coffman Park?' },
        ] },

      { kind:'thankyou', title:'Thank you for sharing your input!', desc:'Your input has been successfully submitted.' },
    ]
  };

  // The field components + wizard come from the shared survey kit (govocal-survey.js).
  document.addEventListener('DOMContentLoaded', function () {
    GVSurvey.mount(document.getElementById('survey'), FORM, {
      title: 'Survey',
      onClose: function () { alert('Close — returns to the project page in the real product.'); }
    });
  });
  </script>
</body>
</html>
