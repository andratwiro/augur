<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Report builder — GoVocal back office (reference)</title>
  <meta name="gv-surface" content="back-office" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-bo.css" />
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-avatars.js" defer></script>
  <style>
    /* Page-local layout + interaction-state CSS only. The editor chrome is the
       canonical content-builder shell (.gv-bo-cb-topbar / -palette / -canvas /
       -settings / -item / -block); novel report layout uses the page-local rb-*
       namespace. No gv-* class is DEFINED here. Colour & font-size use --gv-*
       tokens; bare layout literals (px sizes, A4 dimensions) are page-local. */
    html, body { margin: 0; height: 100%; }
    body { font-family: var(--gv-font-family); }

    /* Bound the shell to the viewport so the CANVAS scrolls internally (the report
       sheet is tall) instead of the whole page scrolling the rail away. */
    #rb-root { height: 100vh; overflow: hidden; }

    /* The settings panel is a fixed right overlay; reserve room so a selected
       widget isn't hidden underneath it. */
    #rb-root .gv-bo-cb-canvas { transition: padding-right .12s ease; }
    #rb-root.rb-has-panel .gv-bo-cb-canvas { padding-right: 400px; }
    #rb-root .gv-bo-cb-settings { display: none; border-top: 1px solid var(--gv-grey-500); }
    #rb-root.rb-has-panel .gv-bo-cb-settings { display: block; }

    /* ── Left rail tab strip (Widgets / ✨ AI) — sits above the widget list ───── */
    .rb-railtabs { display: flex; gap: 8px; padding: 12px 0 4px; }
    .rb-railtab {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 36px; padding: 0 14px; border: 1px solid var(--gv-cool-grey-600);
      border-radius: 3px; background: var(--gv-white);
      color: var(--gv-blue-500); font-size: var(--gv-fs-s); font-weight: 400;
      font-family: var(--gv-font-family); cursor: pointer; line-height: 1;
    }
    .rb-railtab.is-active { background: var(--gv-blue-500); border-color: var(--gv-blue-500); color: var(--gv-white); }
    .rb-railtab .gv-icon, .rb-railtab svg { width: 16px; height: 16px; }

    /* Widget palette is a single-column vertical list (not the 2-up CB grid). */
    .rb-palette-section { border-top: 1px solid var(--gv-grey-300); padding: 8px 0; }
    .rb-palette-section:first-of-type { border-top: 0; }

    /* AI tab pane */
    .rb-ai { padding: 16px 0; display: none; }
    #rb-root.rb-tab-ai .rb-ai { display: block; }
    #rb-root.rb-tab-ai .rb-widgets { display: none; }
    .rb-ai__card { border: 1px solid var(--gv-grey-300); border-radius: 6px; padding: 14px; }
    .rb-ai__title { display: flex; align-items: center; gap: 8px; font-size: var(--gv-fs-base); font-weight: 600; color: var(--gv-grey-800); margin: 0 0 6px; }
    .rb-ai__title svg { width: 18px; height: 18px; color: var(--gv-teal-500); }
    .rb-ai__desc { font-size: var(--gv-fs-13); color: var(--gv-cool-grey-600); margin: 0 0 12px; line-height: 1.45; }
    .rb-ai__field { width: 100%; box-sizing: border-box; min-height: 78px; resize: vertical;
      border: 1px solid var(--gv-grey-300); border-radius: 3px; padding: 8px 10px;
      font-family: var(--gv-font-family); font-size: var(--gv-fs-s); color: var(--gv-grey-800); margin: 0 0 12px; }

    /* AI accent on the rail tab star */
    .rb-railtab .rb-star { color: var(--gv-teal-500); }
    .rb-railtab.is-active .rb-star { color: var(--gv-white); }

    /* ── The A4 white report sheet on the grey canvas ────────────────────────── */
    .rb-canvas { padding-top: 40px; align-items: flex-start; }
    .rb-sheet {
      width: 794px; max-width: 100%; box-sizing: border-box;
      background: var(--gv-white); padding: 56px 64px 72px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      color: var(--gv-grey-800); font-family: var(--gv-font-family);
    }
    .rb-sheet__logo { display: flex; justify-content: center; margin: 0 0 32px; }
    .rb-sheet__logo svg { display: block; height: 44px; }

    /* A report widget = a selectable block (reuses .gv-bo-cb-block chrome for the
       selection border + label tab). rb-widget carries the report-specific look. */
    .rb-widget { margin: 0 0 4px; }
    .rb-widget .gv-bo-cb-block__body { color: var(--gv-grey-800); font-size: var(--gv-fs-base); line-height: 24px; }

    /* Report content presentation */
    /* Heading hierarchy mirrors the real editor digest: title-box h2 25px,
       section h3 21px, sub-section / data-card title h4 18px — all weight 700 /
       grey-800. */
    .rb-h1 { font-size: var(--gv-fs-xxl); font-weight: 700; line-height: 1.3; color: var(--gv-grey-800); margin: 0 0 16px; padding: 8px 12px; border: 1px solid var(--gv-blue-500); border-radius: 3px; }
    .rb-h2 { font-size: var(--gv-fs-xl); font-weight: 700; line-height: 1.3; color: var(--gv-grey-800); margin: 8px 0 16px; }
    .rb-meta { list-style: disc; margin: 0 0 18px; padding-left: 22px; color: var(--gv-grey-800); font-size: var(--gv-fs-base); line-height: 24px; }
    .rb-meta li { margin: 2px 0; }
    .rb-text { font-size: var(--gv-fs-base); line-height: 24px; color: var(--gv-grey-800); margin: 0; outline: none; }
    /* Real "Add the goal…" summary prompt renders in body grey-800 (not a faded
       placeholder grey) at 16px — keep it as ordinary body text colour. */
    .rb-text--placeholder { color: var(--gv-grey-800); }

    /* Empty-widget placeholder — the "There is no data available…" line inside a
       report-widget card. Real: card title h4 18px/700, no-data line 16px /
       cool-grey-600 with 16px top margin. */
    .rb-card { }
    .rb-card__title { font-size: var(--gv-fs-l); font-weight: 700; color: var(--gv-grey-800); margin: 0 0 8px; }
    .rb-nodata { font-size: var(--gv-fs-base); color: var(--gv-cool-grey-600); margin: 16px 0 0; }

    /* Chart placeholder (for widgets that would render data) */
    .rb-chart { border: 1px solid var(--gv-grey-300); border-radius: 4px; padding: 14px 16px; }
    .rb-chart__bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; margin-top: 8px; }
    .rb-chart__bar { flex: 1; background: var(--gv-teal-500); border-radius: 2px 2px 0 0; opacity: .85; }
    .rb-stat { font-size: 28px; font-weight: 700; color: var(--gv-grey-800); line-height: 1.2; }
    .rb-stat__label { font-size: var(--gv-fs-s); color: var(--gv-cool-grey-600); }

    .rb-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .rb-col { min-width: 0; }

    /* settings rows reuse canonical .gv-bo-cb-settings__row / __rowlabel */

    .rb-toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: var(--gv-grey-800); color: var(--gv-white); padding: 8px 14px; border-radius: 4px;
      font-size: var(--gv-fs-13); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100000;
    }
    .rb-toast.is-show { opacity: .94; }
  </style>
</head>
<body class="gv-bo">
  <div class="gv-bo-cb" id="rb-root">

    <!-- ══════════ TOP BAR ══════════ -->
    <header class="gv-bo-cb-topbar">
      <button class="gv-bo-cb-topbar__back" type="button" id="rb-go-back" aria-label="Go back">
        <span class="gv-icon" data-gv-icon="arrow-left"></span>
      </button>
      <div class="gv-bo-cb-topbar__titles">
        <h1 class="gv-bo-cb-topbar__title">Survey report 2</h1>
      </div>

      <div class="gv-bo-cb-topbar__actions">
        <div class="gv-bo-cb-locale">
          <select id="rb-locale-select" aria-label="Report language">
            <option value="en">EN</option>
            <option value="es-ES">ES-ES</option>
          </select>
        </div>

        <button class="gv-btn secondary-outlined" type="button" id="rb-download">
          <span class="gv-icon" data-gv-icon="download"></span>&nbsp;Download
        </button>

        <div class="gv-bo-cb-save-wrap" id="rb-save-wrap">
          <button class="gv-btn primary gv-bo-cb-save" type="submit">Save</button>
        </div>
      </div>
    </header>

    <div class="gv-bo-cb__body">

      <!-- ══════════ LEFT RAIL ══════════ -->
      <aside class="gv-bo-cb-palette" aria-label="Report widgets" id="rb-rail">

        <div class="rb-railtabs" role="tablist">
          <button class="rb-railtab is-active" type="button" role="tab" data-tab="widgets" aria-selected="true">Widgets</button>
          <button class="rb-railtab" type="button" role="tab" data-tab="ai" aria-selected="false">
            <span class="rb-star" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.8l1.4 4.1a3 3 0 0 0 1.9 1.9l4.1 1.4-4.1 1.4a3 3 0 0 0-1.9 1.9L10 16.6l-1.4-4.1a3 3 0 0 0-1.9-1.9L2.6 9.2l4.1-1.4a3 3 0 0 0 1.9-1.9L10 1.8z"/><path d="M16.5 2.2l.5 1.5.5-1.5 1.5-.5-1.5-.5L17 0l-.5 1.2-1.5.5 1.5.5z"/></svg>
            </span>AI</button>
        </div>

        <!-- WIDGETS PANE: vertical list of draggable widget tiles -->
        <div class="rb-widgets" id="rb-widgets">
          <div class="rb-palette-section" id="rb-palette"></div>
        </div>

        <!-- AI PANE -->
        <div class="rb-ai">
          <div class="rb-ai__card">
            <h2 class="rb-ai__title">
              <span aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.8l1.4 4.1a3 3 0 0 0 1.9 1.9l4.1 1.4-4.1 1.4a3 3 0 0 0-1.9 1.9L10 16.6l-1.4-4.1a3 3 0 0 0-1.9-1.9L2.6 9.2l4.1-1.4a3 3 0 0 0 1.9-1.9L10 1.8z"/></svg>
              </span>
              Build with AI
            </h2>
            <p class="rb-ai__desc">Describe the report you want and GoVocal AI will assemble the relevant widgets — methods used, participation, demographics and more — from your project data.</p>
            <textarea class="rb-ai__field" id="rb-ai-prompt" placeholder="e.g. A summary of the survey results with demographics and a participation timeline."></textarea>
            <button class="gv-btn primary" type="button" id="rb-ai-generate" style="width:100%;justify-content:center">Generate report</button>
          </div>
        </div>
      </aside>

      <!-- ══════════ CENTRE CANVAS (grey app shell) ══════════ -->
      <main class="gv-bo-cb-canvas rb-canvas">
        <!-- The white A4 report sheet -->
        <div class="rb-sheet" id="rb-sheet">
          <div class="rb-sheet__logo" aria-label="Tenant logo">
            <svg viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Raleigh">
              <g fill="#1F9D55">
                <path d="M30 6c-3 4-3 8-1 11 1-4 3-6 5-8-1 4-1 7 1 10 1-4 2-6 4-7-2 5-1 9 2 12-4 1-8 0-11-3-2 3-2 7 0 11-3-2-5-5-5-9-3 3-4 7-3 11-3-3-4-7-2-11-4 1-7 4-8 8-1-5 1-9 5-12-4-1-8 0-11 2 2-4 6-6 10-6-3-3-7-4-11-3 4-3 8-3 12-1-2-4-1-8 2-11 0 4 1 7 3 9 1-4 4-7 8-9-2 3-3 6-2 9 2-4 5-6 9-7-3 4-5 7-5 11 4-3 8-4 12-3-3 2-6 4-8 7 0 0 0 0 0 0z"/>
              </g>
              <rect x="29" y="34" width="3" height="20" fill="#7A5230"/>
              <text x="58" y="42" font-family="Public Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#044D6C">Raleigh</text>
            </svg>
          </div>
          <div id="rb-frame"></div>
        </div>
      </main>

      <!-- ══════════ RIGHT SETTINGS PANEL ══════════ -->
      <aside class="gv-bo-cb-settings" id="rb-settings" aria-label="Widget settings">
        <button class="gv-bo-cb-settings__close" type="button" id="rb-settings-close" aria-label="Close settings panel">
          <span class="gv-icon" data-gv-icon="close"></span>
        </button>
        <h2 class="gv-bo-cb-settings__title" id="rb-settings-title">Widget</h2>
        <div class="gv-bo-multiloc" id="rb-settings-locales">
          <button type="button" class="is-active" data-loc="en"><span class="done"></span>EN</button>
          <button type="button" data-loc="es-ES"><span class="miss"></span>ES-ES</button>
        </div>
        <div id="rb-settings-body"></div>
      </aside>
    </div>
  </div>

  <div class="rb-toast" id="rb-toast"></div>

  <script>
  (function () {
    var root   = document.getElementById('rb-root');
    var frame  = document.getElementById('rb-frame');
    var palette = document.getElementById('rb-palette');
    var panel  = document.getElementById('rb-settings');
    var sTitle = document.getElementById('rb-settings-title');
    var sBody  = document.getElementById('rb-settings-body');
    var toastEl = document.getElementById('rb-toast');
    var uid = 1;

    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add('is-show');
      clearTimeout(toast._t); toast._t = setTimeout(function () { toastEl.classList.remove('is-show'); }, 1400);
    }

    // ── widget catalogue (order + icon match the real reporting editor rail) ────
    // icon: a GVIcons name (rendered via data-gv-icon) OR an inline SVG string for
    // glyphs the canonical icon set lacks (reported back as page-local).
    var BAR = '<span class="rb-iconbars" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="11" width="3.2" height="6.5" rx="1" fill="currentColor"/><rect x="8.4" y="6" width="3.2" height="11.5" rx="1" fill="currentColor"/><rect x="14.3" y="8.5" width="3.2" height="9" rx="1" fill="currentColor"/></svg></span>';
    var WIDGETS = {
      'text':            { label: 'Text',                        icon: 'i_text' },
      'image':           { label: 'Image',                       icon: 'i_image' },
      'two-column':      { label: '2 column',                    icon: 'i_2col' },
      'white-space':     { label: 'White space',                 icon: 'i_ws' },
      'embed':           { label: 'Embed',                       icon: 'i_embed' },
      'survey-question': { label: 'Survey question',             icon: 'survey' },
      'most-reacted':    { label: 'Most reacted inputs',         icon: 'vote-up' },
      'input':           { label: 'Input',                       icon: 'location-simple' },
      'health-score':    { label: 'Community Monitor Health Score', icon: BAR },
      'visitor-timeline':{ label: 'Visitor timeline',            icon: BAR },
      'participants-timeline': { label: 'Participants timeline',  icon: BAR },
      'registrations-timeline':{ label: 'Registrations timeline', icon: BAR },
      'traffic-sources': { label: 'Traffic sources',             icon: BAR },
      'demographics':    { label: 'Demographics',                icon: BAR },
      'participation':   { label: 'Participation',               icon: BAR },
      'methods-used':    { label: 'Methods Used',                icon: BAR },
      'internal-adoption': { label: 'Internal adoption',         icon: BAR }
    };
    // Order of the palette list (matches the captured rail).
    var ORDER = ['text','image','two-column','white-space','embed',
      'survey-question','most-reacted','input','health-score','visitor-timeline',
      'participants-timeline','registrations-timeline','traffic-sources',
      'demographics','participation','methods-used','internal-adoption'];

    // page-local inline glyphs for the basic layout widgets (no fitting GVIcon)
    var LOCAL_ICONS = {
      i_text:  '<svg viewBox="0 0 20 20" fill="none"><path d="M4 4h12M10 4v12M7.5 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      i_image: '<svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="8" r="1.4" fill="currentColor"/><path d="M4 15l4.5-5 3 3 2-2L17 15" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
      i_2col:  '<svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="2.5" width="6" height="15" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11.5" y="2.5" width="6" height="15" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>',
      i_ws:    '<svg viewBox="0 0 20 14" fill="none"><path d="M2 5V2h3M18 5V2h-3M2 9v3h3M18 9v3h-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      i_embed: '<svg viewBox="0 0 20 20" fill="none"><path d="M7 6l-4 4 4 4M13 6l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    function iconHTML(icon) {
      if (icon && icon.charAt(0) === '<') return icon;                 // inline glyph (BAR)
      if (LOCAL_ICONS[icon]) return LOCAL_ICONS[icon];                 // page-local layout glyph
      return '<span class="gv-icon" data-gv-icon="' + icon + '"></span>'; // canonical GVIcon
    }

    // ── build the palette list ─────────────────────────────────────────────────
    ORDER.forEach(function (key) {
      var def = WIDGETS[key];
      var item = document.createElement('div');
      item.className = 'gv-bo-cb-item';
      item.setAttribute('draggable', 'true');
      item.setAttribute('data-widget', key);
      item.innerHTML = '<span class="gv-bo-cb-item__icon">' + iconHTML(def.icon) + '</span>' +
                       '<span class="gv-bo-cb-item__label">' + def.label + '</span>';
      palette.appendChild(item);
    });

    // ── widget content factories ────────────────────────────────────────────────
    function barChart() {
      var hs = [45, 80, 60, 95, 55, 70];
      var bars = hs.map(function (h) { return '<span class="rb-chart__bar" style="height:' + h + '%"></span>'; }).join('');
      return '<div class="rb-chart"><div class="rb-chart__bars">' + bars + '</div></div>';
    }
    // Most data widgets render the empty "no data" card in this fresh report.
    function noData(title) {
      return '<div class="rb-card"><p class="rb-card__title">' + title + '</p>' +
             '<p class="rb-nodata">There is no data available for the filters you have selected.</p></div>';
    }
    function widgetContent(key) {
      var def = WIDGETS[key];
      switch (key) {
        case 'text':        return '<p class="rb-text" contenteditable="true">This is some text. You can edit and format it by using the editor in the panel on the right.</p>';
        case 'image':       return '<div class="rb-card"><p class="rb-nodata">Click to upload an image for this report.</p></div>';
        case 'two-column':  return '<div class="rb-cols"><div class="rb-col"><p class="rb-text rb-text--placeholder">Column one</p></div><div class="rb-col"><p class="rb-text rb-text--placeholder">Column two</p></div></div>';
        case 'white-space': return '<div style="height:40px"></div>';
        case 'embed':       return '<div class="rb-card"><p class="rb-nodata">Paste a URL to embed external content.</p></div>';
        default:            return noData(def.label);   // every data widget = empty placeholder
      }
    }

    // ── settings panel bodies ────────────────────────────────────────────────────
    function settingsRow(label, control) {
      return '<div class="gv-bo-cb-settings__row"><span class="gv-bo-cb-settings__rowlabel">' + label + '</span>' + control + '</div>';
    }
    function bodyFor(key) {
      if (key === 'text') {
        return settingsRow('Style', '<select class="gv-bo-select"><option>Normal</option><option>Title</option><option>Subtitle</option></select>') +
               settingsRow('', '<p class="rb-nodata">Type directly in the report to edit this text.</p>');
      }
      if (key === 'image') {
        return settingsRow('Image', '<input class="gv-input" type="file" accept="image/*">') +
               settingsRow('Alt text', '<input class="gv-input" placeholder="Describe the image">');
      }
      if (key === 'two-column') {
        return settingsRow('Column layout', '<select class="gv-bo-select"><option>Equal</option><option>Wide / narrow</option><option>Narrow / wide</option></select>');
      }
      if (key === 'white-space') {
        return settingsRow('Height', '<select class="gv-bo-select"><option>Small</option><option selected>Medium</option><option>Large</option></select>');
      }
      if (key === 'embed') {
        return settingsRow('Embed URL', '<input class="gv-input" placeholder="https://…">');
      }
      // Data widgets share a project / phase / date filter set.
      return settingsRow('Project', '<select class="gv-bo-select"><option>Native Survey: Community Survey</option><option>All projects</option></select>') +
             settingsRow('Phase', '<select class="gv-bo-select"><option>All phases</option></select>') +
             settingsRow('Date range', '<select class="gv-bo-select"><option>All time</option><option>Last 30 days</option><option>Last 90 days</option></select>') +
             settingsRow('Title', '<input class="gv-input" value="' + (WIDGETS[key] ? WIDGETS[key].label : '') + '">');
    }

    // ── selection ────────────────────────────────────────────────────────────────
    var selected = null;
    function deselect() {
      if (selected) selected.classList.remove('is-selected');
      selected = null; root.classList.remove('rb-has-panel');
    }
    function select(block) {
      if (selected) selected.classList.remove('is-selected');
      selected = block; block.classList.add('is-selected');
      root.classList.add('rb-has-panel');
      var key = block.getAttribute('data-widget');
      var def = WIDGETS[key] || {};
      sTitle.textContent = def.label || 'Widget';
      sBody.innerHTML = bodyFor(key);
      var del = document.createElement('button');
      del.className = 'gv-bo-cb-delete'; del.type = 'button';
      del.innerHTML = '<span class="gv-icon" data-gv-icon="delete"></span>Delete';
      sBody.appendChild(del);
      if (window.GVIcons) window.GVIcons.render(panel);
      del.addEventListener('click', function () {
        if (!selected) return;
        var b = selected; deselect(); b.parentNode.removeChild(b);
        toast('Widget removed');
      });
    }

    // ── block factory + wiring ─────────────────────────────────────────────────
    function makeBlock(key) {
      var def = WIDGETS[key] || WIDGETS.text;
      var block = document.createElement('div');
      block.className = 'gv-bo-cb-block rb-widget';
      block.setAttribute('data-widget', key);
      block.setAttribute('draggable', 'true');
      block.id = 'rb-block-' + (uid++);
      var tab = document.createElement('span');
      tab.className = 'gv-bo-cb-block__label';
      tab.textContent = def.label;
      block.appendChild(tab);
      var body = document.createElement('div');
      body.className = 'gv-bo-cb-block__body';
      body.innerHTML = widgetContent(key);
      block.appendChild(body);
      wireBlock(block);
      if (window.GVIcons) window.GVIcons.render(block);
      return block;
    }

    function wireBlock(block) {
      block.addEventListener('click', function (e) {
        e.stopPropagation(); select(block);
      });
      block.addEventListener('dragstart', function (e) {
        e.stopPropagation(); clearLine();
        dragData = { mode: 'move', el: block }; block.classList.add('is-dragging');
        try { e.dataTransfer.setData('text/plain', 'move'); } catch (x) {}
        e.dataTransfer.effectAllowed = 'move';
      });
      block.addEventListener('dragend', function () { block.classList.remove('is-dragging'); clearLine(); });
    }

    // ── drag + drop into the report frame ───────────────────────────────────────
    var dragData = null, line = null;
    function clearLine() { if (line && line.parentNode) line.parentNode.removeChild(line); }
    function makeLine() {
      if (!line) { line = document.createElement('div'); line.className = 'gv-bo-cb-dropline'; }
      return line;
    }
    function childUnder(y) {
      var kids = frame.children;
      for (var i = 0; i < kids.length; i++) {
        var c = kids[i];
        if (!c.classList || !c.classList.contains('gv-bo-cb-block')) continue;
        var r = c.getBoundingClientRect();
        if (y < r.top + r.height / 2) return c;
      }
      return null;
    }
    frame.addEventListener('dragover', function (e) {
      if (!dragData) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = dragData.mode === 'move' ? 'move' : 'copy';
      var ln = makeLine(); var before = childUnder(e.clientY);
      if (before && before === dragData.el) { clearLine(); return; }
      if (before) frame.insertBefore(ln, before); else frame.appendChild(ln);
    });
    frame.addEventListener('drop', function (e) {
      if (!dragData) return;
      e.preventDefault();
      var ln = line && line.parentNode ? line : null;
      if (dragData.mode === 'add') {
        var block = makeBlock(dragData.widget);
        if (ln) frame.insertBefore(block, ln); else frame.appendChild(block);
        select(block); toast('Added: ' + (WIDGETS[dragData.widget] ? WIDGETS[dragData.widget].label : dragData.widget));
      } else if (dragData.mode === 'move' && dragData.el) {
        if (ln) frame.insertBefore(dragData.el, ln); else frame.appendChild(dragData.el);
        toast('Widget moved');
      }
      clearLine(); dragData = null;
    });

    // palette drag start + click-to-append
    palette.querySelectorAll('.gv-bo-cb-item').forEach(function (item) {
      item.addEventListener('dragstart', function (e) {
        clearLine(); dragData = { mode: 'add', widget: item.getAttribute('data-widget') };
        item.classList.add('is-dragging');
        try { e.dataTransfer.setData('text/plain', item.getAttribute('data-widget')); } catch (x) {}
        e.dataTransfer.effectAllowed = 'copy';
      });
      item.addEventListener('dragend', function () { item.classList.remove('is-dragging'); clearLine(); });
      // click appends a widget (no-drag fallback so the page is clickable)
      item.addEventListener('click', function () {
        var block = makeBlock(item.getAttribute('data-widget'));
        frame.appendChild(block); select(block);
        toast('Added: ' + (WIDGETS[item.getAttribute('data-widget')] || {}).label);
        block.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
    });

    // deselect on empty canvas / sheet click
    document.querySelector('.rb-canvas').addEventListener('click', function (e) {
      if (e.target === this || e.target.id === 'rb-sheet' || e.target === frame) deselect();
    });
    document.getElementById('rb-settings-close').addEventListener('click', deselect);

    // ── rail tab switching (Widgets / AI) ───────────────────────────────────────
    document.querySelectorAll('.rb-railtab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.rb-railtab').forEach(function (t) { t.classList.remove('is-active'); t.setAttribute('aria-selected', 'false'); });
        tab.classList.add('is-active'); tab.setAttribute('aria-selected', 'true');
        root.classList.toggle('rb-tab-ai', tab.getAttribute('data-tab') === 'ai');
      });
    });
    document.getElementById('rb-ai-generate').addEventListener('click', function () { toast('Generating report with AI…'); });

    // multiloc + top-bar buttons
    var locBtns = document.querySelectorAll('#rb-settings-locales button');
    locBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        locBtns.forEach(function (x) { x.classList.remove('is-active'); });
        b.classList.add('is-active'); toast('Editing ' + b.getAttribute('data-loc').toUpperCase());
      });
    });
    document.getElementById('rb-locale-select').addEventListener('change', function () { toast('Language: ' + this.value.toUpperCase()); });
    document.getElementById('rb-save-wrap').addEventListener('click', function () { toast('Report saved'); });
    document.getElementById('rb-download').addEventListener('click', function () { toast('Preparing PDF…'); });

    // ── seed the default report (mirrors the captured "Survey report 2") ─────────
    function seedStatic(html) {
      var d = document.createElement('div');
      d.innerHTML = html; while (d.firstChild) frame.appendChild(d.firstChild);
    }
    // Title block (locked-look heading in a bordered box) + meta list + summary
    seedStatic(
      '<div class="gv-bo-cb-block rb-widget" data-widget="text" id="rb-block-title"><span class="gv-bo-cb-block__label">Text</span>' +
        '<div class="gv-bo-cb-block__body">' +
          '<h1 class="rb-h1" contenteditable="true">Survey report 2</h1>' +
          '<ul class="rb-meta"><li>Project: Native Survey: Community Survey</li><li>Period:</li><li>Project manager: Wietse Van Ransbeeck</li></ul>' +
          '<h2 class="rb-h2">Report summary</h2>' +
          '<p class="rb-text rb-text--placeholder" contenteditable="true">Add the goal of the project, participation methods used, and the outcome</p>' +
        '</div></div>'
    );
    // Project results section
    var results = makeBlock('text');
    results.querySelector('.gv-bo-cb-block__body').innerHTML =
      '<h2 class="rb-h2">Project results</h2>' +
      '<p class="rb-text" contenteditable="true">This is some text. You can edit and format it by using the editor in the panel on the right.</p>';
    frame.appendChild(results);
    // A few data widgets in their empty state
    frame.appendChild(makeBlock('participants-timeline'));
    var part = makeBlock('participation');
    frame.appendChild(part);
    // wire the statically-seeded title block
    var titleBlock = document.getElementById('rb-block-title');
    wireBlock(titleBlock);

    if (window.GVIcons) window.GVIcons.render(document);
  })();
  </script>
</body>
</html>
