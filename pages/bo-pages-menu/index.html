<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pages &amp; menu — GoVocal back office (reference)</title>
  <meta name="gv-surface" content="back-office" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-bo.css" />
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: var(--gv-bo-canvas); font-family: var(--gv-font-family); }
    .pm-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
    .pm-head__main { max-width: 540px; }
    /* Real h1: 30px/700/#044D6C, line-height 39px (digest); canonical .gv-bo-pagehead is 28px/600 */
    .pm-title { margin: 0; font-size: var(--gv-fs-xxxl); font-weight: 700; line-height: 39px; color: var(--gv-bo-primary); }
    /* Real lede: 16px/400, #596B7A, line-height 24px, ~521px wide (digest) */
    .pm-lede { margin: 12px 0 0; font-size: var(--gv-fs-base); line-height: 24px; color: var(--gv-cool-grey-500); max-width: 522px; }
    .pm-head__actions { margin-left: auto; display: flex; align-items: center; gap: 14px; flex: none; }
    .pm-add-disabled { display: inline-flex; align-items: center; gap: 6px; color: var(--gv-cool-grey-500); font-size: var(--gv-fs-s); cursor: not-allowed; opacity: .55; }
    /* Real card title: 18px/500/#044D6C, line-height 30px (digest span "Pages shown…") */
    .pm-cardtitle { margin: 0 0 8px; font-size: var(--gv-fs-l); font-weight: 500; line-height: 30px; color: var(--gv-bo-primary); }
    .pm-card + .pm-card { margin-top: 24px; }
    /* Real rows are denser than canonical .gv-bo-listrow (18px 0): real div is padding 10px 0 (digest). */
    .pm-card .gv-bo-listrow { padding: 13px 0; }
    /* Real page-name title: 16px/500, #1E1E1E (digest "All projects" span) — not the canonical teal 18px. */
    .pm-card .gv-bo-listrow__title { font-size: var(--gv-fs-base); font-weight: 500; color: var(--gv-text-heading); gap: 0; }
    /* Real row buttons: secondary-outlined 14px, padding 9px 18px, grey #596B7A border, radius 3px (~45px tall).
       Edit text = #044D6C (bo-primary); View text = #4183C4 (link blue). Bigger than .size-s. */
    .pm-card .gv-bo-listrow__actions .gv-btn {
      padding: 9px 18px;
      font-size: var(--gv-fs-s);
      line-height: 16px;
      font-weight: 400;
      color: var(--gv-bo-primary);
      border-color: var(--gv-cool-grey-500);
      gap: 8px;
    }
    .pm-card .gv-bo-listrow__actions .gv-btn[data-view] { color: var(--gv-bo-link); }
    .pm-card .gv-bo-listrow__actions { gap: 10px; }
    /* DEFAULT badge now uses canonical .gv-badge.is-filled; just position it. */
    .pm-card .gv-badge.is-filled { margin-left: 15px; }
  </style>
</head>
<body class="gv-bo">
  <div class="gv-bo-shell">
    <nav class="gv-bo-side" aria-label="Admin" data-active="pages"></nav>

    <div class="gv-bo-main">
      <section class="gv-bo-section">
        <div class="pm-head">
          <div class="pm-head__main">
            <h1 class="pm-title">Pages &amp; menu</h1>
            <p class="pm-lede">Your navigation bar can display up to six pages in addition to the Home page. You can rename and reorder items and add new pages with your own content.</p>
          </div>
          <div class="pm-head__actions">
            <span class="pm-add-disabled"><span data-gv-icon="link"></span>Add project or folder to navbar</span>
            <button class="gv-btn admin-dark"><span data-gv-icon="plus"></span><span class="gv-btn__label">Create custom page</span></button>
          </div>
        </div>

        <div class="gv-bo-card pm-card">
          <h3 class="pm-cardtitle">Pages shown on your navigation bar</h3>
          <div id="navrows"></div>
        </div>

        <div class="gv-bo-card pm-card">
          <h3 class="pm-cardtitle">Other available pages</h3>
          <div id="otherrows"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="bo-chrome.js"></script>
  <script>
    function actionBtn(label, icon, muted) {
      const isView = label === "View";
      return `<button class="gv-btn secondary-outlined"${isView ? ' data-view' : ''}${muted ? ' style="color:var(--gv-cool-grey-400);border-color:var(--gv-grey-300);cursor:not-allowed;opacity:.65"' : ''}><span data-gv-icon="${icon}"></span><span class="gv-btn__label">${label}</span></button>`;
    }
    // [name, locked, isDefault, candelete, removable]
    const NAV = [
      ["Home", true, true, false, false],
      ["All projects", false, true, false, true],
      ["Proposals", false, false, false, true],
      ["Events", false, true, false, true],
      ["Testing a larger name", false, true, false, true],
      ["About", false, false, true, true],
      ["FAQ", false, false, true, true],
    ];
    document.getElementById("navrows").innerHTML = NAV.map(([name, locked, def, del, removable]) => {
      const badge = def ? `<span class="gv-badge is-filled">Default</span>` : "";
      const grip = `<span class="gv-bo-listrow__handle" data-gv-icon="drag-handle"></span>`;
      const lead = locked
        ? `<span class="gv-bo-listrow__handle" data-gv-icon="lock"></span>`
        : grip;
      let actions = actionBtn("Edit", "pen") + actionBtn("View", "eye");
      if (del) actions += actionBtn("Delete", "delete");
      if (removable) actions += actionBtn("Remove from navbar", "close");
      return `<div class="gv-bo-listrow">
        ${lead}
        <div class="gv-bo-listrow__main"><h4 class="gv-bo-listrow__title"><a href="#">${name}</a> ${badge}</h4></div>
        <div class="gv-bo-listrow__actions">${actions}</div>
      </div>`;
    }).join("");

    const OTHER = [["Chapel Hill"], ["Proposals"]];
    document.getElementById("otherrows").innerHTML = OTHER.map(([name]) => `
      <div class="gv-bo-listrow">
        <div class="gv-bo-listrow__main"><h4 class="gv-bo-listrow__title"><a href="#">${name}</a></h4></div>
        <div class="gv-bo-listrow__actions">${actionBtn("Edit","pen")}${actionBtn("View","eye")}${actionBtn("Delete","delete")}${actionBtn("Add to navbar","plus",true)}</div>
      </div>`).join("");

    if (window.GVIcons) window.GVIcons.render(document.body);
  </script>
</body>
</html>
</content>
