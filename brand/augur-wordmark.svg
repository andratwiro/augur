<svg width="760" height="240" viewBox="0 0 760 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="augur">
  <!-- Horizontal lockup: mark + wordmark. Text is live <text>; outline it in Figma for distribution. -->
  <defs>
    <linearGradient id="goldw" x1="40" y1="60" x2="200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAD79A"/>
      <stop offset="1" stop-color="#E2A14E"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(40,70)" stroke="url(#goldw)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 50 C18 46 38 72 68 109 C98 72 118 46 136 50"/>
    <path d="M68 109 L68 135"/>
  </g>

  <!-- wordmark -->
  <text x="232" y="158"
        font-family="'Space Grotesk','Hanken Grotesk','Inter',system-ui,sans-serif"
        font-size="150" font-weight="500" letter-spacing="-4"
        fill="#EDE7F5">augur</text>
</svg>
