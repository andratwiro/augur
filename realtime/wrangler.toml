# augur-realtime — the multiplayer relay for canvas boards.
#
# One BoardRoom Durable Object per board path (same key as the KV doc): every visitor's
# WebSocket meets there, and the room relays cursors, presence, node ops, selections and
# editing focus between them. While a room is live it is ALSO the persister: it writes the
# doc to KV itself (BOARD_KV binding, dirty-flag alarm + flush-on-empty), so clients only
# POST /__board as the solo fallback. Rooms under /__test/ never persist.
#
# Deployed standalone (not via Pages): `npm run deploy:realtime` from the augur root,
# or  cd realtime && npx wrangler deploy  with .env.deploy sourced. The Pages worker
# proxies /__rt → this worker, so clients stay same-origin.

name = "augur-realtime"
main = "src/index.js"
compatibility_date = "2026-07-01"

# The board-doc KV namespace (same one the Pages worker's /__board rail uses) — the room
# persists the live doc itself; clients only write as the solo fallback.
[[kv_namespaces]]
binding = "BOARD_KV"
id = "98062803805e48a9a061cac648a1446f"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "BoardRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardRoom"]
