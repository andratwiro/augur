<!-- LINKED INSTANCE — this demo owns no banner markup; it imports GV.render('banner', props). -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Banner — GoVocal component</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Demo chrome only — the component styles (.gv-banner / .gv-banner__art /
       .gv-banner__sticker) live in the shared govocal-ui.css, never forked here. */
    body { margin: 0; background: var(--gv-grey-100); font-family: var(--gv-font-family); color: var(--gv-text-primary); }
    .demo { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
    .eyebrow { font-size: var(--gv-fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--gv-text-secondary); font-weight: 700; margin: 8px 0 4px; }
    .sub { margin: 0 0 20px; color: var(--gv-text-secondary); font-size: var(--gv-fs-s); }
  </style>
</head>
<body class="gv-root" data-gv-theme-picker="off">
  <div class="demo">
    <p class="eyebrow">Banner</p>
    <p class="sub">Image-only project hero: a full-width teal gradient art panel (1150×300) with an optional rotated campaign sticker. Drop an illustration <code>&lt;svg&gt;</code> inside <code>__art</code>.</p>

    <!-- Mount target — no .gv-* markup lives here -->
    <div id="banner-primary"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Primary instance — defaults: sticker "HAVE YOUR SAY", canonical SVG art
      GV.mount('#banner-primary', 'banner', {});

      GV.hydrate(document.getElementById('banner-primary'));
    });
  </script>
</body>
</html>
