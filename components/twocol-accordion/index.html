<!doctype html>
<!-- LINKED INSTANCE — this demo owns no twocol-accordion markup; it imports GV.render('twocol-accordion', props). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Two-column image + text + accordion (CB about + FAQ) — GoVocal component</title>
  <!-- References canonical assets directly — never copies or redefines a .gv-* class. -->
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Demo chrome only. The component is pure assembly of canonical primitives:
       .gv-cb-frame / .gv-cb-row.cols-2 / .gv-cb-col / .gv-cb-image / .gv-cb-textbox
       + .gv-prose + .gv-accordion. NO .gv-* class is defined or overridden here. */
    body { margin: 0; padding: 40px 0 80px; background: var(--gv-white); font-family: var(--gv-font-family); }
    .demo-label { max-width: 1200px; margin: 0 auto 12px; padding: 0 24px;
      font-size: var(--gv-fs-s); font-weight: 700; color: var(--gv-cool-grey-600); text-transform: uppercase; letter-spacing: .04em; }
    /* a flat photo stand-in for the left image cell (no real asset in the demo) */
    .ph { background: var(--gv-grey-200); border-radius: var(--gv-radius); aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center; color: var(--gv-cool-grey-500); font-size: var(--gv-fs-s); }
  </style>
</head>
<body class="gv-root" data-gv-theme="4">

  <p class="demo-label">CB section · cols-2 · image left + (h2 + intro + FAQ accordion) right — St Louis homepage "about + FAQ"</p>

  <!-- mount target — component markup injected by GV.render("twocol-accordion") -->
  <div id="twocol-accordion-mount"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      /* Primary instance — default props reproduce the HEAD St Louis "about + FAQ" section */
      GV.mount("#twocol-accordion-mount", "twocol-accordion", {});

      /* hydrate fills data-gv-icon glyphs (chevron-right) on the rendered DOM.
         The accordion expand/collapse is CSS-native <details> — no JS needed. */
      GV.hydrate(document.getElementById("twocol-accordion-mount"));
    });
  </script>

</body>
</html>
