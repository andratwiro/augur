<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Poll method body — GoVocal component</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-themes.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <style>
    /* Page-local layout only — no .gv-* redefinitions, no grounded visual values. */
    body { margin: 0; background: var(--gv-grey-200); font-family: var(--gv-font-family); }
    .stage { max-width: 1166px; margin: 0 auto; padding: 40px 20px 80px; }
    .heading { color: var(--gv-text-pagetitle); font-size: 25px; font-weight: 700; line-height: 32.5px; margin: 0 0 24px; }
  </style>
</head>
<body class="gv-root">

  <!-- ════════ Sticky participation bar (REUSED .gv-partbar) ════════
       'Open for participation · Take the poll' — the shell-authority CTA band. -->
  <div class="gv-partbar" role="region" aria-label="Poll participation status">
    <div class="gv-partbar__inner">
      <span class="gv-partbar__status">Open for participation</span>
      <a class="gv-btn on-color" href="#poll">Take the poll <span data-gv-icon="arrow-right" aria-hidden="true"></span></a>
    </div>
  </div>

  <div class="stage">
    <h2 class="heading">Poll</h2>

    <!-- ════════ Poll body (.gv-poll) — questions + options + Send ════════ -->
    <form class="gv-poll e2e-poll-form" id="poll" aria-label="Poll">

      <fieldset class="gv-poll__question e2e-poll-question">
        <div class="gv-poll__qhead">
          <span class="gv-poll__num" aria-hidden="true">1</span>
          <legend class="gv-poll__label">Select your age range</legend>
        </div>
        <div class="gv-poll__options" role="radiogroup">
          <label class="gv-radio e2e-poll-option"><input type="radio" name="q1"><span class="circle" aria-hidden="true"></span> Under 25</label>
          <label class="gv-radio e2e-poll-option"><input type="radio" name="q1"><span class="circle" aria-hidden="true"></span> 25-45</label>
          <label class="gv-radio e2e-poll-option"><input type="radio" name="q1"><span class="circle" aria-hidden="true"></span> 45-65</label>
          <label class="gv-radio e2e-poll-option"><input type="radio" name="q1"><span class="circle" aria-hidden="true"></span> 65 and Above</label>
        </div>
      </fieldset>

      <fieldset class="gv-poll__question e2e-poll-question">
        <div class="gv-poll__qhead">
          <span class="gv-poll__num" aria-hidden="true">2</span>
          <legend class="gv-poll__label">Do you support closing river-side streets to through traffic on weekends?</legend>
        </div>
        <div class="gv-poll__options" role="radiogroup">
          <label class="gv-radio e2e-poll-option"><input type="radio" name="q2"><span class="circle" aria-hidden="true"></span> Strongly support</label>
          <label class="gv-radio e2e-poll-option"><input type="radio" name="q2"><span class="circle" aria-hidden="true"></span> Somewhat support</label>
          <label class="gv-radio e2e-poll-option"><input type="radio" name="q2"><span class="circle" aria-hidden="true"></span> Neutral</label>
          <label class="gv-radio e2e-poll-option"><input type="radio" name="q2"><span class="circle" aria-hidden="true"></span> Oppose</label>
        </div>
      </fieldset>

      <fieldset class="gv-poll__question e2e-poll-question">
        <div class="gv-poll__qhead">
          <span class="gv-poll__num" aria-hidden="true">3</span>
          <legend class="gv-poll__label">Which improvements would you use? (Select all that apply)</legend>
        </div>
        <div class="gv-poll__options">
          <label class="gv-checkbox e2e-poll-option"><input type="checkbox" name="q3"><span class="box" aria-hidden="true">✓</span> Protected bike lanes</label>
          <label class="gv-checkbox e2e-poll-option"><input type="checkbox" name="q3"><span class="box" aria-hidden="true">✓</span> Wider pavements</label>
          <label class="gv-checkbox e2e-poll-option"><input type="checkbox" name="q3"><span class="box" aria-hidden="true">✓</span> More benches & greenery</label>
          <label class="gv-checkbox e2e-poll-option"><input type="checkbox" name="q3"><span class="box" aria-hidden="true">✓</span> Better lighting</label>
        </div>
      </fieldset>

      <div class="gv-poll__send e2e-send-poll">
        <button type="submit" class="gv-btn primary full" disabled>Send</button>
      </div>
    </form>
  </div>

</body>
</html>
