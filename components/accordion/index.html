<!doctype html>
<!-- LINKED INSTANCE — this demo owns no accordion markup; it imports GV.render('accordion', props). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Accordion — GoVocal component</title>
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-tokens.css" />
  <link rel="stylesheet" href="../../skills/govocal-ui/govocal-ui.css" />
  <script src="../../skills/govocal-ui/govocal-icons.js" defer></script>
  <script src="../../skills/govocal-ui/govocal-instances.js" defer></script>
  <style>
    /* Demo chrome only — the component styles (.gv-accordion / .gv-acc__item /
       .gv-acc__head / .gv-acc__body / .gv-acc__chev) live in the shared
       govocal-ui.css, never forked here. */
    body { margin: 0; background: var(--gv-grey-100); font-family: var(--gv-font-family); color: var(--gv-text-primary); }
    .demo { max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; }
    .eyebrow { font-size: var(--gv-fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--gv-text-secondary); font-weight: 700; margin: 8px 0 4px; }
    .sub { margin: 0 0 20px; color: var(--gv-text-secondary); font-size: var(--gv-fs-s); }
    .card { background: var(--gv-white); border-radius: var(--gv-radius); padding: 4px 24px 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  </style>
</head>
<body class="gv-root" data-gv-theme-picker="off">
  <div class="demo">
    <p class="eyebrow">Accordion</p>
    <p class="sub">CSS-only <code>&lt;details&gt;</code> accordion — collapsed by default, chevron rotates on open. Used for FAQs in a project description.</p>

    <div class="card" id="accordion-mount"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      /* Render the primary instance (default props = HEAD's three Westmere FAQ items) */
      GV.mount("#accordion-mount", "accordion", {});

      /* hydrate fills data-gv-icon glyphs on the rendered DOM */
      GV.hydrate(document.getElementById("accordion-mount"));
    });
  </script>
</body>
</html>
