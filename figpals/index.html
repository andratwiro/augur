<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your FigPal 🐾</title>
<style>
  :root {
    --ink:#2B2330; --muted:#8b7e96; --card:#fff; --line:#efe6f2; --accent:#7C5CFC;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    min-height:100vh;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 560px at 82% -10%, #EDE9FE, transparent 60%),
      radial-gradient(820px 460px at 8% 112%, #fff2f8, transparent 55%),
      linear-gradient(160deg, #FDF2F8, #fffdfe 72%);
    display:grid; place-items:center; padding:28px;
  }
  .card {
    background: var(--card); border:1px solid var(--line); border-radius:28px;
    padding:30px 30px 26px; width:100%; max-width:400px;
    box-shadow: 0 34px 70px -34px rgba(124,92,252,.4), 0 2px 0 #fff inset;
    position:relative; z-index:2;
  }
  h1 { margin:0 0 3px; font-size:24px; letter-spacing:-.5px; text-align:center; }
  .sub { margin:0 0 18px; color:var(--muted); font-size:14px; text-align:center; }

  .stage {
    background: linear-gradient(170deg,#F7F1FF,#FDEFF6);
    border-radius:20px; height:200px; display:grid; place-items:center;
    margin-bottom:18px; position:relative; overflow:hidden;
  }
  .stage .portrait { width:150px; height:150px; }
  .stage .portrait svg { width:100%; height:100%; display:block; }
  .ground { position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
            width:120px; height:20px; border-radius:50%; background:rgba(120,80,140,.10); }

  label { display:block; font-size:11px; font-weight:800; color:var(--muted);
          margin:0 0 8px; text-transform:uppercase; letter-spacing:.07em; }
  .field { margin-bottom:16px; }
  input[type=text] {
    width:100%; font:inherit; font-size:16px; padding:12px 14px;
    border:2px solid var(--line); border-radius:14px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(124,92,252,.15); }

  .swatches { display:flex; gap:9px; flex-wrap:wrap; }
  .sw { width:32px; height:32px; border-radius:50%; border:3px solid #fff; cursor:pointer;
        box-shadow:0 0 0 1px var(--line), 0 4px 8px -4px rgba(0,0,0,.25); transition:transform .12s; }
  .sw:hover { transform:scale(1.12); }
  .sw.sel { box-shadow:0 0 0 3px var(--accent); transform:scale(1.12); }

  .row { display:flex; gap:10px; margin-top:6px; }
  .btn { flex:1; font:inherit; font-weight:800; border:none; cursor:pointer; border-radius:14px;
         padding:13px; background:var(--accent); color:#fff; box-shadow:0 8px 18px -8px var(--accent);
         transition:transform .12s, filter .12s; }
  .btn:hover { transform:translateY(-1px); filter:brightness(1.05); }
  .btn:active { transform:translateY(1px) scale(.99); }
  .btn.ghost { background:#f6f1fb; color:var(--accent); box-shadow:none; flex:0 0 auto; padding:13px 16px; }

  .saved { text-align:center; color:var(--accent); font-weight:700; font-size:13px;
           height:18px; margin-top:12px; opacity:0; transition:opacity .2s; }
  .saved.show { opacity:1; }
  .hint { text-align:center; color:var(--muted); font-size:12px; margin-top:6px; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <h1>Customize your FigPal</h1>
    <p class="sub">A little friend to keep you company while you work 💕</p>

    <div class="stage">
      <div class="ground"></div>
      <div class="portrait" id="portrait"></div>
    </div>

    <div class="field">
      <label>Name</label>
      <input type="text" id="name" maxlength="18" placeholder="e.g. Mochi" autocomplete="off" />
    </div>

    <div class="field">
      <label>Colour</label>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="row">
      <button class="btn ghost" id="surprise" title="Surprise me">🎲</button>
      <button class="btn" id="save">Save</button>
    </div>

    <div class="saved" id="saved">Saved! Your pal is following you 🐾</div>
    <p class="hint">Your FigPal trails your cursor around the prototypes.<br>Type <b>figbye</b> anywhere to send it away · <b>figpal</b> to bring it back.</p>
  </div>

<script src="figpal.js"></script>
<script>
  const cfg = FigPal.loadConfig();
  const portrait = document.getElementById('portrait');
  const swatches = document.getElementById('swatches');
  const nameInput = document.getElementById('name');
  nameInput.value = cfg.name === 'Pal' ? '' : cfg.name;

  function drawPortrait() { portrait.innerHTML = FigPal.svg(cfg, { pose: 'up' }); }

  FigPal.PALETTE.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'sw' + (i === cfg.furIdx ? ' sel' : '');
    b.style.background = p.fur;
    b.title = p.name;
    b.onclick = () => { cfg.furIdx = i; sync(); };
    swatches.appendChild(b);
  });

  // the live companion that walks the page (same engine as the site overlay)
  const pet = FigPal.mount({ size: 84 });

  function sync() {
    [...swatches.children].forEach((b, i) => b.classList.toggle('sel', i === cfg.furIdx));
    drawPortrait();
    pet.refresh(cfg);              // recolour the walking pal instantly (preview)
  }
  drawPortrait();

  document.getElementById('surprise').onclick = () => {
    cfg.furIdx = Math.floor(Math.random() * FigPal.PALETTE.length);
    sync();
  };

  function doSave() {
    cfg.name = (nameInput.value || 'Pal').trim().slice(0, 18);
    FigPal.saveConfig(cfg);
    try { localStorage.setItem('figpal-revealed', '1'); } catch (e) {}   // adopting reveals it site-wide
    pet.refresh();
    const s = document.getElementById('saved'); s.classList.add('show');
    setTimeout(() => s.classList.remove('show'), 2200);
  }
  document.getElementById('save').onclick = doSave;
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); });
</script>
</body>
</html>
