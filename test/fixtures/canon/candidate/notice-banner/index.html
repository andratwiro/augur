<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>notice-banner</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}
    .u1{box-sizing:border-box;width:480px;display:flex;gap:14px;align-items:center;padding:18px 20px;border-radius:11px;background:#dbe9e2}
    .u2{width:14px;height:14px;border-radius:999px;background:#2f6df6;flex:none}
    .u3{font-size:14px;line-height:21px;color:#22314d}
    .u4{box-sizing:border-box;width:480px;margin-top:12px;display:flex;gap:14px;align-items:center;padding:18px 20px;border-radius:11px;background:#dbe9e2}
</style></head>
<body>
  <div class="stage">
<div class="u1">
  <div class="u2"></div>
  <div class="u3">Four readings are waiting on a second measurement.</div>
</div>
<div class="u4">
  <div class="u2"></div>
  <div class="u3">Nothing else needs your attention today.</div>
</div>
  </div>
</body></html>
