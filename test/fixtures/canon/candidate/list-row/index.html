<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>list-row</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}
    .u1{width:460px;margin:0 auto;background:#ffffff;border:1px solid #dfe3ea;border-radius:11px;overflow:hidden}
    .u2{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid #eef0f4}
    .u3{width:34px;height:34px;border-radius:8px;background:#e4f4ea;flex:none}
    .u4{flex:1;font-size:14px;font-weight:600;line-height:20px}
    .u5{box-sizing:border-box;padding:4px 11px;border-radius:999px;background:#eceef3;color:#4a5162;font-size:12px;font-weight:600;line-height:17px}
    .u6{width:34px;height:34px;border-radius:8px;background:#fdf0d8;flex:none}
    .u7{display:flex;gap:14px;align-items:center;padding:14px 16px}
    .u8{width:34px;height:34px;border-radius:8px;background:#fbe4e4;flex:none}
</style></head>
<body>
  <div class="stage">
<div class="u1">
  <div class="u2">
    <div class="u3"></div>
    <div class="u4">Surface tension</div>
    <div class="u5">12</div>
  </div>
  <div class="u2">
    <div class="u6"></div>
    <div class="u4">Ambient light</div>
    <div class="u5">7</div>
  </div>
  <div class="u7">
    <div class="u8"></div>
    <div class="u4">Soil moisture</div>
    <div class="u5">3</div>
  </div>
</div>
  </div>
</body></html>
