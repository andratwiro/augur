<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>text-field</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}

    .u4{font-size:12px;line-height:17px;color:#6d7486;margin-top:8px}
</style></head>
<body>
  <div class="stage">
<div class="u1">
  <div class="u2">Workspace name</div>
  <div class="u3">field-readings</div>
  <div class="u4">Lower case, hyphens, no spaces.</div>
</div>
  </div>
</body></html>
