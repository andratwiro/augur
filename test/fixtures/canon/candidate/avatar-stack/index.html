<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>avatar-stack</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}
    .u1{display:flex;gap:14px;align-items:center;justify-content:center}
    .u2{width:52px;height:52px;border-radius:999px;background:#2f6df6}
    .u3{width:52px;height:52px;border-radius:999px;background:#1f9d6d}
    .u4{width:52px;height:52px;border-radius:999px;background:#d0742a}
    .u5{width:52px;height:52px;border-radius:999px;background:#8452c7}
    .u6{box-sizing:border-box;width:52px;height:52px;border-radius:999px;background:#eceef3;border:1px dashed #b7bfcd}
</style></head>
<body>
  <div class="stage">
<div class="u1">
  <div class="u2"></div>
  <div class="u3"></div>
  <div class="u4"></div>
  <div class="u5"></div>
  <div class="u6"></div>
</div>
  </div>
</body></html>
