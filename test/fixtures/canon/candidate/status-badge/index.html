<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>status-badge</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}
    .u1{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
    .u2{box-sizing:border-box;padding:6px 14px;border-radius:999px;background:#e4f4ea;color:#1f6b40;font-size:13px;font-weight:600;line-height:18px}
    .u3{box-sizing:border-box;padding:6px 14px;border-radius:999px;background:#fdf0d8;color:#7a5510;font-size:13px;font-weight:600;line-height:18px}
    .u4{box-sizing:border-box;padding:6px 14px;border-radius:999px;background:#fbe4e4;color:#8a2626;font-size:13px;font-weight:600;line-height:18px}
    .u5{box-sizing:border-box;padding:6px 14px;border-radius:999px;background:#eceef3;color:#4a5162;font-size:13px;font-weight:600;line-height:18px}
</style></head>
<body>
  <div class="stage">
<div class="u1">
  <div class="u2">Ready</div>
  <div class="u3">In progress</div>
  <div class="u4">Blocked</div>
  <div class="u5">Archived</div>
</div>
  </div>
</body></html>
