<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>action-button</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}
    .u1{display:flex;gap:12px;align-items:center;justify-content:center}
    .u2{box-sizing:border-box;padding:13px 26px;border-radius:9px;background:#2f6df6;color:#ffffff;font-size:15px;font-weight:600;line-height:20px}
    .u3{box-sizing:border-box;padding:13px 26px;border-radius:9px;background:#ffffff;border:1px solid #cdd4e0;color:#41495a;font-size:15px;font-weight:600;line-height:20px}
</style></head>
<body>
  <div class="stage">
<div class="u1">
  <div class="u2">Save changes</div>
  <div class="u3">Discard</div>
</div>
  </div>
</body></html>
