<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>summary-card</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}
    .u1{box-sizing:border-box;width:480px;background:#ffffff;border:1px solid #dfe3ea;border-radius:12px;overflow:hidden}
    .u2{height:44px;background:#2f6df6}
    .u3{box-sizing:border-box;padding:28px 20px 12px}
    .u4{font-size:17px;font-weight:700;line-height:24px}
    .u5{font-size:14px;line-height:21px;color:#5a6274;margin-top:6px}
    .u6{height:1px;background:#e7eaf0;margin-top:14px}
    .u7{box-sizing:border-box;margin-top:14px;display:inline-block;padding:8px 16px;border-radius:8px;background:#eef3fe;color:#2f6df6;font-size:13px;font-weight:600;line-height:18px}
</style></head>
<body>
  <div class="stage">
<div class="u1">
  <div class="u2"></div>
  <div class="u3">
    <div class="u4">Quarterly summary</div>
    <div class="u5">Eleven measurements landed this period.</div>
    <div class="u6"></div>
    <div class="u7">Open report</div>
  </div>
</div>
  </div>
</body></html>
