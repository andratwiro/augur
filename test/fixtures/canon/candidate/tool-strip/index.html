<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tool-strip</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}
    .u1{box-sizing:border-box;width:400px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:9px;background:#ffffff;border:1px solid #dfe3ea;border-radius:12px}
    .u2{width:36px;height:36px;border-radius:8px;background:#2f6df6}
    .u3{width:36px;height:36px;border-radius:8px;background:#eceef3}
    .u4{width:1px;height:24px;background:#dfe3ea;margin:0 4px}
    .u5{flex:1}
    .u6{box-sizing:border-box;padding:8px 15px;border-radius:8px;background:#1d2330;color:#ffffff;font-size:13px;font-weight:600;line-height:18px}
</style></head>
<body>
  <div class="stage">
<div class="u1">
  <div class="u2"></div>
  <div class="u3"></div>
  <div class="u3"></div>
  <div class="u4"></div>
  <div class="u3"></div>
  <div class="u3"></div>
  <div class="u5"></div>
  <div class="u6">Run</div>
</div>
  </div>
</body></html>
