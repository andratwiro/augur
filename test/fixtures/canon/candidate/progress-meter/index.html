<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>progress-meter</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}
    .u1{width:440px;margin:0 auto}
    .u2{display:flex;align-items:baseline;justify-content:space-between}
    .u3{font-size:14px;font-weight:600;line-height:20px}
    .u4{font-size:14px;font-weight:700;line-height:20px;color:#2f6df6}
    .u5{margin-top:12px;height:10px;border-radius:999px;background:#e4e8f0;overflow:hidden}
    .u6{width:299px;height:10px;border-radius:999px;background:#2f6df6}
    .u7{font-size:12px;line-height:17px;color:#6d7486;margin-top:10px}
</style></head>
<body>
  <div class="stage">
<div class="u1">
  <div class="u2">
    <div class="u3">Components verified</div>
    <div class="u4">68%</div>
  </div>
  <div class="u5">
    <div class="u6"></div>
  </div>
  <div class="u7">340 of 500 measured. The rest resume on the next run.</div>
</div>
  </div>
</body></html>
