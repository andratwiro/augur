<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>choice-box</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}
    .u1{width:400px;margin:0 auto}
    .u2{display:flex;gap:12px;align-items:center;padding:9px 0}
    .u3{box-sizing:border-box;width:20px;height:20px;border-radius:5px;background:#2f6df6;flex:none}
    .u4{font-size:14px;line-height:20px}
    .u5{box-sizing:border-box;width:20px;height:20px;border-radius:5px;background:#ffffff;border:1px solid #cdd4e0;flex:none}
</style></head>
<body>
  <div class="stage">
<div class="u1">
  <div class="u2">
    <div class="u3"></div>
    <div class="u4">Re-render every component</div>
  </div>
  <div class="u2">
    <div class="u5"></div>
    <div class="u4">Keep the previous shots</div>
  </div>
  <div class="u2">
    <div class="u5"></div>
    <div class="u4">Write a diff image for each failure</div>
  </div>
</div>
  </div>
</body></html>
