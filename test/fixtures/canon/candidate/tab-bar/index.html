<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tab-bar</title>
<style>
    body{margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden}
    .stage{box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center}

    .u4{box-sizing:border-box;padding-bottom:10px;border-bottom:3px solid transparent;font-size:14px;font-weight:600;line-height:20px;color:#6d7486}
    .u5{height:1px;background:#e0e4ec}

<body>
  <div class="stage">
<div class="u1">
  <div class="u2">
    <div class="u3">Overview</div>
    <div class="u4">Readings</div>

</div>
  </div>
