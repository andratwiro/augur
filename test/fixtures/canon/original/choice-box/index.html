<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>choice-box</title></head>
<body style="margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden">
  <div style="box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center">
<div style="width:400px;margin:0 auto">
  <div style="display:flex;gap:12px;align-items:center;padding:9px 0">
    <div style="box-sizing:border-box;width:20px;height:20px;border-radius:5px;background:#2f6df6;flex:none"></div>
    <div style="font-size:14px;line-height:20px">Re-render every component</div>
  </div>
  <div style="display:flex;gap:12px;align-items:center;padding:9px 0">
    <div style="box-sizing:border-box;width:20px;height:20px;border-radius:5px;background:#ffffff;border:1px solid #cdd4e0;flex:none"></div>
    <div style="font-size:14px;line-height:20px">Keep the previous shots</div>
  </div>
  <div style="display:flex;gap:12px;align-items:center;padding:9px 0">
    <div style="box-sizing:border-box;width:20px;height:20px;border-radius:5px;background:#ffffff;border:1px solid #cdd4e0;flex:none"></div>
    <div style="font-size:14px;line-height:20px">Write a diff image for each failure</div>
  </div>
</div>
  </div>
</body></html>
