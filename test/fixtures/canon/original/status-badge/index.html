<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>status-badge</title></head>
<body style="margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden">
  <div style="box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center">
<div style="display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap">
  <div style="box-sizing:border-box;padding:6px 14px;border-radius:999px;background:#e4f4ea;color:#1f6b40;font-size:13px;font-weight:600;line-height:18px">Ready</div>
  <div style="box-sizing:border-box;padding:6px 14px;border-radius:999px;background:#fdf0d8;color:#7a5510;font-size:13px;font-weight:600;line-height:18px">In progress</div>
  <div style="box-sizing:border-box;padding:6px 14px;border-radius:999px;background:#fbe4e4;color:#8a2626;font-size:13px;font-weight:600;line-height:18px">Blocked</div>
  <div style="box-sizing:border-box;padding:6px 14px;border-radius:999px;background:#eceef3;color:#4a5162;font-size:13px;font-weight:600;line-height:18px">Archived</div>
</div>
  </div>
</body></html>
