<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>list-row</title></head>
<body style="margin:0;width:520px;height:280px;background:#f5f6f8;font-family:system-ui,sans-serif;color:#1d2330;-webkit-font-smoothing:antialiased;overflow:hidden">
  <div style="box-sizing:border-box;width:520px;height:280px;padding:20px;display:flex;flex-direction:column;justify-content:center">
<div style="width:460px;margin:0 auto;background:#ffffff;border:1px solid #dfe3ea;border-radius:11px;overflow:hidden">
  <div style="display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid #eef0f4">
    <div style="width:34px;height:34px;border-radius:8px;background:#e4f4ea;flex:none"></div>
    <div style="flex:1;font-size:14px;font-weight:600;line-height:20px">Surface tension</div>
    <div style="box-sizing:border-box;padding:4px 11px;border-radius:999px;background:#eceef3;color:#4a5162;font-size:12px;font-weight:600;line-height:17px">12</div>
  </div>
  <div style="display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid #eef0f4">
    <div style="width:34px;height:34px;border-radius:8px;background:#fdf0d8;flex:none"></div>
    <div style="flex:1;font-size:14px;font-weight:600;line-height:20px">Ambient light</div>
    <div style="box-sizing:border-box;padding:4px 11px;border-radius:999px;background:#eceef3;color:#4a5162;font-size:12px;font-weight:600;line-height:17px">7</div>
  </div>
  <div style="display:flex;gap:14px;align-items:center;padding:14px 16px">
    <div style="width:34px;height:34px;border-radius:8px;background:#fbe4e4;flex:none"></div>
    <div style="flex:1;font-size:14px;font-weight:600;line-height:20px">Soil moisture</div>
    <div style="box-sizing:border-box;padding:4px 11px;border-radius:999px;background:#eceef3;color:#4a5162;font-size:12px;font-weight:600;line-height:17px">3</div>
  </div>
</div>
  </div>
</body></html>
